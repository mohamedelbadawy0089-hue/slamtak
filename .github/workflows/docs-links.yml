---
# بوابة روابط الوثائق: تفشل عند أي رابط نسبي مكسور أو مرساة #قسم غير موجودة
# في docs/architecture أو docs/architecture-ar — بلا شبكة وبلا تبعيات.
name: docs-links

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/check-doc-links.mjs'
      - '.github/workflows/docs-links.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-doc-links.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: فحص روابط الوثائق والمراسي
        run: npm run --silent check:docs-links
