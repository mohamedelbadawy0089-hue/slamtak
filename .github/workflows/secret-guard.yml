name: secret-guard

# بوابة الأسرار: مهمتان تفشلان عند تسريب، ولكل منهما نطاق مختلف.
#   1) tracked-secrets: يقرأ شجرة Git الحالية (`git ls-files`) فيفشل إذا عاد
#      `.dev.vars` أو أي ملف `.env` إلى التتبّع، أو إذا حمل ملف متتبَّع مفتاحًا داخل
#      محتواه (JWT بدور `service_role` أو `sb_secret_…`)، أو إذا اختفت قاعدة التجاهل
#      التي تمنعه. `.dev.vars` كان متتبَّعًا على `main` ومعه مفتاح `service_role` من
#      2026-11-02 إلى 2026-11-26 دون أن يكشفه أي فحص، وفحص الأسماء وحده لا يكشف
#      مفتاحًا ملصوقًا في ملف JS أو JSON. والفحص على شجرة Git نفسها (git ls-files /
#      check-ignore) لا على مجلد العمل، فلا يحتاج تبعيات ولا قاعدة بيانات ولا شبكة.
#   2) gitleaks-new-commits: `gitleaks` على **الالتزامات الجديدة فقط** — مدى الحدث
#      (ما دفعه push إلى main، أو التزامات الـpull_request) بأنماط مفاتيح المزوّدين
#      العامة التي لا يعرفها الفحص الأول. ولا يفحص سجل Git كاملًا عن قصد: المفتاح
#      القديم ما زال في التاريخ ولم يُنظَّف، وسير يفشل دائمًا على تاريخ مؤكد التسريب
#      لا يكشف تسريبًا جديدًا ويُدرّب على تجاهل الفشل. أما الالتزام الذي يحذف المفتاح
#      فلا يُفشل المهمة: gitleaks يقرأ الأسطر المضافة لا المحذوفة.
# البوابات الأخرى: docs.yml (الوثائق) و security-invariants.yml (المخطط والصلاحيات)
# و supabase-health.yml (صحة المنصة).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tracked-secrets:
    name: tracked-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Self-test the gate
        run: node --test scripts/test-check-no-tracked-secrets.mjs

      - name: Fail on tracked .dev.vars / .env or embedded service_role key
        run: node scripts/check-no-tracked-secrets.mjs

  gitleaks-new-commits:
    name: gitleaks-new-commits
    # التشغيل اليدوي مستثنى قصدًا: gitleaks-action بلا حدث push/PR لا يحدد مدى،
    # فيفحص السجل كاملًا ويفشل على المفتاح القديم — عكس نطاق هذه المهمة.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read        # لازم لـcheckout
      pull-requests: read   # لازم لقراءة التزامات الـPR من الـAPI

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # مدى الحدث (base^..head) يحتاج الالتزامات محليًا لا HEAD وحده

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'          # قراءة فقط: بلا تعليق على الـPR
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'   # النتائج في سجل التشغيل، بلا أثر مرفوع

# لا يحتاج حسابًا شخصيًا إلى GITLEAKS_LICENSE؛ إن انتقل المستودع إلى منظمة لزم سرّ
# GITLEAKS_LICENSE وإلا فشلت الخطوة قبل الفحص.
