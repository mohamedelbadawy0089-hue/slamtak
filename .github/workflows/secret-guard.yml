name: secret-guard

# بوابة الأسرار: تفشل إذا عاد `.dev.vars` أو أي ملف `.env` إلى تتبّع Git، أو إذا
# اختفت قاعدة التجاهل التي تمنعه. `.dev.vars` كان متتبَّعًا على `main` ومعه مفتاح
# `service_role` من 2026-11-02 إلى 2026-11-26 دون أن يكشفه أي فحص.
# الفحص على شجرة Git نفسها (git ls-files / check-ignore) لا على مجلد العمل،
# فلا يحتاج تبعيات ولا قاعدة بيانات ولا شبكة: خطوة واحدة وثوانٍ.
# البوابات الأخرى: docs.yml (الوثائق) و security-invariants.yml (المخطط والصلاحيات)
# و supabase-health.yml (صحة المنصة).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tracked-secrets:
    name: tracked-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Fail on tracked .dev.vars / .env
        run: node scripts/check-no-tracked-secrets.mjs
