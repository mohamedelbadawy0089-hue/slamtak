name: security-invariants

# بوابة قبل الدمج: تبني المخطط من ملفات الهجرة على قاعدة جديدة، ثم تفشل عند أي
# تراجع في الأدوار أو الامتيازات أو RLS. الفحص على قاعدة الإنتاج يبقى يدويًا:
#   SUPABASE_DB_PASSWORD=... npm run check:security
# بوابات الوثائق الثلاث (check:docs-ar وcheck:docs-actions وcheck:docs-links)
# انتقلت إلى .github/workflows/docs.yml، فلا تُكرَّر هنا.
# مهمة tests تشغّل اختبارات node:test الدائمة: كانت محلية فقط، فكان يمكن كسر حارس
# المسار أو بوابة الأسرار أو منطق الجلسة دون أن يلاحظ أحد. لا تحتاج تبعيات ولا
# قاعدة بيانات ولا شبكة، فتعمل بلا npm ci في ثوانٍ.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # بوابة الأنواع: tsconfig يغطي src/ بما فيه ملفات .tsx، وفشل خيار jsx مرّ
  # سابقًا بلا فحص لأن لا مهمة كانت تشغّل tsc.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # مجلد الهجرات يحمل تاريخ النظام السابق (‎202610…‎): تفترض ملفاته مخططًا
      # و auth.users قائمين. البناء من الصفر يكون من هجرتَي المعمارية الجديدة.
      - name: Apply baseline migrations
        run: >-
          node scripts/apply-migrations.mjs
          supabase/migrations/20261108000001_init_schema.sql
          supabase/migrations/20261108000002_seed_and_harden.sql
          supabase/migrations/20261108000003_default_price_list_backfill.sql

      - name: Check security invariants
        run: npm run check:security

  # اختبارات الانحدار الدائمة (node:test).
  # test:secrets — بوابة الأسرار تفشل فعلًا عند مفتاح مسرّب
  # test:auth    — منطق جلسة الواجهة وعلامة الخطوة الثانية
  # test:start   — حارس مسار خادم التطوير: «..» مشفّرة وروابط رمزية خارج الجذر
  # test:isolation — عزل مخزنين وFEFO وصلاحيات وتزامن على قاعدة حقيقية بدور slamtak_app
  # (اختبار التزامن يفتح جلستين ويعتمد على قفل صفوف حقيقي، فلا يُستبدل بمعاملات متتابعة)
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # قاعدة حقيقية لاختبارات العزل: RLS لا تُختبر بقراءة نص الهجرة.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
      # غياب القاعدة في CI فشل صريح لا تخطٍّ صامت.
      ISOLATION_DB_REQUIRED: '1'
      # تفعيل صريح لكتابة test:isolation في CI: الحارس يرفض CI بلا هذا المتغيّر
      # لأن اختبار التزامن يُثبّت حركات (COMMIT) على القاعدة الموجَّه إليها.
      ISOLATION_DB_ALLOW_NONLOCAL: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test the secret gate
        run: npm run test:secrets

      - name: Test the auth session logic
        run: npm run test:auth

      - name: Test the dev-server path guard
        run: npm run test:start

      # المخطط من هجرتَي المعمارية الجديدة، كما في مهمة invariants.
      - name: Apply baseline migrations
        run: >-
          node scripts/apply-migrations.mjs
          supabase/migrations/20261108000001_init_schema.sql
          supabase/migrations/20261108000002_seed_and_harden.sql
          supabase/migrations/20261108000003_default_price_list_backfill.sql

      - name: Test warehouse isolation, FEFO, permissions and concurrency
        run: npm run test:isolation

      - name: Test the default price list and price backfill migration
        run: npm run test:prices
