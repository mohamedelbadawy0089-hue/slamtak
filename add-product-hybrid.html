<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج - المزامنة الهجينة</title>
    <script src="libs/supabase.min.js"></script>
    <script src="smart-sync-hybrid.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { 
            text-align: center; 
            color: #667eea; 
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group { margin-bottom: 20px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #555; 
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
            outline: none;
        }
        .save-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #sync-status {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .synced { background: #d4edda; color: #155724; }
        .pending { background: #fff3cd; color: #856404; }
        .failed { background: #f8d7da; color: #721c24; }
        
        .connection-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        .online { background: #28a745; }
        .offline { background: #dc3545; }
        
        .stats-card {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .stats-card h3 { margin-bottom: 15px; color: #333; }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: white;
            margin-bottom: 8px;
            border-radius: 5px;
        }
        .sync-now-btn {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="connection-badge" class="connection-badge online">🌐 متصل</div>
    
    <div class="container">
        <h1>🛍️ إضافة منتج جديد</h1>
        <p class="subtitle">نظام المزامنة الهجين - يعمل بدون إنترنت</p>
        
        <form id="productForm">
            <div class="form-group">
                <label>📦 اسم المنتج *</label>
                <input type="text" id="productName" required placeholder="مثال: آيفون 15">
            </div>
            
            <div class="form-group">
                <label>📝 الوصف</label>
                <textarea id="productDesc" rows="3" placeholder="وصف تفصيلي..."></textarea>
            </div>
            
            <div class="form-group">
                <label>💰 السعر (جنيه) *</label>
                <input type="number" id="productPrice" required placeholder="15000">
            </div>
            
            <div class="form-group">
                <label>📊 الكمية *</label>
                <input type="number" id="productQty" required placeholder="5">
            </div>
            
            <div class="form-group">
                <label>🏷️ الفئة</label>
                <select id="productCategory">
                    <option value="electronics">📱 إلكترونيات</option>
                    <option value="clothing">👕 ملابس</option>
                    <option value="food">🍔 أغذية</option>
                    <option value="home">🏠 منزل</option>
                    <option value="other">📦 أخرى</option>
                </select>
            </div>
            
            <button type="submit" class="save-btn" id="saveBtn">
                💾 حفظ المنتج
            </button>
            
            <div id="sync-status"></div>
        </form>
        
        <div class="stats-card">
            <h3>📊 إحصائيات المزامنة</h3>
            <div class="stat-row">
                <span>الإجمالي:</span>
                <span id="stat-total">0</span>
            </div>
            <div class="stat-row">
                <span>⏳ قيد الانتظار:</span>
                <span id="stat-pending">0</span>
            </div>
            <div class="stat-row">
                <span>✅ متزامن:</span>
                <span id="stat-synced">0</span>
            </div>
            <button class="sync-now-btn" onclick="forceSync()">
                🔄 مزامنة الآن
            </button>
        </div>
    </div>

    <script>
        // ✅ تهيئة Supabase
        window.SUPABASE_URL = 'https://iksjhjxwphmvthryfeae.supabase.co';
        window.SUPABASE_KEY = 'sb_publishable_0DUy2mtXS6m5S8PwTDAANQ_XWlzbu0G';
        window.supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

        // ✅ تحديث حالة الاتصال
        function updateConnectionStatus() {
            const badge = document.getElementById('connection-badge');
            if (navigator.onLine) {
                badge.textContent = '🌐 متصل';
                badge.className = 'connection-badge online';
            } else {
                badge.textContent = '📴 غير متصل';
                badge.className = 'connection-badge offline';
            }
        }
        
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        updateConnectionStatus();

        // ✅ تحديث الإحصائيات
        function updateStats() {
            const stats = window.hybridSync.getStats();
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-pending').textContent = stats.pending;
            document.getElementById('stat-synced').textContent = stats.synced;
        }

        // ✅ مزامنة يدوية
        async function forceSync() {
            const btn = document.querySelector('.sync-now-btn');
            btn.textContent = '⏳ جاري المزامنة...';
            btn.disabled = true;
            
            await window.hybridSync.processSyncQueue();
            updateStats();
            
            btn.textContent = '🔄 مزامنة الآن';
            btn.disabled = false;
        }

        // ✅ معالجة الحفظ
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري الحفظ...';
            
            const productData = {
                name: document.getElementById('productName').value,
                description: document.getElementById('productDesc').value,
                price: parseFloat(document.getElementById('productPrice').value),
                quantity: parseInt(document.getElementById('productQty').value),
                category: document.getElementById('productCategory').value
            };
            
            // ✅ استخدام نظام المزامنة الهجين
            const result = await window.hybridSync.smartSave(productData);
            
            if (result.success) {
                document.getElementById('productForm').reset();
                updateStats();
                
                // إذا تمت المزامنة فوراً
                if (result.synced) {
                    document.getElementById('sync-status').className = 'synced';
                }
            } else {
                document.getElementById('sync-status').className = 'failed';
                document.getElementById('sync-status').textContent = '❌ فشل الحفظ';
            }
            
            btn.disabled = false;
            btn.textContent = '💾 حفظ المنتج';
        });

        // ✅ التحقق من الجلسة
        async function checkSession() {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) {
                const localUser = localStorage.getItem('slamtak-user-id');
                if (!localUser) {
                    window.location.href = 'warehouse.html';
                }
            }
        }

        // ✅ تسجيل الخروج (يحافظ على البيانات المحلية)
        async function logout() {
            // 1. إنهاء الجلسة الرسمية فقط
            await window.supabaseClient.auth.signOut();

            // 2. مسح بيانات الجلسة فقط (وليس المنتجات!)
            sessionStorage.clear();

            // ❌ لا نمسح localStorage حتى تبقى المنتجات!
            // المنتجات (slamtak-products, slamtak-sync-queue) تُحفظ للمزامنة لاحقاً

            // 3. تحويل لصفحة Login
            window.location.href = 'warehouse.html';
        }

        // ✅ تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            checkSession();
            updateStats();
            setInterval(updateStats, 5000); // تحديث كل 5 ثواني
        });
    </script>
</body>
</html>
