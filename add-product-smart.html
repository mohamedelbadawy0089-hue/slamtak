<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج - نظام المزامنة الذكية</title>
    <script src="libs/supabase.min.js"></script>
    <script src="smart-sync.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
            outline: none;
        }
        .save-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .save-btn:hover {
            transform: translateY(-2px);
        }
        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #save-status {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .pending {
            background: #fff3cd;
            color: #856404;
        }
        .stats {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .stats h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 5px;
        }
        .connection-status {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
        }
        .online { background: #28a745; }
        .offline { background: #dc3545; }
    </style>
</head>
<body>
    <div id="connection-status" class="connection-status online">🌐 متصل</div>
    
    <div class="container">
        <h1>🛍️ إضافة منتج جديد</h1>
        <h3 style="text-align: center; color: #667eea; margin-bottom: 20px;">
            نظام المزامنة الذكية (Offline First)
        </h3>
        
        <form id="productForm">
            <div class="form-group">
                <label>📦 اسم المنتج</label>
                <input type="text" id="productName" required placeholder="مثال: موبايل سامسونج">
            </div>
            
            <div class="form-group">
                <label>📝 الوصف</label>
                <textarea id="productDesc" rows="3" placeholder="وصف المنتج..."></textarea>
            </div>
            
            <div class="form-group">
                <label>💰 السعر (جنيه)</label>
                <input type="number" id="productPrice" required placeholder="5000">
            </div>
            
            <div class="form-group">
                <label>📊 الكمية</label>
                <input type="number" id="productQty" required placeholder="10">
            </div>
            
            <div class="form-group">
                <label>🏷️ الفئة</label>
                <select id="productCategory">
                    <option value="electronics">إلكترونيات</option>
                    <option value="clothing">ملابس</option>
                    <option value="food">أغذية</option>
                    <option value="other">أخرى</option>
                </select>
            </div>
            
            <button type="submit" class="save-btn" id="saveBtn">
                💾 حفظ المنتج
            </button>
            
            <div id="save-status"></div>
        </form>
        
        <div class="stats">
            <h3>📊 إحصائيات المزامنة</h3>
            <div class="stat-item">
                <span>الإجمالي:</span>
                <span id="total-count">0</span>
            </div>
            <div class="stat-item">
                <span>⏳ قيد الانتظار:</span>
                <span id="pending-count">0</span>
            </div>
            <div class="stat-item">
                <span>✅ متزامن:</span>
                <span id="synced-count">0</span>
            </div>
        </div>
    </div>

    <script>
        // ✅ تهيئة Supabase
        window.SUPABASE_URL = 'https://iksjhjxwphmvthryfeae.supabase.co';
        window.SUPABASE_KEY = 'sb_publishable_0DUy2mtXS6m5S8PwTDAANQ_XWlzbu0G';
        window.supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

        // ✅ تحديث حالة الاتصال
        function updateConnectionStatus() {
            const statusEl = document.getElementById('connection-status');
            if (navigator.onLine) {
                statusEl.textContent = '🌐 متصل';
                statusEl.className = 'connection-status online';
            } else {
                statusEl.textContent = '📴 غير متصل';
                statusEl.className = 'connection-status offline';
            }
        }

        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        updateConnectionStatus();

        // ✅ تحديث الإحصائيات
        function updateStats() {
            const stats = window.smartSync.getSyncStats();
            document.getElementById('total-count').textContent = stats.total;
            document.getElementById('pending-count').textContent = stats.pending;
            document.getElementById('synced-count').textContent = stats.synced;
        }

        // ✅ معالجة إرسال النموذج
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري الحفظ...';
            
            // جمع بيانات المنتج
            const productData = {
                name: document.getElementById('productName').value,
                description: document.getElementById('productDesc').value,
                price: parseFloat(document.getElementById('productPrice').value),
                quantity: parseInt(document.getElementById('productQty').value),
                category: document.getElementById('productCategory').value
            };
            
            // ✅ استخدام نظام المزامنة الذكية
            const result = await window.smartSync.smartSave(productData);
            
            if (result.success) {
                // إعادة تعيين النموذج
                document.getElementById('productForm').reset();
                updateStats();
            } else {
                alert('❌ حدث خطأ في الحفظ');
            }
            
            btn.disabled = false;
            btn.textContent = '💾 حفظ المنتج';
        });

        // ✅ التحقق من تسجيل الدخول
        async function checkAuth() {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) {
                const localUser = localStorage.getItem('slamtak-user-id');
                if (!localUser) {
                    alert('⚠️ يجب تسجيل الدخول أولاً');
                    window.location.href = 'warehouse.html';
                }
            }
        }

        // ✅ تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            updateStats();
            
            // تحديث الإحصائيات كل 5 ثواني
            setInterval(updateStats, 5000);
        });
    </script>
</body>
</html>
