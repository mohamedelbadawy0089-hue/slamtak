<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلامتك - إضافة منتج جديد (v=10.0)</title>
<!-- Critical CSS - Inline for fastest render -->
<style>body{margin:0;padding:0;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}.form-container{background:rgba(255,255,255,0.95);border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.1);padding:40px;margin-top:50px;backdrop-filter:blur(10px)}.form-header{text-align:center;margin-bottom:40px;color:#333}.form-header h1{font-size:2.5rem;font-weight:bold;margin-bottom:10px;background:linear-gradient(45deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.form-group{margin-bottom:25px}.form-label{font-weight:600;color:#555;margin-bottom:8px;display:block}.form-control{border:2px solid #e0e0e0;border-radius:10px;padding:12px 15px;font-size:16px;transition:all 0.3s ease}.form-control:focus{border-color:#667eea;box-shadow:0 0 0 0.2rem rgba(102,126,234,0.25)}.btn-primary{background:linear-gradient(45deg,#667eea,#764ba2);border:none;border-radius:10px;padding:15px;font-size:18px;font-weight:600;color:white;transition:all 0.3s ease;width:100%}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,0.3)}.btn-secondary{background:#6c757d;border:none;border-radius:10px;padding:15px;font-size:18px;font-weight:600;color:white;transition:all 0.3s ease;width:100%;margin-top:10px}.voice-btn{background:linear-gradient(45deg,#28a745,#20c997);border:none;border-radius:10px;padding:15px;font-size:18px;font-weight:600;color:white;transition:all 0.3s ease;width:100%;margin-top:20px}.voice-btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(40,167,69,0.3)}.voice-btn.listening{background:linear-gradient(45deg,#dc3545,#c82333);animation:pulse 1.5s infinite}@keyframes pulse{0%{opacity:1}50%{opacity:0.7}100%{opacity:1}}.date-inputs{display:flex;gap:10px}.date-inputs .form-control{flex:1}.alert{border-radius:10px;margin-top:20px}</style>
<!-- Preload Critical Resources -->
<!-- DNS Prefetch -->
<link rel="dns-prefetch" href="//supabase.co">
<link rel="dns-prefetch" href="//cdn.jsdelivr.net">
<!-- Preconnect -->
<link rel="preconnect" href="https://iksjhjxwphmvthryfeae.supabase.co">
</head>
<body>
<div class="container">
<div class="row justify-content-center">
<div class="col-md-8 col-lg-6">
<div class="form-container">
<div class="form-header">
<h1><i class="fas fa-plus-circle"></i> إضافة منتج جديد</h1>
<p class="text-muted">أدخل بيانات المنتج الجديد</p>
</div>

<form id="productForm">
<div class="form-group">
<label for="productName" class="form-label">
<i class="fas fa-tag"></i> اسم المنتج
</label>
<input type="text" class="form-control" id="productName" required>
</div>

<div class="row">
<div class="col-md-6">
<div class="form-group">
<label for="price" class="form-label">
<i class="fas fa-dollar-sign"></i> السعر
</label>
<input type="number" class="form-control" id="price" step="0.01" required>
</div>
</div>
<div class="col-md-6">
<div class="form-group">
<label for="discount" class="form-label">
<i class="fas fa-percentage"></i> الخصم (%)
</label>
<input type="number" class="form-control" id="discount" min="0" max="100" value="0">
</div>
</div>
</div>

<div class="form-group">
<label for="quantity" class="form-label">
<i class="fas fa-boxes"></i> الكمية
</label>
<input type="number" class="form-control" id="quantity" min="1" required>
</div>

<div class="form-group">
<label class="form-label">
<i class="fas fa-calendar"></i> تاريخ الإنتاج
</label>
<div class="date-inputs">
<input type="number" class="form-control" id="prodDay" placeholder="يوم" min="1" max="31">
<input type="number" class="form-control" id="prodMonth" placeholder="شهر" min="1" max="12">
<input type="number" class="form-control" id="prodYear" placeholder="سنة" min="2020" max="2030">
</div>
</div>

<div class="form-group">
<label class="form-label">
<i class="fas fa-calendar-check"></i> تاريخ الانتهاء
</label>
<div class="date-inputs">
<input type="number" class="form-control" id="expDay" placeholder="يوم" min="1" max="31">
<input type="number" class="form-control" id="expMonth" placeholder="شهر" min="1" max="12">
<input type="number" class="form-control" id="expYear" placeholder="سنة" min="2020" max="2030">
</div>
</div>

<button type="submit" class="btn btn-primary" id="submitBtn">
<i class="fas fa-save"></i> إضافة المنتج
</button>

<button type="button" class="btn btn-secondary" onclick="goBack()">
<i class="fas fa-arrow-left"></i> العودة
</button>

<button type="button" class="voice-btn" id="voiceInputBtn">
<i class="fas fa-microphone"></i> إدخال صوتي
</button>
</form>

<div id="alertContainer"></div>
</div>
</div>
</div>
</div>

<!-- Supabase SDK -->
<script src="libs/supabase.min.js"></script>
<!-- Supabase Singleton Module -->
<script src="supabase-singleton.js"></script>
<!-- Voice Input System -->
<script src="voice-input.js?v=10.0"></script>
<!-- Bundled Utilities -->
<script src="bundle.js?v=10.0"></script>
<!-- Main App Logic -->
<script>
// التحقق من الجلسة عند تحميل الصفحة (مع منع Infinite Loop و try-catch)
document.addEventListener('DOMContentLoaded', async function() {
    console.log('🔍 التحقق من الجلسة في add-product-v10.html...');
    
    try {
        // استخدام Supabase Singleton للتحقق السريع
        const isAuthenticated = await SupabaseSingleton.SessionManager.ensureAuthenticated();
        
        if (!isAuthenticated) {
            console.log('❌ المستخدم غير مسجل دخول');
            
            // عرض رسالة خطأ بدلاً من الصفحة البيضاء
            document.body.innerHTML = `
                <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif; direction: rtl;">
                    <h2 style="color: #dc3545;">❌ غير مصرح بالدخول</h2>
                    <p style="color: #6c757d;">يجب تسجيل الدخول أولاً للوصول إلى هذه الصفحة</p>
                    <button onclick="if(typeof window.showOfflineToast === 'function') window.showOfflineToast();" style="background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 10px;">
                        تسجيل الدخول
                    </button>
                    <button onclick="window.location.reload()" style="background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 10px;">
                        إعادة تحميل
                    </button>
                </div>
            `;
            return;
        }
        
        console.log('✅ المستخدم مسجل دخول، تحميل الصفحة...');
        
        // تهيئة قاعدة البيانات المحلية
function checkFormValidity(){
    const productName=document.getElementById('productName').value;
    const price=document.getElementById('price').value;
    const quantity=document.getElementById('quantity').value;
    const submitBtn=document.getElementById('submitBtn');
    
    if(productName&&price&&quantity){
        submitBtn.disabled=false;
    }else{
        submitBtn.disabled=true;
    }
}

// معالجة تقديم النموذج
function handleSubmit(e){
    e.preventDefault();
    
    const productData={
        productName:document.getElementById('productName').value,
        price:parseFloat(document.getElementById('price').value),
        discount:parseFloat(document.getElementById('discount').value)||0,
        quantity:parseInt(document.getElementById('quantity').value),
        productionDate:getSplitDate('prod'),
        expiryDate:getSplitDate('exp'),
        addedDate:new Date().toISOString()
    };
    
    // حفظ في Supabase
    saveToSupabase(productData);
    
    // حفظ في localStorage كنسخة احتياطية
    const products=JSON.parse(localStorage.getItem('products'))||[];
    productData.id=Date.now();
    products.push(productData);
    localStorage.setItem('products',JSON.stringify(products));
    
    // عرض رسالة نجاح
    showCustomAlert('تم إضافة المنتج بنجاح!','success');
    
    // إعادة تعيين النموذج
    document.getElementById('productForm').reset();
    checkFormValidity();
}

// حفظ في Supabase
async function saveToSupabase(productData){
    try{
        const{data,error}=await supabase.from('products').insert([productData]);
        if(error){
            console.error('خطأ في حفظ البيانات:',error);
            showCustomAlert('فشل حفظ البيانات في السيرفر','error');
        }else{
            console.log('تم الحفظ بنجاح في Supabase:',data);
        }
    }catch(error){
        console.error('خطأ في الاتصال بـ Supabase:',error);
    }
}

// الحصول على التاريخ المقسم
function getSplitDate(prefix){
    const day=document.getElementById(prefix+'Day').value||'01';
    const month=document.getElementById(prefix+'Month').value||'01';
    const year=document.getElementById(prefix+'Year').value||'2024';
    return`${year}-${month}-${day}`;
}

// العودة للصفحة السابقة
function goBack(){
    window.history.back();
}

// إضافة مستمعي الأحداث
document.addEventListener('DOMContentLoaded',function(){
    const form=document.getElementById('productForm');
    const inputs=form.querySelectorAll('input');
    
    // مستمع تقديم النموذج
    form.addEventListener('submit',handleSubmit);
    
    // مستمعي التحقق من صحة النموذج
    inputs.forEach(input=>{
        input.addEventListener('input',checkFormValidity);
        input.addEventListener('change',checkFormValidity);
    });
    
    // التحقق الأولي
    checkFormValidity();
    
    console.log('✅ تم تهيئة صفحة إضافة المنتجات (v=10.0) مع الإدخال الصوتي');
});
</script>
</body>
</html>
