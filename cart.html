<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة الأوردر</title>
    <script src="navigation.js"></script>
    <script src="libs/supabase.min.js"></script>
    <script src="supabase-singleton.js"></script>
    <script src="multi-tenant-integration.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .back-arrow {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #ff6b6b, #dc3545);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.5);
            transition: all 0.3s;
            border: 3px solid white;
            z-index: 1000;
            outline: none;
            user-select: none;
        }
        .back-arrow:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.7);
        }
        .back-arrow:active {
            transform: scale(0.95);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .pharmacy-form {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 2px solid #667eea;
        }
        .form-title {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
            font-size: 14px;
        }
        .required {
            color: #dc3545;
        }
        input, textarea {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        .gps-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .cart-items {
            margin-bottom: 30px;
        }
        .cart-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #e0e0e0;
        }
        .item-info {
            flex: 1;
        }
        .item-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .item-price {
            color: #666;
            font-size: 14px;
        }
        .item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qty-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }
        .qty-btn:hover {
            background: #5568d3;
        }
        .qty-input {
            width: 60px;
            text-align: center;
            padding: 5px;
        }
        .btn-remove {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-remove:hover {
            background: #c82333;
        }
        .summary {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .summary-row.total {
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
            border-top: 2px solid #2e7d32;
            padding-top: 10px;
            margin-top: 10px;
        }
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-submit {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4);
        }
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="back-arrow" onclick="goBack()" title="رجوع">←</div>
    
    <div class="container">
        <h2>🛒 سلة الأوردر</h2>
        
        <div class="pharmacy-form">
            <div class="form-title">🏥 بيانات الصيدلية</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم الصيدلية <span class="required">*</span></label>
                    <input type="text" id="pharmacyName" required>
                </div>
                <div class="form-group">
                    <label>رقم التليفون <span class="required">*</span></label>
                    <input type="tel" id="pharmacyPhone" placeholder="11 رقم" maxlength="11" required>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>العنوان <span class="required">*</span></label>
                    <textarea id="pharmacyAddress" required></textarea>
                </div>
                <div class="form-group">
                    <label>موقع GPS (اختياري)</label>
                    <div class="gps-group">
                        <input type="text" id="gpsLat" placeholder="خط العرض">
                        <input type="text" id="gpsLng" placeholder="خط الطول">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="cart-items" id="cartItems"></div>
        
        <div class="summary" id="summary" style="display: none;">
            <div class="summary-row">
                <span>عدد المنتجات:</span>
                <span id="itemsCount">0</span>
            </div>
            <div class="summary-row">
                <span>الإجمالي قبل الخصم:</span>
                <span id="subtotal">0.00 جنيه</span>
            </div>
            <div class="summary-row">
                <span>إجمالي الخصم:</span>
                <span id="totalDiscount">0.00 جنيه</span>
            </div>
            <div class="summary-row total">
                <span>الإجمالي النهائي:</span>
                <span id="finalTotal">0.00 جنيه</span>
            </div>
        </div>
        
        <button class="btn btn-submit" id="submitBtn" onclick="createOrder()" disabled>إنشاء الأوردر</button>
        
        <div class="empty-cart" id="emptyCart">
            <div class="empty-icon">🛒</div>
            <div>السلة فارغة</div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser) if(typeof window.showOfflineToast === 'function') window.showOfflineToast();
        
        let cart = JSON.parse(sessionStorage.getItem('cart')) || [];
        
        function displayCart() {
            const cartItems = document.getElementById('cartItems');
            const emptyCart = document.getElementById('emptyCart');
            const summary = document.getElementById('summary');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '';
                emptyCart.style.display = 'block';
                summary.style.display = 'none';
                return;
            }
            
            emptyCart.style.display = 'none';
            summary.style.display = 'block';
            cartItems.innerHTML = '';
            
            cart.forEach((item, index) => {
                const priceAfterDiscount = item.price - (item.price * item.discount / 100);
                const itemTotal = priceAfterDiscount * item.quantity;
                
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="item-info">
                        <div class="item-name">${item.productName}</div>
                        <div class="item-price">السعر: ${item.price.toFixed(2)} جنيه | الخصم: ${item.discount}% | السعر بعد الخصم: ${priceAfterDiscount.toFixed(2)} جنيه</div>
                        <div class="item-price">الإجمالي: <strong>${itemTotal.toFixed(2)} جنيه</strong></div>
                    </div>
                    <div class="item-quantity">
                        <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
                        <input type="number" class="qty-input" value="${item.quantity}" min="1" onchange="setQuantity(${index}, this.value)">
                        <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                        <button class="btn-remove" onclick="removeFromCart(${index})">حذف</button>
                    </div>
                `;
                cartItems.appendChild(div);
            });
            
            updateSummary();
            checkFormValidity();
        }
        
        function updateQuantity(index, change) {
            const item = cart[index];
            const isFixedQuantity = item.quantity_type === 'fixed';
            const originalQty = item.original_quantity || item.quantity;
            
            if (isFixedQuantity) {
                // Fixed quantity: no limit, can increase freely
                item.quantity = Math.max(1, item.quantity + change);
            } else {
                // Decreasing quantity: limited by original stock
                const maxQty = originalQty || 999999;
                const newQty = item.quantity + change;
                if (newQty > maxQty) {
                    alert(`⚠️ الكمية المتاحة: ${maxQty}`);
                    return;
                }
                item.quantity = Math.max(1, newQty);
            }
            
            sessionStorage.setItem('cart', JSON.stringify(cart));
            displayCart();
        }
        
        function setQuantity(index, value) {
            const item = cart[index];
            const qty = parseInt(value);
            if (qty > 0) {
                const isFixedQuantity = item.quantity_type === 'fixed';
                const originalQty = item.original_quantity || item.quantity;
                
                if (!isFixedQuantity && qty > originalQty) {
                    alert(`⚠️ الكمية المتاحة: ${originalQty}`);
                    item.quantity = originalQty;
                } else {
                    item.quantity = qty;
                }
                
                sessionStorage.setItem('cart', JSON.stringify(cart));
                displayCart();
            }
        }
        
        function removeFromCart(index) {
            cart.splice(index, 1);
            sessionStorage.setItem('cart', JSON.stringify(cart));
            displayCart();
        }
        
        function updateSummary() {
            let subtotal = 0;
            let totalDiscount = 0;
            
            cart.forEach(item => {
                const itemSubtotal = item.price * item.quantity;
                const itemDiscount = (item.price * item.discount / 100) * item.quantity;
                subtotal += itemSubtotal;
                totalDiscount += itemDiscount;
            });
            
            const finalTotal = subtotal - totalDiscount;
            
            document.getElementById('itemsCount').textContent = cart.length;
            document.getElementById('subtotal').textContent = subtotal.toFixed(2) + ' جنيه';
            document.getElementById('totalDiscount').textContent = totalDiscount.toFixed(2) + ' جنيه';
            document.getElementById('finalTotal').textContent = finalTotal.toFixed(2) + ' جنيه';
        }
        
        function checkFormValidity() {
            const pharmacyName = document.getElementById('pharmacyName').value.trim();
            const pharmacyPhone = document.getElementById('pharmacyPhone').value;
            const pharmacyAddress = document.getElementById('pharmacyAddress').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            
            if (pharmacyName && pharmacyPhone.length === 11 && pharmacyAddress && cart.length > 0) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }
        
        document.getElementById('pharmacyName').addEventListener('input', checkFormValidity);
        document.getElementById('pharmacyPhone').addEventListener('input', checkFormValidity);
        document.getElementById('pharmacyAddress').addEventListener('input', checkFormValidity);
        
        function createOrder() {
            const pharmacyName = document.getElementById('pharmacyName').value.trim();
            const pharmacyPhone = document.getElementById('pharmacyPhone').value;
            const pharmacyAddress = document.getElementById('pharmacyAddress').value.trim();
            const gpsLat = document.getElementById('gpsLat').value.trim();
            const gpsLng = document.getElementById('gpsLng').value.trim();
            
            if (!pharmacyName || pharmacyPhone.length !== 11 || !pharmacyAddress || cart.length === 0) {
                alert('يرجى إكمال جميع البيانات المطلوبة');
                return;
            }
            
            let subtotal = 0;
            let totalDiscount = 0;
            
            cart.forEach(item => {
                const itemSubtotal = item.price * item.quantity;
                const itemDiscount = (item.price * item.discount / 100) * item.quantity;
                subtotal += itemSubtotal;
                totalDiscount += itemDiscount;
            });
            
            const orderData = {
                userId: currentUser.email,
                warehouseName: currentUser.warehouseName,
                pharmacyName: pharmacyName,
                pharmacyPhone: pharmacyPhone,
                pharmacyAddress: pharmacyAddress,
                pharmacyGPS: (gpsLat && gpsLng) ? { lat: parseFloat(gpsLat), lng: parseFloat(gpsLng) } : null,
                orderNumber: Date.now(),
                orderDate: new Date().toISOString().split('T')[0],
                products: cart.map(item => ({
                    productName: item.productName,
                    quantity: item.quantity,
                    price: item.price,
                    discount: item.discount
                })),
                itemsCount: cart.length,
                totalAmount: subtotal - totalDiscount,
                status: 'pending',
                createdAt: new Date().toISOString()
            };
            
            saveOrder(orderData);
        }
        
        async function saveOrder(orderData) {
            try {
                // ✅ استخدام نظام Multi-Tenant
                const tenantManager = new MultiTenantManager(window.SupabaseSingleton.getClient());
                const currentWarehouseId = localStorage.getItem('current_warehouse_id') || localStorage.getItem('slamtak-user-id');
                const currentUserId = localStorage.getItem('slamtak-user-id');
                
                const orderWithTenant = {
                    ...orderData,
                    warehouse_id: currentWarehouseId,
                    user_id: currentUserId,  // ← ربط بالمستخدم الحالي
                    order_number: await generateOrderNumber(),
                    order_date: new Date().toISOString(),
                    status: 'pending'
                };
                
                // ✅ إضافة مع فلتر المستخدم
                const result = await tenantManager.insert('orders', orderWithTenant);
                
                if (!result.success) throw new Error(result.error);
                
                alert('تم إنشاء الأوردر بنجاح!');
                cart = [];
                sessionStorage.removeItem('cart');
                window.location.replace('sales.html');
                
            } catch (error) {
                console.error('❌ خطأ في حفظ الأوردر:', error);
                // Fallback to localStorage
                saveOrderToLocalStorage(orderData);
            }
        }
        
        async function generateOrderNumber() {
            try {
                const supabaseClient = window.SupabaseSingleton.getClient();
                const { data, error } = await supabaseClient.rpc('generate_order_number');
                if (error) throw error;
                return data || 'ORD-' + Date.now();
            } catch (error) {
                console.error('Error generating order number:', error);
                return 'ORD-' + Date.now();
            }
        }
        
        function saveOrderToLocalStorage(orderData) {
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders.push(orderData);
            localStorage.setItem('orders', JSON.stringify(orders));
            alert('تم إنشاء الأوردر بنجاح!');
            cart = [];
            sessionStorage.removeItem('cart');
            window.location.replace('sales.html');
        }
        
        function goBack() {
            window.location.replace('products.html');
        }
        
        displayCart();
    </script>
</body>
</html>
