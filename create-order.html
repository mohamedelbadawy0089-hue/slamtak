<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء أوردر</title>
    <script src="navigation.js"></script>
    <script src="libs/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .back-arrow {
            position: fixed; top: 20px; left: 20px; font-size: 50px; font-weight: bold;
            cursor: pointer; color: white; background: linear-gradient(135deg, #ff6b6b, #dc3545);
            width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; box-shadow: 0 5px 15px rgba(220,53,69,0.5);
            transition: all 0.3s; border: 3px solid white; z-index: 1000;
            outline: none; user-select: none;
        }
        .back-arrow:hover { transform: scale(1.1) translateY(-3px); }
        .back-arrow:active { transform: scale(0.95); }
        .container { max-width: 1200px; margin: 0 auto; }
        .pharmacy-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
        }
        .pharmacy-card .name { font-size: 22px; font-weight: bold; }
        .pharmacy-card .info { font-size: 14px; opacity: 0.9; }
        .cart-float {
            position: fixed; bottom: 30px; left: 30px; z-index: 999;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white; border: none; border-radius: 50px; padding: 15px 25px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 20px rgba(67,233,123,0.5); transition: all 0.3s; display: none;
        }
        .cart-float:hover { transform: translateY(-3px); }
        .products-section {
            background: white; padding: 25px; border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        .section-title { 
            font-size: 18px; font-weight: bold; color: #333; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .keyboard-hint {
            font-size: 12px; color: #999; font-weight: normal;
            background: #f8f9ff; padding: 5px 10px; border-radius: 5px;
        }
        .search-container {
            position: relative;
            width: 100%;
        }
        .search-input {
            width: 100%; padding: 14px 20px 14px 105px; border: 3px solid #667eea; border-radius: 8px; /* Increased left padding for 2 buttons */
            font-size: 16px; box-sizing: border-box; margin-bottom: 15px;
            font-family: Arial, sans-serif; transition: all 0.3s; background: white;
        }
        .search-input:focus { 
            outline: none; 
            border-color: #764ba2; 
            box-shadow: 0 0 15px rgba(102,126,234,0.5);
            transform: translateY(-2px);
        }
        .gemini-mic-container {
            position: absolute;
            left: 10px;
            top: 25px; /* Centers roughly with the input */
            transform: translateY(-50%);
            display: flex;
            gap: 8px; /* Support multiple icons */
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .gemini-mic-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }
        .gemini-mic-btn:hover {
            transform: scale(1.1);
        }
        .gemini-mic-btn.listening {
            background: linear-gradient(135deg, #f5576c, #f093fb);
            animation: pulse-gemini 1.5s infinite;
        }
        @keyframes pulse-gemini {
            0% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(245, 87, 108, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0); }
        }
        #speechBubble {
            position: absolute;
            bottom: 50px;
            left: 0;
            background: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px; text-align: right; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: right; }
        tr:hover { background: #f8f9ff; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-unlimited { background: #d4edda; color: #155724; }
        .badge-limited { background: #fff3cd; color: #856404; }
        .qty-control { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
        .qty-btn {
            background: #667eea; color: white; border: none; width: 35px; height: 35px;
            border-radius: 5px; cursor: pointer; font-size: 20px; font-weight: bold; line-height: 1;
            transition: all 0.2s;
        }
        .qty-btn:hover { 
            background: #5568d3; 
            transform: scale(1.1);
        }
        .qty-btn:active {
            transform: scale(0.95);
        }
        .qty-input {
            width: 60px; text-align: center; padding: 6px; border: 2px solid #ddd;
            border-radius: 5px; font-size: 15px; font-weight: bold;
        }
        .qty-input:focus { 
            outline: none; 
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102,126,234,0.4);
        }
        .no-results { text-align: center; padding: 40px; color: #999; font-size: 16px; }
        .cart-section {
            background: white; padding: 25px; border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; display: none;
        }
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid #eee; flex-wrap: wrap; gap: 10px;
        }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-name { font-weight: bold; color: #333; }
        .cart-item-price { color: #666; font-size: 13px; }
        .cart-item-right { display: flex; align-items: center; gap: 10px; }
        .btn-remove-item { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .summary { background: #e8f5e9; padding: 20px; border-radius: 8px; margin-top: 15px; }
        .summary-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 15px; }
        .summary-row.total { font-size: 18px; font-weight: bold; color: #2e7d32; border-top: 2px solid #2e7d32; margin-top: 10px; padding-top: 10px; }
        .btn-submit {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; margin-top: 15px; transition: all 0.3s;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(67,233,123,0.4); }
        .btn-delivery {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #25d366 0%, #1da851 100%);
            color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; margin-top: 10px; transition: all 0.3s;
        }
        .btn-delivery:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37,211,102,0.4); }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; box-shadow: 0 5px 30px rgba(0,0,0,0.3); }
        .modal-header { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #333; text-align: center; }
        .modal-body { margin-bottom: 20px; }
        .delivery-list { max-height: 300px; overflow-y: auto; }
        .delivery-item { padding: 15px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s; }
        .delivery-item:hover { border-color: #25d366; background: #f0fff4; }
        .delivery-item.selected { border-color: #25d366; background: #e6f9ed; }
        .delivery-name { font-weight: bold; color: #333; margin-bottom: 5px; }
        .delivery-phone { color: #666; font-size: 14px; }
        .modal-footer { display: flex; gap: 10px; justify-content: center; }
        .btn-modal { padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .btn-send { background: #25d366; color: white; }
        .btn-send:hover { background: #1da851; }
        .btn-cancel { background: #6c757d; color: white; }
        .btn-cancel:hover { background: #5a6268; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="back-arrow" id="backBtn" onclick="goBack()" title="رجوع">←</div>
    <div class="container">
        <div class="header-row" style="display: flex; gap: 20px; align-items: stretch; margin-bottom: 20px;">
            <div class="pharmacy-card" id="pharmacyCard" style="margin-bottom: 0; flex: 1;"></div>
        </div>
        
        <div class="preparation-card" id="preparationCard" style="display: none;">
            <div class="preparation-info">
                <span class="preparation-label">📱 رقم موظف التحضير:</span>
                <span class="preparation-phone" id="preparationPhoneDisplay"></span>
            </div>
            <div>
                <button class="btn-edit-phone" onclick="editPreparationPhone()">✏️ تعديل</button>
                <button class="btn-delete-phone" onclick="deletePreparationPhone()">🗑️ حذف</button>
            </div>
        </div>
        
        <div class="preparation-card" id="addPreparationCard" style="display: none; background: linear-gradient(135deg, #ffa751 0%, #ffe259 100%);">
            <div class="preparation-info">
                <span class="preparation-label">⚠️ لم يتم إضافة رقم موظف التحضير</span>
            </div>
            <div>
                <button class="btn-edit-phone" onclick="addPreparationPhoneNow()">➕ إضافة الآن</button>
            </div>
        </div>
        
        <div class="products-section">
            <div class="section-title">
                <span>📦 اختر المنتجات</span>
                <span class="keyboard-hint">💡 Ctrl+F للبحث | Enter للإضافة السريعة</span>
            </div>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث عن منتج أو اطلب (مثال: 15 بانادول)..." autocomplete="off">
                <div class="gemini-mic-container">
                    <div id="speechBubble">...استمع الآن</div>
                    <button id="simpleSearchMic" class="gemini-mic-btn" style="background: linear-gradient(135deg, #11998e, #38ef7d);" title="البحث الصوتي العادي">🎙️</button>
                    <button id="portalMic" class="gemini-mic-btn" title="الطلب الصوتي الذكي">🎤</button>
                </div>
            </div>
            <div style="overflow-x:auto" id="tableWrapper"></div>
        </div>
        <div class="cart-section" id="cartSection">
            <div class="section-title">🛒 الأوردر (<span id="cartCount">0</span> منتج)</div>
            <div id="cartItems"></div>
            <div class="summary">
                <div class="summary-row"><span>الإجمالي قبل الخصم:</span><span id="subtotal">0.00 جنيه</span></div>
                <div class="summary-row"><span>إجمالي الخصم:</span><span id="totalDiscount">0.00 جنيه</span></div>
                <div class="summary-row total"><span>الإجمالي النهائي:</span><span id="finalTotal">0.00 جنيه</span></div>
            </div>
            <button class="btn-submit" id="submitOrderBtn">✅ إنشاء الأوردر</button>
            <button class="btn-delivery" id="sendDeliveryBtn" style="display: none;">🚚 إرسال لرجل الدليفري</button>
        </div>
    </div>
    <button class="cart-float" id="cartFloat">🛒 السلة (<span id="cartFloatCount">0</span>)</button>

    <div id="deliveryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">🚚 اختر موظف التحضير ورجل الدليفري</div>
            <div class="modal-body">
                <div class="delivery-list" id="deliveryList"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-send" onclick="sendToWhatsApp()">📢 إرسال عبر واتساب</button>
                <button class="btn-modal" style="background: #667eea; color: white;" onclick="printOrder()">🖨️ طباعة</button>
                <button class="btn-modal btn-cancel" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="printArea" style="display: none; padding: 20px; font-family: Arial, sans-serif;"></div>

    <script>
        // دالة للتحقق من نوع الجهاز
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
        
        // دالة لتنسيق رقم الهاتف
        function formatPhoneNumber(phone) {
            phone = phone.trim();
            // إذا بدأ بـ 01، استبدله بـ 201
            if (phone.startsWith('01')) {
                return '2' + phone;
            }
            // إذا بدأ بـ +2، احذف الـ +
            if (phone.startsWith('+2')) {
                return phone.substring(1);
            }
            // إرجاع الرقم كما هو
            return phone;
        }
        
        // دالة لفتح واتساب
        function openWhatsApp(phone, message) {
            var formattedPhone = formatPhoneNumber(phone);
            var whatsappUrl;
            
            if (isMobileDevice()) {
                // للموبايل
                whatsappUrl = 'whatsapp://send?phone=' + formattedPhone + '&text=' + message;
            } else {
                // للكمبيوتر
                whatsappUrl = 'https://web.whatsapp.com/send?phone=' + formattedPhone + '&text=' + message;
            }
            
            window.open(whatsappUrl, '_blank');
        }

        window.currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!window.currentUser) { if(typeof window.showOfflineToast === 'function') window.showOfflineToast(); }

        window.pharmacy = JSON.parse(sessionStorage.getItem('selectedPharmacy'));
        if (!window.pharmacy) {
            alert('لم يتم تحديد صيدلية، سيتم تحويلك لصفحة الصيدليات');
            window.location.replace('pharmacies.html');
        }

        window.allProducts = [];
        window.cart = {};
        window.selectedDeliveryPhone = null;
        window.selectedPreparationPhone = null;
        window.allDeliveryPersons = [];
        window.lastCreatedOrder = null;
        
        // مفتاح حفظ مسودة السلة لهذا المستخدم وهذه الصيدلية
        const draftKey = 'order_draft_' + currentUser.email + '_' + pharmacy.pharmacyName;

        function goBack() {
            window.location.replace('pharmacies.html');
        }

        document.getElementById('pharmacyCard').innerHTML =
            '<div style="font-size:40px">🏥</div>' +
            '<div>' +
                '<div class="name">' + pharmacy.pharmacyName + '</div>' +
                '<div class="info">📞 ' + pharmacy.pharmacyPhone + ' &nbsp;|&nbsp; 📍 ' + pharmacy.pharmacyAddress + '</div>' +
            '</div>';
        
        // ===== البحث من Supabase فقط =====
        var searchTimeout;
        var currentWarehouseId = localStorage.getItem('current_warehouse_id') || localStorage.getItem('slamtak-user-id');

        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            var value = this.value.trim();

            if (value.length >= 2) {
                // البحث من Supabase بعد حرفين
                searchTimeout = setTimeout(function() {
                    performSupabaseSearch(value);
                }, 300);
            } else if (value.length === 0) {
                // إظهار جميع المنتجات المحلية عند مسح البحث
                renderTable('');
            }
        });

        // البحث في Supabase مع التصفية حسب warehouse_id
        async function performSupabaseSearch(searchTerm) {
            try {
                // التحقق من وجود Supabase
                if (!window.SupabaseSingleton || !window.SupabaseSingleton.getClient()) {
                    console.warn('⚠️ Supabase غير متاح، استخدام البحث المحلي');
                    renderTable(searchTerm);
                    return;
                }

                const supabaseClient = window.SupabaseSingleton.getClient();

                // إظهار حالة التحميل
                document.getElementById('tableWrapper').innerHTML = '<div class="empty-state">🔍 جاري البحث في المخزن...</div>';

                // البحث في Supabase مع warehouse_id filtering و ilike
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .eq('warehouse_id', currentWarehouseId)
                    .or(`name.ilike.%${searchTerm}%,barcode.ilike.%${searchTerm}%`)
                    .limit(50)
                    .order('name');

                if (error) throw error;

                // تحويل بيانات Supabase إلى تنسيق متوافق مع renderTable
                var searchResults = (data || []).map(function(p) {
                    return {
                        productName: p.name,
                        name: p.name,
                        price: p.price || 0,
                        discount: p.discount || 0,
                        quantity: p.quantity || 0,
                        isUnlimited: !p.quantity || p.quantity_type === 'fixed',
                        productionDate: p.production_date || p.productionDate,
                        expiryDate: p.expiry_date || p.expiryDate,
                        id: p.id,
                        source: 'supabase'
                    };
                });

                // عرض النتائج
                renderSearchResults(searchResults, searchTerm);

            } catch (err) {
                console.error('❌ خطأ في البحث من Supabase:', err);
                // fallback للبحث المحلي
                renderTable(searchTerm);
            }
        }

        // عرض نتائج البحث من Supabase
        function renderSearchResults(products, searchTerm) {
            var wrapper = document.getElementById('tableWrapper');

            if (products.length === 0) {
                wrapper.innerHTML = '<div class="no-results">🔍 لا توجد منتجات بهذا الاسم في هذا المخزن</div>';
                return;
            }

            var html = '<table><thead><tr>' +
                '<th>#</th><th>اسم المنتج</th><th>السعر</th><th>الخصم</th>' +
                '<th>بعد الخصم</th><th>الكمية المتاحة</th><th>تاريخ الإنتاج</th><th>تاريخ الانتهاء</th><th>الكمية</th>' +
                '</tr></thead><tbody>';

            products.forEach(function(p, i) {
                var afterDiscount = p.price - (p.price * p.discount / 100);
                var stockBadge = p.isUnlimited
                    ? '<span class="badge badge-unlimited">متوفر دائماً</span>'
                    : '<span class="badge badge-limited">' + p.quantity + '</span>';
                var qty = cart[p.productName] || 0;
                var enc = encodeURIComponent(p.productName);

                // تظليل النص المطابق
                var displayName = p.productName;
                if (searchTerm) {
                    var regex = new RegExp('(' + searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                    displayName = p.productName.replace(regex, '<mark style="background: #ffeb3b; padding: 2px 4px; border-radius: 3px;">$1</mark>');
                }

                html += '<tr>' +
                    '<td>' + (i + 1) + '</td>' +
                    '<td><strong>' + displayName + '</strong></td>' +
                    '<td>' + p.price.toFixed(2) + ' ج</td>' +
                    '<td>' + p.discount + '%</td>' +
                    '<td><strong>' + afterDiscount.toFixed(2) + ' ج</strong></td>' +
                    '<td>' + stockBadge + '</td>' +
                    '<td>' + (p.productionDate || '-') + '</td>' +
                    '<td>' + (p.expiryDate || '-') + '</td>' +
                    '<td><div class="qty-control">' +
                        '<button class="qty-btn" data-name="' + enc + '" data-delta="-1">−</button>' +
                        '<input class="qty-input" type="number" min="0" value="' + qty + '" data-name="' + enc + '">' +
                        '<button class="qty-btn" data-name="' + enc + '" data-delta="1">+</button>' +
                    '</div></td>' +
                '</tr>';
            });

            html += '</tbody></table>';
            wrapper.innerHTML = html;
        }
        
        // تركيز تلقائي على حقل البحث عند تحميل الصفحة
        window.addEventListener('load', function() {
            document.getElementById('searchInput').focus();
        });
        
        // اختصار لوحة المفاتيح: Ctrl+F للبحث
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
                document.getElementById('searchInput').select();
            }
        });

        function renderTable(searchVal) {
            var term = (searchVal || '').trim().toLowerCase();
            var filtered = term === '' ? allProducts : allProducts.filter(function(p) {
                return p.productName.toLowerCase().indexOf(term) !== -1;
            });

            var wrapper = document.getElementById('tableWrapper');

            if (allProducts.length === 0) {
                wrapper.innerHTML = '<div class="empty-state">لا توجد منتجات مضافة بعد</div>';
                return;
            }

            if (filtered.length === 0) {
                wrapper.innerHTML = '<div class="no-results">🔍 لا توجد نتائج مطابقة للبحث</div>';
                return;
            }

            var html = '<table><thead><tr>' +
                '<th>#</th><th>اسم المنتج</th><th>السعر</th><th>الخصم</th>' +
                '<th>بعد الخصم</th><th>الكمية المتاحة</th><th>تاريخ الإنتاج</th><th>تاريخ الانتهاء</th><th>الكمية</th>' +
                '</tr></thead><tbody>';

            filtered.forEach(function(p, i) {
                var afterDiscount = p.price - (p.price * p.discount / 100);
                var stockBadge = p.isUnlimited
                    ? '<span class="badge badge-unlimited">متوفر دائماً</span>'
                    : '<span class="badge badge-limited">' + p.quantity + '</span>';
                var qty = cart[p.productName] || 0;
                var enc = encodeURIComponent(p.productName);
                html += '<tr>' +
                    '<td>' + (i + 1) + '</td>' +
                    '<td><strong>' + p.productName + '</strong></td>' +
                    '<td>' + p.price.toFixed(2) + ' ج</td>' +
                    '<td>' + p.discount + '%</td>' +

        window.setQty = function(name, qty) {
            console.log('📦 setQty called for:', name, 'Quantity:', qty);
            
            // تطبيع الاسم للبحث المرن
            const normalize = (txt) => (txt || '').toLowerCase().trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
            const targetName = normalize(name);

            // التحقق من المنتج
            var product = window.allProducts.find(function(p) { 
                return normalize(p.productName) === targetName || normalize(p.name) === targetName; 
            });
            
            if (!product) {
                console.error('❌ Product not found in allProducts:', name);
                return { success: false, actualQty: 0, error: 'product_not_found' };
            }
            
            const pName = product.productName || product.name;
            let actualQty = qty;
            let warning = null;
            
            // منع الإضافة إذا كانت الكمية المتاحة = 0 (ليس متوفر دائماً)
            if (!product.isUnlimited && product.quantity === 0 && qty > 0) {
                //alert('عذراً، هذا المنتج غير متوفر حالياً (الكمية = 0)');
                actualQty = 0;
                warning = 'المنتج غير متوفر (الكمية = 0)';
            } 
            // منع تجاوز الكمية المتاحة (ليس متوفر دائماً)
            else if (!product.isUnlimited && qty > product.quantity) {
                //alert('عذراً، الكمية المتاحة فقط ' + product.quantity + ' من هذا المنتج');
                actualQty = product.quantity;
                warning = 'الكمية المتاحة فقط ' + product.quantity;
            }
            
            if (actualQty > 0) window.cart[pName] = actualQty;
            else delete window.cart[pName];
            
            // تحديث حقل الكمية في الجدول المرئي فقط
            var inputs = document.querySelectorAll('#tableWrapper .qty-input');
            for (var i = 0; i < inputs.length; i++) {
                if (decodeURIComponent(inputs[i].getAttribute('data-name')) === pName) {
                    inputs[i].value = actualQty;
                }
            }
            
            window.updateCart();
            console.log('✅ Cart updated for:', pName, 'Final Qty:', actualQty);
            return { success: true, actualQty: actualQty, requestedQty: qty, warning: warning };
        }

            var cartDiv = document.getElementById('cartItems');
            cartDiv.innerHTML = '';

            names.forEach(function(name) {

                if (!p) return;
                var qty = cart[name];

                            (p.productionDate ? 'إنتاج: ' + p.productionDate + ' &nbsp;' : '') +
                            (p.expiryDate ? '| انتهاء: ' + p.expiryDate + ' &nbsp;' : '') +

        function createOrder() {
            var names = Object.keys(cart);
            if (names.length === 0) { alert('السلة فارغة، أضف منتجات أولاً'); return; }

            var subtotal = 0, totalDiscount = 0;
            var products = names.map(function(name) {
                var p = allProducts.find(function(x) { return x.productName === name; });
                var qty = cart[name];
                subtotal += p.price * qty;
                totalDiscount += (p.price * p.discount / 100) * qty;
                return {
                    productName: p.productName,
                    quantity: qty,
                    price: p.price,
                    discount: p.discount,
                    productionDate: p.productionDate || null,
                    expiryDate: p.expiryDate || null,
                    stockQuantity: p.isUnlimited ? null : (p.quantity || null),
                    isUnlimited: p.isUnlimited || false
                };
            });

            var orderData = {
                userId: currentUser.email,
                warehouseName: currentUser.warehouseName,
                employeeName: currentUser.userType === 'employee' ? currentUser.employeeName : null,
                pharmacyName: pharmacy.pharmacyName,
                pharmacyPhone: pharmacy.pharmacyPhone,
                pharmacyAddress: pharmacy.pharmacyAddress,
                pharmacyProvince: pharmacy.pharmacyProvince || '',
                pharmacyId: pharmacy.pharmacyId || '',
                pharmacyGPS: pharmacy.pharmacyGPS || null,
                orderNumber: Date.now(),
                orderDate: new Date().toISOString().split('T')[0],
                products: products,
                itemsCount: products.length,
                totalAmount: subtotal - totalDiscount,
                totalPrice: subtotal - totalDiscount,
                status: 'completed',
                createdAt: new Date().toISOString()
            };

            // Save to Supabase
            saveOrderToSupabase(orderData);

            // خصم الكميات المدخلة فقط من localStorage
            var lsProducts = JSON.parse(localStorage.getItem('products')) || [];
            products.forEach(function(op) {
                var p = lsProducts.find(function(x) {
                    return x.userId === currentUser.email &&
                        x.productName.toLowerCase() === op.productName.toLowerCase();
                });
                if (!p) return;
                if (p.isUnlimited || p.quantity === null || p.quantity === undefined) return;
                p.quantity = Math.max(0, p.quantity - op.quantity);
            });
            localStorage.setItem('products', JSON.stringify(lsProducts));
            
            // مسح المسودة فور اكتمال الأوردر
            localStorage.removeItem(draftKey);

            // حفظ في IndexedDB
            var req = indexedDB.open('WarehouseDB', 5);
            req.onsuccess = function() {
                var db = req.result;
                // حفظ الأوردر
                if (db.objectStoreNames.contains('orders')) {
                    db.transaction(['orders'], 'readwrite').objectStore('orders').add(orderData);
                }
                // خصم الكميات من IndexedDB
                if (db.objectStoreNames.contains('products')) {
                    var tx = db.transaction(['products'], 'readwrite');
                    var store = tx.objectStore('products');
                    var r = store.index('userId').getAll(currentUser.email);
                    r.onsuccess = function() {
                        (r.result || []).forEach(function(p) {
                            var op = products.find(function(x) {
                                return x.productName.toLowerCase() === p.productName.toLowerCase();
                            });
                            if (!op) return;
                            if (p.isUnlimited || p.quantity === null || p.quantity === undefined) return;
                            p.quantity = Math.max(0, p.quantity - op.quantity);
                            store.put(p);
                        });
                    };
                }
            };

            lastCreatedOrder = orderData;
            
            alert('✅ تم إنشاء الأوردر وخصم الكميات بنجاح!');
            
            // عرض نافذة اختيار موظف التحضير ورجل الدليفري
            openDeliveryModal();
            
            // إفراغ السلة
            cart = {};
            updateCart();
            
            // إظهار قسم السلة مع زر الدليفري
            document.getElementById('cartSection').style.display = 'block';
            document.getElementById('submitOrderBtn').style.display = 'none';
            document.getElementById('sendDeliveryBtn').style.display = 'block';
        }

            printContent += '<p>التاريخ: ' + new Date().toLocaleDateString('ar-EG') + '</p>';
            printContent += '</div>';
            
            printContent += '<div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">';
            printContent += '<h3 style="color: #667eea;">📋 بيانات الصيدلية</h3>';
            printContent += '<p><strong>الاسم:</strong> ' + lastCreatedOrder.pharmacyName + '</p>';
            printContent += '<p><strong>التليفون:</strong> ' + lastCreatedOrder.pharmacyPhone + '</p>';
            printContent += '<p><strong>العنوان:</strong> ' + lastCreatedOrder.pharmacyAddress + '</p>';
            printContent += '</div>';
            
            printContent += '<table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">';
            printContent += '<thead><tr style="background: #667eea; color: white;">';
            printContent += '<th style="padding: 10px; border: 1px solid #ddd;">#</th>';
            printContent += '<th style="padding: 10px; border: 1px solid #ddd;">المنتج</th>';
            printContent += '<th style="padding: 10px; border: 1px solid #ddd;">الكمية</th>';
            printContent += '<th style="padding: 10px; border: 1px solid #ddd;">السعر</th>';
            printContent += '<th style="padding: 10px; border: 1px solid #ddd;">الخصم</th>';
            printContent += '<th style="padding: 10px; border: 1px solid #ddd;">الإجمالي</th>';
            printContent += '</tr></thead><tbody>';
            
            lastCreatedOrder.products.forEach(function(product, index) {
                var afterDiscount = product.price - (product.price * product.discount / 100);
                var total = afterDiscount * product.quantity;
                printContent += '<tr>';
                printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;">' + (index + 1) + '</td>';
                printContent += '<td style="padding: 8px; border: 1px solid #ddd;">' + product.productName + '</td>';
                printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;">' + product.quantity + '</td>';
                printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;">' + product.price.toFixed(2) + ' ج</td>';
                printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;">' + product.discount + '%</td>';
                printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;"><strong>' + total.toFixed(2) + ' ج</strong></td>';
                printContent += '</tr>';
            });
            
            printContent += '</tbody></table>';
            
            printContent += '<div style="background: #e8f5e9; padding: 15px; border-radius: 8px;">';
            printContent += '<h3 style="color: #2e7d32;">💰 الإجمالي النهائي</h3>';
            printContent += '<p style="font-size: 24px; font-weight: bold; color: #2e7d32;">' + lastCreatedOrder.totalAmount.toFixed(2) + ' جنيه</p>';
            printContent += '</div>';
            
            document.getElementById('printArea').innerHTML = printContent;
            window.print();
        }

        loadProducts();
        loadDraftOrder();

        // قراءة المتغيرات من الرابط (لاستقبال أوامر المساعد الذكي الموجهة لإضافة منتج للأوردر)
        function checkUrlForAutoAdd() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('add') && params.has('qty')) {
                const addName = params.get('add');
                const addQty = parseInt(params.get('qty'));
                if (addQty > 0) {
                    const product = allProducts.find(p => (p.productName || p.name) === addName);
                    if (product) {
                        setQty(addName, addQty);
                        
                        // تنبيه بصري خفيف للتأكيد
                        const searchInput = document.getElementById('searchInput');
                        if (searchInput) {
                            searchInput.value = addName;
                            renderTable(addName);
                            setTimeout(() => {
                                searchInput.value = '';
                                renderTable('');
                            }, 2000);
                        }
                        
                        // نطق الإضافة باستخدام المحرك المتطور
                        if(window.AISpeech) {
                            window.AISpeech.speak('تم إضافة ' + addQty + ' من ' + addName + ' للطلب');
                        }
                        
                        // تنظيف الرابط لمنع التكرار عند إعادة التحميل
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                }
            }
        }
        
        function goBack() {
            window.location.replace('pharmacies.html');
        }

        // استدعاء دالة التحقق بعد تحميل المنتجات بقليل
        window.addEventListener('load', function() {
            setTimeout(checkUrlForAutoAdd, 500);
        });
    </script>
    <script src="gemini-voice-processor.js"></script>
    <script>
        // ============================================
        // Gemini Order Voice Integration
        // ============================================
        class OrderVoiceSearch {
            constructor() {
                this.micBtn = document.getElementById('portalMic');
                this.searchInput = document.getElementById('searchInput');
                this.isListening = false;
                this.recognition = null;
                
                if (this.micBtn) this.init();
            }

            async init() {
                this.setupSpeech();
                if (window.GeminiVoiceProcessor) {
                    this.geminiProcessor = new window.GeminiVoiceProcessor();
                }
                this.micBtn.addEventListener('click', () => this.toggle());
            }

            setupSpeech() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return;

                this.recognition = new SR();
                this.recognition.lang = 'en-US'; 
                this.recognition.continuous = false;
                this.recognition.interimResults = false;

                this.recognition.onstart = () => {
                    this.isListening = true;
                    this.micBtn.classList.add('listening');
                    this.showSpeechBubble('...استمع الآن');
                };

                this.recognition.onresult = async (event) => {
                    const transcripts = Array.from(event.results[0]).map(res => res.transcript);
                    this.showSpeechBubble(transcripts[0]);
                    await this.processResults(transcripts);
                };

                this.recognition.onerror = () => { this.stop(); };
                this.recognition.onend = () => {
                    this.isListening = false;
                    this.micBtn.classList.remove('listening');
                    setTimeout(() => this.hideSpeechBubble(), 2000);
                };
            }

            toggle() { this.isListening ? this.stop() : this.start(); }
            start() { try { if (this.recognition) this.recognition.start(); } catch (e) {} }
            stop() { if (this.recognition) this.recognition.stop(); }

            showSpeechBubble(text) {
                const bubble = document.getElementById('speechBubble');
                if (bubble) { bubble.textContent = text; bubble.style.display = 'block'; }
            }

            hideSpeechBubble() {
                const bubble = document.getElementById('speechBubble');
                if (bubble) bubble.style.display = 'none';
            }

            async processResults(transcripts) {
                if (!this.geminiProcessor) return;

                const contextEntities = allProducts.map(p => ({
                    tradeName: p.productName || p.name
                }));

                const result = await this.geminiProcessor.processVoiceInput(transcripts, contextEntities, 'portal-order');
                
                if (result && result.confidence > 0.4) {
                    if (result.action === 'order' && result.quantity > 0) {
                        const added = window.setQty(result.correctedDrug, result.quantity);
                        if (added && added.success) {
                            this.showSpeechBubble(`✅ تم إضافة ${result.quantity}x ${result.correctedDrug}`);
                            // Open cart smoothly
                            document.getElementById('cartSection').scrollIntoView({ behavior: 'smooth' });
                            
                            // Audio feedback if required
                            const utt = new SpeechSynthesisUtterance(`تمت إضافة ${result.quantity} من ${result.correctedDrug}`);
                            utt.lang = 'ar-EG';
                            window.speechSynthesis.speak(utt);
                        } else if (added && added.warning) {
                            this.showSpeechBubble(`⚠️ ${added.warning}`);
                        }
                    } else {
                        // Regular Search mode
                        this.searchInput.value = result.correctedDrug || transcripts[0];
                        // Trigger input event
                        this.searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                        this.showSpeechBubble('بحث عن: ' + this.searchInput.value);
                    }
                } else {
                    this.showSpeechBubble('لم يتم التعرف على الدواء');
                }
            }
        }

        class SimpleVoiceSearch {
            constructor() {
                this.micBtn = document.getElementById('simpleSearchMic');
                this.searchInput = document.getElementById('searchInput');
                if (this.micBtn) this.init();
            }
            init() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { this.micBtn.style.display = 'none'; return; }
                this.recognition = new SR();
                this.recognition.lang = 'ar-EG'; 
                this.recognition.continuous = false;
                this.recognition.interimResults = true;

                this.recognition.onstart = () => {
                    this.micBtn.classList.add('listening');
                    this.searchInput.placeholder = "جاري الاستماع للبحث...";
                };
                this.recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    }
                    if (finalTranscript) {
                        this.searchInput.value = finalTranscript;
                        this.searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                };
                this.recognition.onend = () => {
                    this.micBtn.classList.remove('listening');
                    this.searchInput.placeholder = "🔍 ابحث عن منتج أو اطلب (مثال: 15 بانادول)...";
                };
                this.micBtn.addEventListener('click', () => {
                    try { this.searchInput.value = ''; this.recognition.start(); } catch(e){}
                });
            }
        }

        window.addEventListener('load', function() {
            window.orderVoiceSearch = new OrderVoiceSearch();
            window.simpleVoiceSearch = new SimpleVoiceSearch();
            
            // Hard cleanup: Ensure no old AI Assistant Panels persist from ANY cached scripts
            const killPanel = () => {
                const panels = document.querySelectorAll('[id*="ai-assistant"], [class*="ai-assistant"], [id*="aiAssistant"], [class*="aiAssistant"], #ai-ui-root');
                panels.forEach(p => {
                    p.style.display = 'none';
                    p.remove();
                });
            };
            killPanel();
            setTimeout(killPanel, 500);
        });
    </script>
