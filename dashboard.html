<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <script src="navigation.js"></script>
    <script src="sidebar.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .header {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .header p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }
        .logout-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .logout-btn:hover {
            background: #c82333;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }
        .info-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: bold;
            color: #555;
        }
        .info-value {
            color: #333;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="welcomeMsg">مرحباً</h1>
        <p>لوحة التحكم الخاصة بك</p>
    </div>
    
    <div class="container">
        <div class="info-card">
            <h2>معلومات المخزن</h2>
            <div class="info-row">
                <span class="info-label">اسم المخزن:</span>
                <span class="info-value" id="warehouseName"></span>
            </div>
            <div class="info-row">
                <span class="info-label">التليفون:</span>
                <span class="info-value" id="phone"></span>
            </div>
            <div class="info-row">
                <span class="info-label">المحافظة:</span>
                <span class="info-value" id="governorate"></span>
            </div>
            <div class="info-row">
                <span class="info-label">الإيميل:</span>
                <span class="info-value" id="email"></span>
            </div>
            <div class="info-row">
                <span class="info-label">تاريخ التسجيل:</span>
                <span class="info-value" id="registeredAt"></span>
            </div>
            <div class="info-row">
                <span class="info-label">آخر تسجيل دخول:</span>
                <span class="info-value" id="lastLogin"></span>
            </div>
            <div class="info-row">
                <span class="info-label">حالة الحساب:</span>
                <span class="info-value" id="status"></span>
            </div>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="libs/supabase.min.js"></script>
    <script>
        // ✅ تهيئة Supabase
        window.SUPABASE_URL = 'https://iksjhjxwphmvthryfeae.supabase.co';
        window.SUPABASE_KEY = 'sb_publishable_0DUy2mtXS6m5S8PwTDAANQ_XWlzbu0G';
        window.supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

        // ✅ تحميل بيانات المخزن ديناميكياً من Supabase
        async function loadWarehouseData() {
            try {
                // التحقق من الجلسة الحالية
                const { data: { session } } = await window.supabaseClient.auth.getSession();
                
                if (!session) {
                    console.log('⚠️ لا يوجد جلسة، التحقق من localStorage...');
                    const localUser = localStorage.getItem('slamtak-user-id');
                    if (!localUser) {
                        if(typeof window.showOfflineToast === 'function') window.showOfflineToast();
                        return;
                    }
                }

                console.log('🔍 جاري تحميل بيانات المخزن...');
                
                // ✅ جلب بيانات المخزن المرتبط بالمستخدم الحالي (RLS يضمن العزل)
                const { data: warehouse, error } = await window.supabaseClient
                    .from('warehouses')
                    .select('*')
                    .single();  // RLS guarantees only their warehouse is returned

                if (error) {
                    console.error('❌ خطأ في جلب البيانات:', error);
                    // استخدام البيانات المحلية كاحتياط
                    loadFromLocalStorage();
                    return;
                }

                if (!warehouse) {
                    console.warn('⚠️ لا يوجد مخزن مسجل لهذا المستخدم');
                    loadFromLocalStorage();
                    return;
                }

                console.log('✅ تم جلب بيانات المخزن:', warehouse.warehouse_name);

                // ✅ عرض بيانات المخزن
                document.getElementById('welcomeMsg').textContent = 'مرحباً ' + warehouse.warehouse_name;
                document.getElementById('warehouseName').textContent = warehouse.warehouse_name;
                document.getElementById('phone').textContent = warehouse.phone_number;
                document.getElementById('governorate').textContent = warehouse.governorate;
                document.getElementById('email').textContent = warehouse.email;
                
                const createdAt = new Date(warehouse.created_at);
                document.getElementById('registeredAt').textContent = createdAt.toLocaleDateString('ar-EG');
                document.getElementById('lastLogin').textContent = new Date().toLocaleString('ar-EG');
                document.getElementById('status').textContent = 'نشط';

                // ✅ حفظ في localStorage للاستخدام المحلي
                const userData = {
                    warehouseName: warehouse.warehouse_name,
                    email: warehouse.email,
                    phone: warehouse.phone_number,
                    governorate: warehouse.governorate,
                    userId: warehouse.user_id,
                    warehouseId: warehouse.id,
                    admin_key: warehouse.admin_key  // للتحقق من صلاحيات المدير
                };
                sessionStorage.setItem('currentUser', JSON.stringify(userData));
                localStorage.setItem('slamtak-warehouse-id', warehouse.id);

            } catch (error) {
                console.error('❌ خطأ:', error);
                loadFromLocalStorage();
            }
        }

        // ✅ تحميل من localStorage كاحتياط
        function loadFromLocalStorage() {
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            if (!currentUser) {
                if(typeof window.showOfflineToast === 'function') window.showOfflineToast();
                return;
            }

            document.getElementById('welcomeMsg').textContent = 'مرحباً ' + (currentUser.warehouseName || 'مستخدم');
            document.getElementById('warehouseName').textContent = currentUser.warehouseName || '-';
            document.getElementById('phone').textContent = currentUser.phone || '-';
            document.getElementById('governorate').textContent = currentUser.governorate || '-';
            document.getElementById('email').textContent = currentUser.email || '-';
            
            if (currentUser.registeredAt) {
                const date = new Date(currentUser.registeredAt);
                document.getElementById('registeredAt').textContent = date.toLocaleDateString('ar-EG');
            }
            document.getElementById('lastLogin').textContent = new Date().toLocaleString('ar-EG');
            document.getElementById('status').textContent = 'نشط';
        }

        // ✅ تسجيل الخروج (يحافظ على البيانات المحلية)
        async function logout() {
            // 1. إنهاء الجلسة الرسمية فقط
            await window.supabaseClient.auth.signOut();

            // 2. مسح بيانات الجلسة فقط (وليس المنتجات!)
            sessionStorage.clear();

            // ❌ لا نمسح localStorage حتى تبقى المنتجات!
            // المنتجات (slamtak-products, slamtak-sync-queue) تُحفظ للمزامنة لاحقاً

            // 3. تحويل لصفحة Login
            window.location.href = 'warehouse.html';
        }

        // ✅ تحميل البيانات عند فتح الصفحة
        document.addEventListener('DOMContentLoaded', loadWarehouseData);
    </script>
</body>
</html>
