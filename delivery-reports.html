    <script src="supabase-singleton.js"></script>
    <script>
        let currentReportData = [];

        // Load report on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Set default dates
            const today = new Date();
            const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, today.getDate());
            
            document.getElementById('startDate').value = lastMonth.toISOString().split('T')[0];
            document.getElementById('endDate').value = today.toISOString().split('T')[0];
            
            generateReport();
        });

        // Generate report
        async function generateReport() {
            try {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const statusFilter = document.getElementById('statusFilter').value;

                if (!startDate || !endDate) {
                    alert('??? ????? ??? ??????? ???? ???????');
                    return;
                }

                const warehouseId = localStorage.getItem('warehouse_id');
                if (!warehouseId) {
                    alert('????? ??? ??? ?????? ???????');
                    return;
                }

                // Load deliveries
                let query = supabase
                    .from('deliveries')
                    .select('*')
                    .eq('warehouse_id', warehouseId)
                    .gte('created_at', startDate + 'T00:00:00Z')
                    .lte('created_at', endDate + 'T23:59:59Z')
                    .order('created_at', { ascending: false });

                if (statusFilter) {
                    query = query.eq('delivery_status', statusFilter);
                }

                const { data: deliveries, error } = await query;

                if (error) throw error;

                currentReportData = deliveries || [];
                updateStats();
                updateChart();
                displayReports(currentReportData);

            } catch (error) {
                console.error('Error generating report:', error);
                alert('??? ??? ??????: ' + error.message);
            }
        }

        // Update statistics
        function updateStats() {
            const totalDeliveries = currentReportData.length;
            const deliveredCount = currentReportData.filter(d => d.delivery_status === 'delivered').length;
            const pendingCount = currentReportData.filter(d => d.delivery_status === 'pending').length;
            const totalRevenue = currentReportData.reduce((sum, d) => sum + (d.delivery_fee || 0), 0);

            document.getElementById('totalDeliveries').textContent = totalDeliveries;
            document.getElementById('deliveredCount').textContent = deliveredCount;
            document.getElementById('pendingCount').textContent = pendingCount;
            document.getElementById('totalRevenue').textContent = totalRevenue.toFixed(2);
        }

        // Update chart
        function updateChart() {
            const statusCounts = {
                pending: currentReportData.filter(d => d.delivery_status === 'pending').length,
                preparing: currentReportData.filter(d => d.delivery_status === 'preparing').length,
                shipped: currentReportData.filter(d => d.delivery_status === 'shipped').length,
                'out-for-delivery': currentReportData.filter(d => d.delivery_status === 'out-for-delivery').length,
                delivered: currentReportData.filter(d => d.delivery_status === 'delivered').length,
                cancelled: currentReportData.filter(d => d.delivery_status === 'cancelled').length
            };

            const total = currentReportData.length;

            // Update bars
            document.getElementById('pendingBar').style.width = total > 0 ? (statusCounts.pending / total * 100) + '%' : '0%';
            document.getElementById('pendingValue').textContent = statusCounts.pending;

            document.getElementById('preparingBar').style.width = total > 0 ? (statusCounts.preparing / total * 100) + '%' : '0%';
            document.getElementById('preparingValue').textContent = statusCounts.preparing;

            document.getElementById('shippedBar').style.width = total > 0 ? (statusCounts.shipped / total * 100) + '%' : '0%';
            document.getElementById('shippedValue').textContent = statusCounts.shipped;

            document.getElementById('outForDeliveryBar').style.width = total > 0 ? (statusCounts['out-for-delivery'] / total * 100) + '%' : '0%';
            document.getElementById('outForDeliveryValue').textContent = statusCounts['out-for-delivery'];

            document.getElementById('deliveredBar').style.width = total > 0 ? (statusCounts.delivered / total * 100) + '%' : '0%';
            document.getElementById('deliveredValue').textContent = statusCounts.delivered;

            document.getElementById('cancelledBar').style.width = total > 0 ? (statusCounts.cancelled / total * 100) + '%' : '0%';
            document.getElementById('cancelledValue').textContent = statusCounts.cancelled;
        }

        // Display reports
        function displayReports(reports) {
            const tbody = document.getElementById('reportsBody');
            
            if (reports.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">?? ???? ??????? ???????</td></tr>';
                return;
            }

            tbody.innerHTML = reports.map(report => `
                <tr>
                    <td>${report.customer_name || '?? ???'}</td>
                    <td>${report.phone_number || '?? ???? ???'}</td>
                    <td>${report.delivery_address || '?? ???? ???'}</td>
                    <td>${report.order_details || '-'}</td>
                    <td>${(report.delivery_fee || 0).toFixed(2)} ??</td>
                    <td>${new Date(report.created_at).toLocaleDateString('ar-SA')}</td>
                    <td><span class="status-badge status-${report.delivery_status}">${getStatusText(report.delivery_status)}</span></td>
                    <td>${report.tracking_number || '-'}</td>
                </tr>
            `).join('');
        }

        // Get status text
        function getStatusText(status) {
            const statusMap = {
                'pending': '??????',
                'preparing': '??????',
                'shipped': '??????',
                'out-for-delivery': '??????',
                'delivered': '?????',
                'cancelled': '??????'
            };
            return statusMap[status] || status;
        }

        // Export to Excel
        function exportToExcel() {
            if (currentReportData.length === 0) {
                alert('?? ???? ??????? ???????');
                return;
            }

            // Create CSV content
            const headers = ['??? ??????', '??? ??????', '???? ??????', '???? ??????', '????? ??????', '???? ??????', '???? ??????'];
            const csvContent = [
                headers.join(','),
                ...currentReportData.map(report => [
                    report.customer_name || '',
                    report.phone_number || '',
                    report.delivery_address || '',
                    report.order_details || '',
                    report.delivery_fee || 0,
                    new Date(report.created_at).toLocaleDateString('ar-SA'),
                    getStatusText(report.delivery_status)
                ].join(','))
            ].join('\n');

            // Create download link
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `delivery_report_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert('?? ??? ?????? ??????!');
        }

        // Print report
        function printReport() {
            window.print();
        }

        // Refresh report
        function refreshReport() {
            generateReport();
        }
    </script>
