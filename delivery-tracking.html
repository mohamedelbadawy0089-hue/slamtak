<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>???? ??????</title>
    <script src="navigation.js"></script>
    <script src="libs/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .back-arrow {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .back-arrow:hover {
            background: #5a6fd8;
            transform: scale(1.1);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            margin-top: 80px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .tracking-form {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }
        .form-group {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 15px;
            align-items: center;
        }
        .form-label {
            font-weight: bold;
            color: #555;
        }
        .form-control {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 16px;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        .btn-warning:hover {
            background: #e0a800;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        .tracking-list {
            margin-top: 30px;
        }
        .tracking-item {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .tracking-item:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }
        .tracking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .tracking-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .tracking-field {
            display: flex;
            flex-direction: column;
        }
        .field-label {
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
        }
        .field-value {
            color: #333;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .status-pending {
            background: #ffc107;
            color: #333;
        }
        .status-preparing {
            background: #17a2b8;
            color: white;
        }
        .status-shipped {
            background: #6f42c1;
            color: white;
        }
        .status-out-for-delivery {
            background: #fd7e14;
            color: white;
        }
        .status-delivered {
            background: #28a745;
            color: white;
        }
        .status-cancelled {
            background: #dc3545;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .tracking-timeline {
            margin-top: 15px;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .timeline-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .timeline-item:last-child {
            border-bottom: none;
        }
        .timeline-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 10px;
            margin-right: 10px;
        }
        .timeline-dot.completed {
            background: #28a745;
        }
        .timeline-dot.pending {
            background: #ffc107;
        }
        .timeline-dot.active {
            background: #667eea;
        }
        .timeline-text {
            flex: 1;
            font-size: 14px;
        }
        .timeline-time {
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <button class="back-arrow" onclick="window.location.replace('products.html')">?</button>

    <div class="container">
        <h2>???? ??????</h2>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="???? ?? ??? ?????? ??? ??? ??????..." onkeyup="searchDeliveries()">
        </div>

        <div class="tracking-form">
            <div class="form-group">
                <label class="form-label">??? ???????:</label>
                <input type="text" id="customerName" class="form-control" placeholder="??? ??? ???????">
            </div>
            <div class="form-group">
                <label class="form-label">??? ??????:</label>
                <input type="tel" id="phoneNumber" class="form-control" placeholder="??? ??? ??????">
            </div>
            <div class="form-group">
                <label class="form-label">???? ??????:</label>
                <input type="text" id="deliveryAddress" class="form-control" placeholder="??? ??? ??????">
            </div>
            <div class="form-group">
                <label class="form-label">???? ??????:</label>
                <input type="text" id="orderDetails" class="form-control" placeholder="??? ??? ??????">
            </div>
            <div class="form-group">
                <label class="form-label">????? ??????:</label>
                <input type="number" id="deliveryFee" class="form-control" placeholder="??? ??? ??????" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label class="form-label">????? ??????:</label>
                <input type="text" id="trackingNumber" class="form-control" placeholder="??? ??? ??????" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">???? ??????:</label>
                <select id="trackingStatus" class="form-control">
                    <option value="pending">??????</option>
                    <option value="preparing">??????</option>
                    <option value="shipped">??????</option>
                    <option value="out-for-delivery">??????</option>
                    <option value="delivered">?????</option>
                    <option value="cancelled">??????</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label"></label>
                <button class="btn btn-primary" onclick="addTracking()">+ ???? ??????</button>
            </div>
        </div>

        <div class="tracking-list">
            <div id="trackingList" class="loading-spinner">
                ... ??? ???????
            </div>
        </div>
    </div>

    <script src="supabase-singleton.js"></script>
    <script>
        // Load tracking data on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadTrackingData();
            generateTrackingNumber();
        });

        // Generate tracking number
        function generateTrackingNumber() {
            const trackingNumber = 'TRK' + Date.now() + Math.floor(Math.random() * 1000);
            document.getElementById('trackingNumber').value = trackingNumber;
        }

        // Add new tracking
        async function addTracking() {
            try {
                const customerName = document.getElementById('customerName').value.trim();
                const phoneNumber = document.getElementById('phoneNumber').value.trim();
                const deliveryAddress = document.getElementById('deliveryAddress').value.trim();
                const orderDetails = document.getElementById('orderDetails').value.trim();
                const deliveryFee = parseFloat(document.getElementById('deliveryFee').value) || 0;
                const trackingNumber = document.getElementById('trackingNumber').value;
                const trackingStatus = document.getElementById('trackingStatus').value;

                if (!customerName || !phoneNumber || !deliveryAddress) {
                    alert('??? ??? ?????: ??? ?????? ???? ?????? ???? ??????');
                    return;
                }

                const trackingData = {
                    customer_name: customerName,
                    phone_number: phoneNumber,
                    delivery_address: deliveryAddress,
                    order_details: orderDetails,
                    delivery_fee: deliveryFee,
                    tracking_number: trackingNumber,
                    tracking_status: trackingStatus,
                    warehouse_id: localStorage.getItem('warehouse_id'),
                    created_at: new Date().toISOString()
                };

                const { data, error } = await supabase
                    .from('delivery_tracking')
                    .insert([trackingData])
                    .select();

                if (error) throw error;

                // Clear form
                document.getElementById('customerName').value = '';
                document.getElementById('phoneNumber').value = '';
                document.getElementById('deliveryAddress').value = '';
                document.getElementById('orderDetails').value = '';
                document.getElementById('deliveryFee').value = '';
                document.getElementById('trackingStatus').value = 'pending';
                generateTrackingNumber();

                // Reload tracking data
                loadTrackingData();
                
                alert('?? ??? ?????? ??????!');

            } catch (error) {
                console.error('Error adding tracking:', error);
                alert('??? ??? ?????: ' + error.message);
            }
        }

        // Load all tracking data
        async function loadTrackingData() {
            try {
                const warehouseId = localStorage.getItem('warehouse_id');
                if (!warehouseId) {
                    document.getElementById('trackingList').innerHTML = '<div class="empty-state">????? ??? ??? ?????? ???????</div>';
                    return;
                }

                const { data: trackingData, error } = await supabase
                    .from('delivery_tracking')
                    .select('*')
                    .eq('warehouse_id', warehouseId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                displayTrackingData(trackingData || []);

            } catch (error) {
                console.error('Error loading tracking data:', error);
                document.getElementById('trackingList').innerHTML = '<div class="empty-state">??? ??? ???????: ' + error.message + '</div>';
            }
        }

        // Display tracking data
        function displayTrackingData(trackingData) {
            const trackingList = document.getElementById('trackingList');
            
            if (trackingData.length === 0) {
                trackingList.innerHTML = '<div class="empty-state">?? ???? ??????? ???????</div>';
                return;
            }

            trackingList.innerHTML = trackingData.map(tracking => `
                <div class="tracking-item">
                    <div class="tracking-header">
                        <h3>${tracking.customer_name || '?? ???'}</h3>
                        <div>
                            <span class="status-badge status-${tracking.tracking_status}">
                                ${getTrackingStatusText(tracking.tracking_status)}
                            </span>
                            <span style="margin-left: 10px; font-weight: bold; color: #667eea;">
                                #${tracking.tracking_number}
                            </span>
                        </div>
                    </div>
                    <div class="tracking-info">
                        <div class="tracking-field">
                            <span class="field-label">??? ??????:</span>
                            <span class="field-value">${tracking.phone_number || '?? ???? ???'}</span>
                        </div>
                        <div class="tracking-field">
                            <span class="field-label">???? ??????:</span>
                            <span class="field-value">${tracking.delivery_address || '?? ???? ???'}</span>
                        </div>
                        <div class="tracking-field">
                            <span class="field-label">????? ??????:</span>
                            <span class="field-value">${tracking.delivery_fee || 0} ??</span>
                        </div>
                        <div class="tracking-field">
                            <span class="field-label">???? ??????:</span>
                            <span class="field-value">${new Date(tracking.created_at).toLocaleDateString('ar-SA')}</span>
                        </div>
                    </div>
                    ${tracking.order_details ? `
                        <div class="tracking-field" style="margin-top: 15px;">
                            <span class="field-label">???? ??????:</span>
                            <span class="field-value">${tracking.order_details}</span>
                        </div>
                    ` : ''}
                    <div class="tracking-timeline">
                        ${generateTimeline(tracking.tracking_status)}
                    </div>
                    <div class="actions">
                        <button class="btn btn-warning btn-small" onclick="updateTrackingStatus('${tracking.id}', 'preparing')">??????</button>
                        <button class="btn btn-primary btn-small" onclick="updateTrackingStatus('${tracking.id}', 'shipped')">??????</button>
                        <button class="btn btn-warning btn-small" onclick="updateTrackingStatus('${tracking.id}', 'out-for-delivery')">??????</button>
                        <button class="btn btn-success btn-small" onclick="updateTrackingStatus('${tracking.id}', 'delivered')">?????</button>
                        <button class="btn btn-danger btn-small" onclick="updateTrackingStatus('${tracking.id}', 'cancelled')">??????</button>
                        <button class="btn btn-primary btn-small" onclick="deleteTracking('${tracking.id}')">????</button>
                    </div>
                </div>
            `).join('');
        }

        // Generate timeline
        function generateTimeline(status) {
            const timeline = [
                { status: 'pending', text: '??????', completed: true },
                { status: 'preparing', text: '??????', completed: ['preparing', 'shipped', 'out-for-delivery', 'delivered'].includes(status) },
                { status: 'shipped', text: '??????', completed: ['shipped', 'out-for-delivery', 'delivered'].includes(status) },
                { status: 'out-for-delivery', text: '??????', completed: ['out-for-delivery', 'delivered'].includes(status) },
                { status: 'delivered', text: '?????', completed: status === 'delivered' }
            ];

            return timeline.map(item => `
                <div class="timeline-item">
                    <div class="timeline-dot ${item.completed ? 'completed' : status === item.status ? 'active' : 'pending'}"></div>
                    <span class="timeline-text">${item.text}</span>
                    <span class="timeline-time">${item.completed ? '??' : status === item.status ? '????' : '??????'}</span>
                </div>
            `).join('');
        }

        // Get tracking status text in Arabic
        function getTrackingStatusText(status) {
            const statusMap = {
                'pending': '??????',
                'preparing': '??????',
                'shipped': '??????',
                'out-for-delivery': '??????',
                'delivered': '?????',
                'cancelled': '??????'
            };
            return statusMap[status] || status;
        }

        // Update tracking status
        async function updateTrackingStatus(trackingId, newStatus) {
            try {
                const { error } = await supabase
                    .from('delivery_tracking')
                    .update({ tracking_status: newStatus })
                    .eq('id', trackingId);

                if (error) throw error;

                loadTrackingData();
                alert('?? ??????? ???????!');

            } catch (error) {
                console.error('Error updating tracking status:', error);
                alert('??? ??? ?????: ' + error.message);
            }
        }

        // Delete tracking
        async function deleteTracking(trackingId) {
            if (!confirm('?? ??? ?? ??? ????? ??????')) {
                return;
            }

            try {
                const { error } = await supabase
                    .from('delivery_tracking')
                    .delete()
                    .eq('id', trackingId);

                if (error) throw error;

                loadTrackingData();
                alert('?? ??? ???????!');

            } catch (error) {
                console.error('Error deleting tracking:', error);
                alert('??? ??? ?????: ' + error.message);
            }
        }

        // Search deliveries
        function searchDeliveries() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const trackingItems = document.querySelectorAll('.tracking-item');
            
            trackingItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
