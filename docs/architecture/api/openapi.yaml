          application/json:
            schema: { $ref: '#/components/schemas/SalesInvoiceInput' }
      responses:
        '201':
          description: أُنشئت
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
