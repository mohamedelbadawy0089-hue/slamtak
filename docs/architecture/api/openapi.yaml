      operationId: platformListTenants
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [trial, active, suspended, churned] }
      responses:
        '200': { $ref: '#/components/responses/PlatformTenantPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Platform]
      summary: إنشاء حساب مخزن (Tenant) ومخزنه الوحيد
      description: |
        ينشئ صف `tenants` + **مخزنًا واحدًا** + عضوية المالك + الإعدادات الافتراضية
        في معاملة واحدة (ADR-025). لا يوجد أي مسار يضيف مخزنًا لحساب قائم، ولا
        يستطيع مسؤول المنصة تغيير قاعدة «حساب واحد = مخزن واحد».
      operationId: platformCreateTenant
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformTenantInput' }
      responses:
        '201':
          description: أُنشئ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlatformTenant' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /platform/tenants/{id}/suspend:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [Platform]
      summary: تعليق حساب مخزن (يمنع الكتابة فورًا)
      operationId: platformSuspendTenant
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
              additionalProperties: false
      responses:
        '204': { description: عُلّق }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /platform/plans:
    get:
      tags: [Platform]
      summary: الخطط والحدود
      operationId: platformListPlans
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
