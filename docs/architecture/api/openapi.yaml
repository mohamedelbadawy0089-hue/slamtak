openapi: 3.1.0
info:
  title: Slamtak WMS API
  version: 1.0.0
  summary: واجهة إدارة مخازن الأدوية — عقد v1 المعتمد
  description: |
    هذا الملف هو **العقد الملزم** بين الواجهة والخادم. يُولَّد منه عميل TypeScript
    في `packages/contracts`، وأي تغيير كاسر يستلزم `/api/v2` بحسب `10-api-architecture.md` §5.

    ## قواعد ملزمة
    - الهوية والمخزن يُستنتجان من الجلسة والعضوية، **لا** من الجسم أو رأس طلب.
    - كل طلب مغيّر يقبل `Idempotency-Key`؛ تكراره بنفس الجسم يعيد نفس الاستجابة.
    - كل مورد ذي `version` يفرض `If-Match` وإلا `428`.
    - المورد التابع لمخزن آخر يعيد `404` لا `403`.
    - كل خطأ بصيغة RFC 9457 مع `code` ثابت و`requestId`.
  contact:
    name: Slamtak Architecture Team
    url: https://docs.slamtak.com
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://app.slamtak.com/api/v1
    description: الإنتاج
  - url: https://staging.slamtak.com/api/v1
    description: الاختبار
tags:
  - name: Auth
    description: تسجيل الدخول، الجلسات، MFA، وتصعيد الصلاحية المؤقت.
  - name: Tenancy
    description: المخزن والفروع والمخازن والإعدادات.
  - name: Users
    description: المستخدمون والأدوار والصلاحيات.
  - name: Catalog
    description: الأدوية والتصنيفات والوحدات وقوائم الأسعار.
  - name: Inventory
    description: الأرصدة والتشغيلات والحركات والتسويات والتحويلات والجرد.
  - name: Purchasing
    description: الموردون وأوامر الشراء والاستلام وفواتير الموردين والمرتجعات.
  - name: Sales
    description: العملاء والفواتير والمرتجعات والتحصيل.
  - name: Delivery
    description: خطوط السير ومهام التوصيل وإثبات التسليم.
  - name: Finance
    description: دليل الحسابات والقيود والخزينة والتقارير الضريبية.
  - name: HR
    description: الموظفون والحضور والرواتب.
  - name: Reports
    description: تقارير جاهزة وتصدير غير متزامن.
  - name: Notifications
    description: الإشعارات وتفضيلاتها.
  - name: Platform
    description: "لوحة المنصة: تعاقد واستخدام وصحة — بلا بيانات تشغيلية للمخازن."
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: تسجيل الدخول بالبريد وكلمة المرور
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: نجاح — إما جلسة كاملة أو تحدي MFA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: تجاوز حد المحاولات (5/دقيقة)
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: تأكيد رمز TOTP أو رمز الاستعادة
      operationId: verifyMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: جلسة كاملة
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: تدوير رمز الوصول (Refresh متداول)
      operationId: refresh
      security: [{ refreshCookie: [] }]
      responses:
        '200':
          description: رموز جديدة؛ إعادة استخدام رمز قديم تُبطل العائلة كاملة
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: إبطال الجلسة الحالية
      operationId: logout
      responses:
        '204': { description: أُبطلت الجلسة }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      summary: الهوية والعضويات والصلاحيات الفعالة
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/step-up:
    post:
      tags: [Auth]
      summary: تصعيد مؤقت للعمليات الحساسة (تعديل أرصدة، اعتماد جرد)
      operationId: stepUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, writeOnly: true, minLength: 12, maxLength: 128 }
                totpCode: { type: string, pattern: '^[0-9]{6}$' }
              additionalProperties: false
      responses:
        '200':
          description: نافذة تصعيد 10 دقائق
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [stepUpUntil]
                        properties:
                          stepUpUntil: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/password/change:
    post:
      tags: [Auth]
      summary: تغيير كلمة المرور (يُبطل كل الجلسات الأخرى)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, writeOnly: true, minLength: 12, maxLength: 128 }
                newPassword: { type: string, writeOnly: true, minLength: 12, maxLength: 128 }
              additionalProperties: false
      responses:
        '204': { description: تم التغيير وأُبطلت الجلسات الأخرى }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /auth/realtime-token:
    post:
      tags: [Auth]
      summary: إصدار توكن قصير لاشتراك Realtime (لا يصلح لبقية الواجهة)
      operationId: issueRealtimeToken
      description: |
        توكن ES256 عمره 60 دقيقة، حمولته `sub` و`role: authenticated` و`tenant_id` و`scope: realtime` فقط.
        يُستهلك لإصداره معدل منخفض، ولا يُصدر لحساب معطّل أو جلسة مُبطلة. انظر `28` §7.1 وADR-024.
      responses:
        '200':
          description: توكن الاشتراك وموضوع القناة الخاصة
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token, expiresAt, topic, url]
                        properties:
                          token:
                            type: string
                            description: توكن الاشتراك — لا يُسجَّل في السجلات ولا يُخزَّن
                          expiresAt: { type: string, format: date-time }
                          topic: { type: string, pattern: '^tenant:[0-9a-fA-F-]{36}$' }
                          url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tenant:
    get:
      tags: [Tenancy]
      summary: بيانات المخزن (Tenant) الحالي
      operationId: getTenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Tenancy]
      summary: تعديل بيانات المخزن
      operationId: updateTenant
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 3, maxLength: 120 }
                taxId: { type: string, maxLength: 30 }
                licenseNumber: { type: string, maxLength: 60 }
                timezone: { type: string, examples: [Africa/Cairo] }
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /warehouse:
    get:
      tags: [Tenancy]
      summary: المخزن الوحيد للحساب
      description: |
        حساب واحد = مخزن واحد (ADR-025). لا معرّف مخزن في المسار أو الطلب:
        يُشتق من عضوية المستخدم على الخادم، ويُعاد هنا للعرض فقط.
      operationId: getWarehouse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Warehouse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Tenancy]
      summary: تعديل بيانات المخزن (الاسم، العنوان، الترخيص)
      description: لا يغيّر `code` ولا ينشئ مخزنًا؛ الحقول البنيوية ثابتة.
      operationId: updateWarehouse
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Warehouse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /settings:
    get:
      tags: [Tenancy]
      summary: إعدادات المخزن (سياسات FEFO، تنبيهات الانتهاء، الترقيم)
      operationId: getSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Tenancy]
      summary: تعديل الإعدادات
      operationId: updateSettings
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Settings' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /users:
    get:
      tags: [Users]
      summary: قائمة المستخدمين في المخزن
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended] }
        - name: search
          in: query
          schema: { type: string, minLength: 3, maxLength: 80 }
      responses:
        '200': { $ref: '#/components/responses/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: دعوة مستخدم جديد
      operationId: inviteUser
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInvite' }
      responses:
        '201':
          description: أُرسلت الدعوة
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    patch:
      tags: [Users]
      summary: تعديل بيانات مستخدم
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, minLength: 3, maxLength: 120 }
                phone: { type: string, maxLength: 20 }
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}/suspend:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [Users]
      summary: تعليق مستخدم وإبطال جلساته
      operationId: suspendUser
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
              additionalProperties: false
      responses:
        '204': { description: عُلّق }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /roles:
    get:
      tags: [Users]
      summary: قائمة الأدوار
      operationId: listRoles
      responses:
        '200': { $ref: '#/components/responses/RolePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: إنشاء دور
      operationId: createRole
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: أُنشئ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /roles/{id}/permissions:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    put:
      tags: [Users]
      summary: ضبط صلاحيات دور (منع منح ما لا تملكه)
      operationId: setRolePermissions
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  maxItems: 300
                  items: { type: string, pattern: '^[a-z_]+(\.[a-z_]+)+$' }
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}/roles:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    put:
      tags: [Users]
      summary: إسناد أدوار لمستخدم
      operationId: setUserRoles
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds:
                  type: array
                  items: { type: string, format: uuid }
              additionalProperties: false
      responses:
        '204': { description: تم الإسناد }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /medicines:
    get:
      tags: [Catalog]
      summary: بحث الأدوية
      operationId: listMedicines
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          description: بحث ثلاثي (trigram) بالاسم أو الباركود أو المادة الفعالة
          schema: { type: string, minLength: 3, maxLength: 80 }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: active
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200': { $ref: '#/components/responses/MedicinePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Catalog]
      summary: إضافة دواء
      operationId: createMedicine
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicineInput' }
      responses:
        '201':
          description: أُنشئ
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Medicine' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /medicines/{id}:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [Catalog]
      summary: تفاصيل دواء مع أرصدته
      operationId: getMedicine
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Medicine' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Catalog]
      summary: تعديل دواء
      operationId: updateMedicine
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicineInput' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Medicine' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /medicines/import:
    post:
      tags: [Catalog]
      summary: استيراد أدوية من ملف (مهمة غير متزامنة)
      operationId: importMedicines
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: xlsx/csv ≤ 10MB
                dryRun: { type: boolean, default: true }
              additionalProperties: false
      responses:
        '202':
          description: قُبل للتحقق — النتيجة عبر `/jobs/{id}`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobRef' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /categories:
    get:
      tags: [Catalog]
      summary: قائمة التصنيفات
      operationId: listCategories
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
