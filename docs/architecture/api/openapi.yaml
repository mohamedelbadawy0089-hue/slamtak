      operationId: platformHealth
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: تدهور
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /platform/usage:
    get:
      tags: [Platform]
      summary: استهلاك المخزن مقابل حدود الخطة (أرقام مجمّعة فقط)
      operationId: platformUsage
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Usage' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-slamtak_at
      description: كوكي وصول HttpOnly؛ الويب فقط، مع CSRF double-submit.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-slamtak_rt
      description: كوكي تجديد متداول؛ يُدوَّر مع كل استخدام.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: للموبايل وتكاملات الخادم؛ ES256، عمر 10 دقائق.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: مؤشر ترميز opaque من استجابة سابقة.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      description: رقم النسخة؛ إلزامي على الموارد ذات version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: مفتاح فريد للطلب (UUIDv7) صالح 24 ساعة.
      schema: { type: string, minLength: 16, maxLength: 128 }
    StepUpHeader:
      name: X-Step-Up
      in: header
      description: مطلوب للعمليات الحساسة؛ يحمل رمز التصعيد قصير العمر.
      schema: { type: string, minLength: 20 }

  headers:
    Location:
      schema: { type: string, format: uri-reference }
    ETag:
      schema: { type: string, pattern: '^"[0-9]+"$' }
    RetryAfter:
      schema: { type: integer, minimum: 1 }
    RateLimitRemaining:
      schema: { type: integer, minimum: 0 }

  responses:
    Unauthorized: &unauth
      description: بلا هوية صالحة
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.slamtak.com/errors/auth-required
            title: المصادقة مطلوبة
            status: 401
            code: AUTH_REQUIRED
            instance: /api/v1/stock
            requestId: 01J8Z3K4M5N6P7Q8R9S0T1U2V3
    Forbidden: &forbid
      description: صلاحية غير كافية أو مخزن آخر
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.slamtak.com/errors/permission-denied
            title: الصلاحية غير كافية
            status: 403
            code: PERMISSION_DENIED
            instance: /api/v1/stock/adjustments
            requestId: 01J8Z3K4M5N6P7Q8R9S0T1U2V3
    NotFound: &notfound
      description: غير موجود (يشمل موارد مخزن آخر — بلا كشف وجود)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.slamtak.com/errors/resource-not-found
            title: المورد غير موجود
            status: 404
            code: RESOURCE_NOT_FOUND
            instance: /api/v1/sales/invoices/8f2c1a7e-0000-0000-0000-000000000000
            requestId: 01J8Z3K4M5N6P7Q8R9S0T1U2V3
    Conflict: &conflict
      description: تعارض نسخة أو رصيد أو مفتاح تكرار
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            version:
              value:
                type: https://docs.slamtak.com/errors/version-conflict
                title: تعارض نسخة
                status: 409
                code: VERSION_CONFLICT
                detail: النسخة الحالية 7 والمرسلة 5
                instance: /api/v1/medicines/aaaaaaaa-0000-0000-0000-0000000000c1
                requestId: 01J8Z3K4M5N6P7Q8R9S0T1U2V3
            stock:
              value:
                type: https://docs.slamtak.com/errors/insufficient-stock
                title: الرصيد غير كافٍ
                status: 409
                code: INSUFFICIENT_STOCK
                detail: المتوفر 12 والمطلوب 15
                instance: /api/v1/sales/invoices
                requestId: 01J8Z3K4M5N6P7Q8R9S0T1U2V3
                errors:
                  - field: lines[2].qty
                    code: EXCEEDS_AVAILABLE
                    message: الكمية أكبر من المتاح في التشغيلات الصالحة
    Unprocessable: &invalid
      description: فشل التحقق
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.slamtak.com/errors/validation-failed
            title: بيانات غير صالحة
            status: 422
            code: VALIDATION_FAILED
            instance: /api/v1/medicines
            requestId: 01J8Z3K4M5N6P7Q8R9S0T1U2V3
            errors:
              - field: name
                code: TOO_SHORT
                message: الاسم أقصر من 3 أحرف
    PeriodClosed: &closed
      description: الفترة المحاسبية مغلقة
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.slamtak.com/errors/period-closed
            title: الفترة مغلقة
            status: 423
            code: PERIOD_CLOSED
            instance: /api/v1/sales/invoices
            requestId: 01J8Z3K4M5N6P7Q8R9S0T1U2V3
    PreconditionRequired: &pre
      description: If-Match مطلوب
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.slamtak.com/errors/precondition-required
            title: شرط مسبق مطلوب
            status: 428
            code: PRECONDITION_REQUIRED
            instance: /api/v1/tenant
            requestId: 01J8Z3K4M5N6P7Q8R9S0T1U2V3
    RateLimited: &limited
      description: تجاوز حد المعدل
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.slamtak.com/errors/rate-limited
            title: طلبات كثيرة
            status: 429
            code: RATE_LIMITED
            instance: /api/v1/auth/login
