      description: |
        التسعير يُحسب على الخادم من قائمة الأسعار؛ أي سعر في الجسم يُتجاهل ويُسجَّل تحذير.
        التخصيص يتبع FEFO ويُعاد في allocations؛ التشغيلة المنتهية أو المحجوبة لا تُخصص.
