  schemas:
    ErrorItem:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
      additionalProperties: false
    Problem:
      type: object
      description: RFC 9457 Problem Details مع code ثابت وrequestId.
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ErrorItem' }
      additionalProperties: true
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    PageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {}
        meta: { $ref: '#/components/schemas/PageMeta' }
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        version: { type: integer, minimum: 1 }
    PageMeta:
      type: object
      required: [requestId, hasMore]
      properties:
        requestId: { type: string }
        nextCursor: { type: ['string', 'null'] }
        hasMore: { type: boolean }
        total: { type: integer, minimum: 0 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, writeOnly: true, minLength: 12, maxLength: 128 }
        tenantSlug:
          type: string
          maxLength: 60
          description: اختياري لتحديد المخزن عند تعدد العضويات؛ لا يُستخدم للتفويض.
      additionalProperties: false
    MfaVerifyRequest:
      type: object
      required: [mfaToken, code]
      properties:
        mfaToken: { type: string, minLength: 20 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, maxLength: 40 }
      additionalProperties: false
    LoginResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/SessionEstablished'
            - $ref: '#/components/schemas/MfaChallenge'
        meta: { $ref: '#/components/schemas/Meta' }
    SessionEstablished:
      type: object
      required: [status, expiresAt]
      properties:
        status: { const: authenticated }
        expiresAt: { type: string, format: date-time }
        mfaEnrolled: { type: boolean }
      additionalProperties: false
    MfaChallenge:
      type: object
      required: [status, mfaToken]
      properties:
        status: { const: mfa_required }
        mfaToken: { type: string }
      additionalProperties: false
    Me:
      type: object
      required: [user, memberships, permissions]
      properties:
        user:
          type: object
          required: [id, email, fullName, mfaEnrolled]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            fullName: { type: string }
            mfaEnrolled: { type: boolean }
            locale: { type: string, examples: [ar-EG] }
          additionalProperties: false
        memberships:
          type: array
          items:
            type: object
            required: [tenantId, tenantName, warehouseId, roles]
            properties:
              tenantId: { type: string, format: uuid }
              tenantName: { type: string }
              warehouseId: { type: string, format: uuid, readOnly: true }
              roles: { type: array, items: { type: string } }
            additionalProperties: false
        permissions:
          type: array
          items: { type: string, pattern: '^[a-z_]+(\.[a-z_]+)+$' }
        stepUpUntil: { type: ['string', 'null'], format: date-time }
      additionalProperties: false

    Tenant:
      type: object
      required: [id, name, slug, status, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [trial, active, suspended, churned] }
        taxId: { type: ['string', 'null'] }
        licenseNumber: { type: ['string', 'null'] }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
      additionalProperties: false
    Warehouse:
      type: object
      description: المخزن الوحيد للحساب — لا يُنشأ ولا يُحذف عبر واجهة الـAPI (ADR-025).
      required: [id, code, name, isActive]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, readOnly: true, examples: [MAIN] }
        name: { type: string, minLength: 2, maxLength: 120 }
        address: { type: ['string', 'null'], maxLength: 300 }
        licenseNo: { type: ['string', 'null'], maxLength: 60 }
        isActive: { type: boolean }
        version: { type: integer, readOnly: true }
      additionalProperties: false
    WarehouseUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        address: { type: ['string', 'null'], maxLength: 300 }
        licenseNo: { type: ['string', 'null'], maxLength: 60 }
      additionalProperties: false
    Settings:
      type: object
      properties:
        fefoEnabled: { type: boolean, default: true }
        blockExpiredSales: { type: boolean, default: true }
        expiryAlertDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
        allowNegativeStock: { type: boolean, default: false, readOnly: true }
        requireStepUpForAdjustments: { type: boolean, default: true }
        documentPrefixes:
          type: object
          additionalProperties: { type: string, maxLength: 6 }
        version: { type: integer, readOnly: true }
      additionalProperties: false

    User:
      type: object
      required: [id, email, fullName, status, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: ['string', 'null'] }
        status: { type: string, enum: [invited, active, suspended] }
        roles: { type: array, items: { type: string } }
        warehouseId: { type: string, format: uuid, readOnly: true }
        mfaEnrolled: { type: boolean }
        lastLoginAt: { type: ['string', 'null'], format: date-time }
        version: { type: integer }
      additionalProperties: false
    UserInvite:
      type: object
      required: [email, fullName, roleIds]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 3, maxLength: 120 }
        roleIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
      additionalProperties: false
    Role:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        permissions: { type: array, items: { type: string } }
        isSystem: { type: boolean, readOnly: true }
        version: { type: integer, readOnly: true }
      additionalProperties: false

    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parentId: { type: ['string', 'null'], format: uuid }
        medicineCount: { type: integer, readOnly: true }
      additionalProperties: false
    Unit:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        baseUnitId: { type: ['string', 'null'], format: uuid }
        factor: { type: number, exclusiveMinimum: 0 }
      additionalProperties: false
    MedicineInput:
      type: object
      required: [name, categoryId, unitId, minStock]
      properties:
        name: { type: string, minLength: 3, maxLength: 200 }
        scientificName: { type: string, maxLength: 200 }
        barcode: { type: string, maxLength: 64 }
        categoryId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        minStock: { type: number, minimum: 0 }
        maxStock: { type: number, minimum: 0 }
        reorderPoint: { type: number, minimum: 0 }
        storageConditions: { type: string, enum: [room, cold_chain, freezer, controlled] }
        isControlled: { type: boolean, default: false }
        isActive: { type: boolean, default: true }
      additionalProperties: false
    Medicine:
      type: object
      required: [id, name, categoryId, unitId, isActive, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scientificName: { type: ['string', 'null'] }
        barcode: { type: ['string', 'null'] }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        unitId: { type: string, format: uuid }
        unitName: { type: string }
        minStock: { type: number }
        maxStock: { type: ['number', 'null'] }
        reorderPoint: { type: ['number', 'null'] }
        storageConditions: { type: string }
        isControlled: { type: boolean }
        isActive: { type: boolean }
        totalOnHand: { type: number, readOnly: true }
        version: { type: integer }
      additionalProperties: false
    PriceList:
      type: object
      required: [id, name, kind, currency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [retail, wholesale, insurance, cost] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        itemsCount: { type: integer, readOnly: true }
        version: { type: integer }
      additionalProperties: false
    PriceListItem:
      type: object
      required: [medicineId, price]
      properties:
        medicineId: { type: string, format: uuid }
        price: { type: number, exclusiveMinimum: 0 }
        minQty: { type: number, minimum: 1, default: 1 }
      additionalProperties: false

    StockRow:
      type: object
      required: [medicineId, medicineName, warehouseId, onHand, reserved, available]
      properties:
        medicineId: { type: string, format: uuid }
        medicineName: { type: string }
        warehouseId: { type: string, format: uuid }
        warehouseName: { type: string }
        onHand: { type: number }
        reserved: { type: number }
        available: { type: number }
        minStock: { type: number }
        belowMin: { type: boolean }
        nearestExpiry: { type: ['string', 'null'], format: date }
        stockValue: { type: number, description: بالجنيه المصري بسعر التكلفة }
      additionalProperties: false
    StockBatch:
      type: object
      required: [id, medicineId, batchNumber, expiryDate, qtyOnHand, status]
      properties:
        id: { type: string, format: uuid }
        medicineId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        batchNumber: { type: string }
        expiryDate: { type: string, format: date }
        qtyOnHand: { type: number }
        qtyReserved: { type: number }
        unitCost: { type: number }
        status: { type: string, enum: [available, blocked, expired, quarantine] }
        daysToExpiry: { type: integer, readOnly: true }
        fefoRank: { type: integer, readOnly: true, description: 1 = أول ما يُصرف }
        version: { type: integer }
      additionalProperties: false
    StockMovement:
      type: object
      required: [id, movementType, qtyDelta, medicineId, createdAt]
      properties:
        id: { type: string, format: uuid }
        movementType:
          type: string
          enum: [opening, purchase, sale, sale_return, adjustment, count_gain, count_loss, expiry_writeoff, damage_writeoff]
        qtyDelta: { type: number, description: موجب وارد، سالب صادر }
        medicineId: { type: string, format: uuid }
        batchId: { type: ['string', 'null'], format: uuid }
        warehouseId: { type: string, format: uuid }
        sourceType: { type: string, examples: [sales_invoice] }
        sourceId: { type: ['string', 'null'], format: uuid }
        reason: { type: ['string', 'null'] }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, readOnly: true }
      additionalProperties: false
    AdjustmentRequest:
      type: object
      required: [medicineId, qtyDelta, reason]
      properties:
        medicineId: { type: string, format: uuid }
        batchId: { type: ['string', 'null'], format: uuid }
        batchNumber: { type: string, maxLength: 60 }
        expiryDate: { type: string, format: date }
        qtyDelta: { type: number, description: لا يقبل صفرًا }
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: إلزامي دائمًا — لا تسوية بلا سبب موثق.
        attachmentId: { type: ['string', 'null'], format: uuid }
      additionalProperties: false
    StockCount:
      type: object
      required: [id, status, warehouseId, scope]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, counting, pending_approval, approved, cancelled] }
        warehouseId: { type: string, format: uuid }
        scope: { type: string, enum: [full, category, medicine_list] }
        countedItems: { type: integer }
        varianceItems: { type: integer }
        varianceValue: { type: number }
        approvedBy: { type: ['string', 'null'], format: uuid }
        approvedAt: { type: ['string', 'null'], format: date-time }
        version: { type: integer }
      additionalProperties: false

    Supplier:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: string, maxLength: 20 }
        email: { type: string, format: email }
        taxId: { type: string, maxLength: 30 }
        paymentTermsDays: { type: integer, minimum: 0, maximum: 365, default: 30 }
        version: { type: integer, readOnly: true }
      additionalProperties: false
    PurchaseOrderInput:
      type: object
      required: [supplierId, lines]
      properties:
        supplierId: { type: string, format: uuid }
        expectedAt: { type: string, format: date }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [medicineId, qty, unitCost]
            properties:
              medicineId: { type: string, format: uuid }
              qty: { type: number, exclusiveMinimum: 0 }
              unitCost: { type: number, exclusiveMinimum: 0 }
            additionalProperties: false
      additionalProperties: false
    PurchaseOrder:
      type: object
      required: [id, docNumber, status, supplierId, lines]
      properties:
        id: { type: string, format: uuid }
        docNumber: { type: string, examples: [PO-2026-000012] }
        status: { type: string, enum: [draft, submitted, partially_received, received, cancelled] }
        supplierId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        total: { type: number }
        lines:
          type: array
          items:
            type: object
