<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلامتك - الدليل العام للصيدليات</title>
    <link href="libs/cairo.css" rel="stylesheet">
    <link rel="stylesheet" href="libs/font-awesome-6.0.0.min.css">
    <!-- Supabase SDK -->
    <script src="libs/supabase.min.js"></script>
    <script src="supabase-singleton.js"></script>
    <script src="sidebar.js"></script>
    <style>
        :root {
            --primary: #6C63FF;
            --accent: #00D4AA;
            --bg-dark: #0a0a1a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Styles (matching other pages) */
        .sidebar {
            width: 260px;
            background: rgba(13, 13, 35, 0.95);
            border-left: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(20px);
            position: fixed;
            height: 100vh;
            right: 0;
            z-index: 100;
        }

        .main-content {
            margin-right: 260px;
            flex: 1;
            padding: 40px;
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Filter Section */
        .filter-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
        }

        select, input {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        /* Pharmacy Grid */
        .pharmacies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .pharmacy-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .pharmacy-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 212, 170, 0.1);
        }

        .pharmacy-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
            opacity: 0.5;
        }

        .pharmacy-name {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .pharmacy-detail {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .pharmacy-detail i {
            width: 16px;
            color: var(--accent);
        }

        .location-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 212, 170, 0.1);
            color: var(--accent);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 10px;
        }

        .loading-state {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 60px;
            color: var(--border-color);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Sidebar Placeholder -->
    <div id="sidebar-container"></div>

    <main class="main-content">
        <header class="header">
            <h1>الدليل العام للصيدليات في مصر</h1>
            <p>قاعدة بيانات شاملة لجميع الصيدليات الفردية</p>
        </header>

        <div class="filter-container">
            <div class="filter-group">
                <label>بحث بالاسم</label>
                <input type="text" id="nameSearch" placeholder="اسم الصيدلية..." oninput="debounceSearch()">
            </div>
            <div class="filter-group">
                <label>المحافظة</label>
                <select id="govFilter" onchange="handleGovChange()">
                    <option value="">كل المحافظات</option>
                </select>
            </div>
            <div class="filter-group">
                <label>المدينة</label>
                <select id="cityFilter" onchange="handleCityChange()" disabled>
                    <option value="">اختر المدينة...</option>
                </select>
            </div>
            <div class="filter-group">
                <label>الحي/المنطقة</label>
                <select id="districtFilter" onchange="performSearch()" disabled>
                    <option value="">اختر الحي...</option>
                </select>
            </div>
        </div>

        <div id="resultsInfo" style="margin-bottom: 20px; font-weight: 700; color: var(--accent);"></div>
        
        <div class="pharmacies-grid" id="pharmacyGrid">
            <div class="loading-state">جاري التحميل...</div>
        </div>
    </main>

    <script>
        let supabaseClient = null;
        let searchTimer = null;

        // Static data for Egypt structure (can be expanded)
        const EGYPT_DATA = {
            "القاهرة": {
                "القاهرة": ["المعادي", "مدينة نصر", "مصر الجديدة", "حلوان", "شبرا", "وسط البلد"],
                "القاهرة الجديدة": ["التجمع الخامس", "التجمع الأول", "الرحاب"]
            },
            "الجيزة": {
                "الجيزة": ["الدقي", "المهندسين", "الهرم", "فيصل"],
                "6 أكتوبر": ["الحي المتميز", "الشيخ زايد"]
            },
            "الإسكندرية": {
                "الإسكندرية": ["سموحة", "محرم بك", "المنتزة", "سيدي جابر"]
            }
            // Other governorates would be fetched or populated
        };

        async function init() {
            if (window.SupabaseSingleton) {
                supabaseClient = await window.SupabaseSingleton.getClient();
            }
            
            await populateGovernorates();
            await performSearch();
        }

        async function populateGovernorates() {
            const govSelect = document.getElementById('govFilter');
            // In a real scenario, we might fetch distinct governorates from DB
            const { data, error } = await supabaseClient
                .from('egypt_pharmacies_static')
                .select('governorate')
                .order('governorate');
            
            if (data) {
                const uniqueGovs = [...new Set(data.map(d => d.governorate))].filter(Boolean);
                uniqueGovs.forEach(gov => {
                    const opt = document.createElement('option');
                    opt.value = gov;
                    opt.textContent = gov;
                    govSelect.appendChild(opt);
                });
            }
        }

        async function handleGovChange() {
            const gov = document.getElementById('govFilter').value;
            const citySelect = document.getElementById('cityFilter');
            const districtSelect = document.getElementById('districtFilter');
            
            citySelect.innerHTML = '<option value="">اختر المدينة...</option>';
            districtSelect.innerHTML = '<option value="">اختر الحي...</option>';
            districtSelect.disabled = true;
            
            if (!gov) {
                citySelect.disabled = true;
                performSearch();
                return;
            }

            citySelect.disabled = false;
            
            // Fetch cities for this governorate
            const { data, error } = await supabaseClient
                .from('egypt_pharmacies_static')
                .select('city')
                .eq('governorate', gov)
                .order('city');
            
            if (data) {
                const uniqueCities = [...new Set(data.map(d => d.city))].filter(Boolean);
                uniqueCities.forEach(city => {
                    const opt = document.createElement('option');
                    opt.value = city;
                    opt.textContent = city;
                    citySelect.appendChild(opt);
                });
            }
            performSearch();
        }

        async function handleCityChange() {
            const gov = document.getElementById('govFilter').value;
            const city = document.getElementById('cityFilter').value;
            const districtSelect = document.getElementById('districtFilter');
            
            districtSelect.innerHTML = '<option value="">اختر الحي...</option>';
            
            if (!city) {
                districtSelect.disabled = true;
                performSearch();
                return;
            }

            districtSelect.disabled = false;
            
            // Fetch districts for this city
            const { data, error } = await supabaseClient
                .from('egypt_pharmacies_static')
                .select('district')
                .eq('governorate', gov)
                .eq('city', city)
                .order('district');
            
            if (data) {
                const uniqueDistricts = [...new Set(data.map(d => d.district))].filter(Boolean);
                uniqueDistricts.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = d;
                    districtSelect.appendChild(opt);
                });
            }
            performSearch();
        }

        function debounceSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(performSearch, 500);
        }

        async function performSearch() {
            const name = document.getElementById('nameSearch').value.trim();
            const gov = document.getElementById('govFilter').value;
            const city = document.getElementById('cityFilter').value;
            const district = document.getElementById('districtFilter').value;
            const grid = document.getElementById('pharmacyGrid');
            const info = document.getElementById('resultsInfo');

            grid.innerHTML = '<div class="loading-state">جاري البحث...</div>';

            let query = supabaseClient.from('egypt_pharmacies_static').select('*');

            if (name) query = query.ilike('name', `%${name}%`);
            if (gov) query = query.eq('governorate', gov);
            if (city) query = query.eq('city', city);
            if (district) query = query.eq('district', district);

            const { data, error, count } = await query.limit(100);

            if (error) {
                grid.innerHTML = `<div class="empty-state">حدث خطأ: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><br>لا توجد صيدليات مطابقة للبحث</div>';
                info.textContent = '';
                return;
            }

            info.textContent = `تم العثور على ${data.length} صيدلية`;
            
            grid.innerHTML = data.map(p => `
                <div class="pharmacy-card">
                    <div class="pharmacy-name">${p.name}</div>
                    <div class="pharmacy-detail">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>${p.address || 'العنوان غير متوفر'}</span>
                    </div>
                    <div class="pharmacy-detail">
                        <i class="fas fa-city"></i>
                        <span>${p.governorate} - ${p.city}</span>
                    </div>
                    ${p.district ? `<div class="location-badge">${p.district}</div>` : ''}
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
