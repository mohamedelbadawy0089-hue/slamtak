<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نظام إدارة المخزن</title>
  <link rel="canonical" href="./public/" />
  <!-- GitHub Pages ينشر جذر main، والتطبيق في public/ — هذه الصفحة تفتحه دون أن تكرّر محتواه. -->
  <meta http-equiv="refresh" content="0; url=./public/" />
  <script>
    // رابط نسبي: يعمل على /slamtak/ وعلى أي نطاق مخصّص، ويحفظ الاستعلام والـ hash.
    location.replace('./public/' + location.search + location.hash);
  </script>
</head>
<body>
  <p>جارٍ فتح التطبيق… <a href="./public/">اضغط هنا إن لم يبدأ تلقائيًا</a></p>
</body>
</html>
