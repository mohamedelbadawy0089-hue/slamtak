<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلامتك - واجهة الصيدلية</title>
    <link href="libs/cairo.css" rel="stylesheet">
    <script src="libs/supabase.min.js"></script>
    <script src="navigation.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6C63FF;
            --accent: #00d4aa;
            --accent-dark: #00b38f;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --dark: #0a0a1a;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: var(--dark);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Background Effects */
        .bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0, 212, 170, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(108, 99, 255, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a1a 0%, #0d0d2b 50%, #0a0a1a 100%);
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0;
            animation: orb-drift 20s ease-in-out infinite;
        }
        .orb-1 { width: 350px; height: 350px; background: rgba(0, 212, 170, 0.12); top: -80px; right: -80px; }
        .orb-2 { width: 250px; height: 250px; background: rgba(108, 99, 255, 0.08); bottom: -40px; left: -40px; animation-delay: -10s; }

        @keyframes orb-drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(25px, -35px) scale(1.1); }
            66% { transform: translate(-15px, 15px) scale(0.95); }
        }

        /* Layout */
        .app-container {
            position: relative; z-index: 1;
            max-width: 1400px; margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
            animation: fade-up 0.8s ease-out;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(20px);
            margin-bottom: 8px;
        }

        .logo-area { display: flex; align-items: center; gap: 16px; }
        .logo-icon {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 8px 24px rgba(0, 212, 170, 0.3);
        }
        .logo-text h1 { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
        .logo-text p { font-size: 13px; color: var(--text-muted); }

        /* Search & Filters */
        .toolbar {
            grid-column: 1 / 2;
            display: flex; gap: 16px;
            margin-bottom: 16px;
        }

        .search-box {
            flex: 1; position: relative;
        }
        .search-box input {
            width: 100%; padding: 14px 20px 14px 45px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 15px; outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus { border-color: var(--accent); background: rgba(0, 212, 170, 0.05); }
        .search-box::before {
            content: '🔍'; position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%); font-size: 16px; opacity: 0.6;
        }

        .warehouse-select {
            padding: 14px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 15px; outline: none;
            min-width: 200px;
            appearance: none;
            cursor: pointer;
        }
        .warehouse-select option { background: var(--dark); }

        /* Products Grid */
        .products-area { grid-column: 1 / 2; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 212, 170, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .product-icon {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; margin: 0 auto 16px;
        }
        .product-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .product-card p.price { color: var(--accent); font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .product-card p.category { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

        .btn-add {
            width: 100%; padding: 10px;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.3);
            border-radius: var(--radius-sm);
            color: var(--accent);
            font-family: 'Cairo', sans-serif;
            font-size: 14px; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-add:hover { background: var(--accent); color: white; }

        /* Cart Sidebar */
        .cart-sidebar {
            grid-column: 2 / 3;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            height: calc(100vh - 150px);
            position: sticky; top: 24px;
            display: flex; flex-direction: column;
            backdrop-filter: blur(20px);
        }

        .cart-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--glass-border);
        }
        .cart-header h2 { font-size: 18px; font-weight: 800; }
        .cart-count {
            background: var(--accent); color: white;
            padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 700;
        }

        .cart-items {
            flex: 1; overflow-y: auto;
            margin-bottom: 24px;
            padding-right: 8px;
        }
        .cart-items::-webkit-scrollbar { width: 4px; }
        .cart-items::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
        }
        .item-info h4 { font-size: 14px; margin-bottom: 4px; }
        .item-info p { font-size: 13px; color: var(--accent); font-weight: 700; }
        .item-actions { display: flex; align-items: center; gap: 8px; }
        .qty-btn {
            background: var(--glass-bg); border: none; color: white;
            width: 24px; height: 24px; border-radius: 4px; cursor: pointer;
        }
        .qty-btn:hover { background: rgba(255,255,255,0.2); }

        .cart-footer {
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }
        .cart-total {
            display: flex; justify-content: space-between;
            font-size: 18px; font-weight: 800; margin-bottom: 20px;
        }
        .btn-checkout {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none; border-radius: var(--radius-md);
            color: white; font-family: 'Cairo', sans-serif;
            font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-checkout:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 212, 170, 0.4); }

        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; }
            .cart-sidebar { grid-column: 1 / -1; height: auto; position: static; }
        }
    </style>
</head>
<body>
    <div class="bg-canvas"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-container">
        <header>
            <div class="logo-area">
                <div class="logo-icon">💊</div>
                <div class="logo-text">
                    <h1>سلامتك</h1>
                    <p>بوابة الصيدليات - طلبات الأدوية</p>
                </div>
            </div>
            <div>
                <button onclick="window.location.href='dashboard-main.html'" style="background:transparent; border:1px solid var(--glass-border); color:white; padding:8px 16px; border-radius:8px; cursor:pointer; font-family:'Cairo';">لوحة التحكم</button>
            </div>
        </header>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن دواء، صنف، أو مادة فعالة...">
            </div>
            <select class="warehouse-select" id="warehouseSelect">
                <option value="all">جميع المخازن</option>
                <!-- سيتم جلب المخازن ديناميكياً -->
            </select>
        </div>

        <div class="products-area">
            <div class="product-grid" id="productGrid">
                <!-- المنتجات -->
            </div>
        </div>

        <aside class="cart-sidebar">
            <div class="cart-header">
                <h2>سلة الطلبات</h2>
                <span class="cart-count" id="cartCount">0</span>
            </div>
            <div class="cart-items" id="cartItems">
                <div style="text-align:center; color:var(--text-muted); margin-top:40px; font-size:14px;">السلة فارغة حالياً</div>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>الإجمالي:</span>
                    <span id="cartTotal">0.00 ج.م</span>
                </div>
                <button class="btn-checkout" onclick="submitOrder()">إرسال الطلب للمخزن</button>
            </div>
        </aside>
    </div>

    <script>
        // تهيئة Supabase
        const SUPABASE_URL = 'https://iksjhjxwphmvthryfeae.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0DUy2mtXS6m5S8PwTDAANQ_XWlzbu0G';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // بيانات المخازن والمنتجات
        let warehouses = [];
        let products = [];
        let cart = [];

        // جلب المخازن من Supabase
        async function fetchWarehouses() {
            try {
                const { data, error } = await supabaseClient
                    .from('user_warehouses')
                    .select('id, warehouse_name, governorate')
                    .order('warehouse_name');
                
                if (error) throw error;
                
                warehouses = data || [];
                populateWarehouseSelect();
            } catch (error) {
                console.error('Error fetching warehouses:', error);
            }
        }

        // ملء قائمة المخازن
        function populateWarehouseSelect() {
            const select = document.getElementById('warehouseSelect');
            select.innerHTML = '<option value="all">جميع المخازن</option>';
            
            warehouses.forEach(wh => {
                const option = document.createElement('option');
                option.value = wh.id;
                option.textContent = `${wh.warehouse_name} (${wh.governorate})`;
                select.appendChild(option);
            });
        }

        // جلب المنتجات من Supabase
        async function fetchProducts(warehouseId = 'all') {
            try {
                let query = supabaseClient
                    .from('drugs')
                    .select('id, tradeName, public_price, category, warehouse_id')
                    .limit(100);
                
                if (warehouseId !== 'all') {
                    query = query.eq('warehouse_id', warehouseId);
                }
                
                const { data, error } = await query;
                
                if (error) throw error;
                
                products = data || [];
                renderProducts(products);
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        }

        function renderProducts(productsToRender) {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";
            
            if (productsToRender.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted);">لا توجد منتجات مطابقة للبحث</div>`;
                return;
            }

            productsToRender.forEach(p => {
                const warehouse = warehouses.find(w => w.id === p.warehouse_id);
                const warehouseName = warehouse ? warehouse.warehouse_name : 'غير معروف';
                
                const div = document.createElement('div');
                div.className = 'product-card';
                div.innerHTML = `
                    <div class="product-icon">💊</div>
                    <h3>${p.tradeName}</h3>
                    <p class="category">${p.category || 'غير مصنف'} | ${warehouseName}</p>
                    <p class="price">${(p.public_price || 0).toFixed(2)} ج.م</p>
                    <button class="btn-add" onclick="addToCart(${p.id})">إضافة للسلة</button>
                `;
                grid.appendChild(div);
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            const existing = cart.find(item => item.id === id);
            
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                updateCartUI();
            }
        }

        function updateCartUI() {
            const container = document.getElementById("cartItems");
            const countEl = document.getElementById("cartCount");
            const totalEl = document.getElementById("cartTotal");

            if (cart.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px; font-size:14px;">السلة فارغة حالياً</div>`;
                countEl.textContent = "0";
                totalEl.textContent = "0.00 ج.م";
                return;
            }

            container.innerHTML = "";
            let total = 0;
            let count = 0;

            cart.forEach(item => {
                total += (item.public_price || 0) * item.qty;
                count += item.qty;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="item-info">
                        <h4>${item.tradeName}</h4>
                        <p>${((item.public_price || 0) * item.qty).toFixed(2)} ج.م</p>
                    </div>
                    <div class="item-actions">
                        <button class="qty-btn" onclick="updateCartQty(${item.id}, -1)">-</button>
                        <span style="font-size:14px; font-weight:bold; width:20px; text-align:center;">${item.qty}</span>
                        <button class="qty-btn" onclick="updateCartQty(${item.id}, 1)">+</button>
                    </div>
                `;
                container.appendChild(div);
            });

            countEl.textContent = count;
            totalEl.textContent = total.toFixed(2) + " ج.م";
        }

        function submitOrder() {
            if (cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }
            
            // حفظ الطلب في Supabase
            const order = {
                pharmacy_id: localStorage.getItem('currentPharmacyId') || 'guest',
                items: cart.map(item => ({
                    drug_id: item.id,
                    tradeName: item.tradeName,
                    quantity: item.qty,
                    price: item.public_price,
                    warehouse_id: item.warehouse_id
                })),
                total: cart.reduce((sum, item) => sum + ((item.public_price || 0) * item.qty), 0),
                status: 'pending',
                created_at: new Date().toISOString()
            };

            // حفظ محلياً مؤقتاً
            let ordersStore = JSON.parse(localStorage.getItem('ORDERS_STORE') || '[]');
            ordersStore.push({
                ...order,
                id: Date.now()
            });
            localStorage.setItem('ORDERS_STORE', JSON.stringify(ordersStore));

            alert("✅ تم إرسال الطلب بنجاح للمخازن المعنية!");
            cart = [];
            updateCartUI();
        }

        // Search & Filter Logic
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = products.filter(p => 
                (p.tradeName || '').toLowerCase().includes(term) || 
                (p.category || '').toLowerCase().includes(term)
            );
            renderProducts(filtered);
        });

        // Warehouse Filter
        document.getElementById('warehouseSelect').addEventListener('change', (e) => {
            const warehouseId = e.target.value;
            fetchProducts(warehouseId);
        });

        // Init
        document.addEventListener('DOMContentLoaded', async () => {
            await fetchWarehouses();
            await fetchProducts();
        });
    </script>
</body>
</html>
