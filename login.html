<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سلامتك</title>
    <!-- Supabase JS -->
    <script src="libs/supabase.min.js"></script>
    <script src="navigation.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #ff6b6b, #dc3545);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.5);
            transition: all 0.3s;
            border: 3px solid white;
            z-index: 1000;
            outline: none;
            user-select: none;
        }
        .back-arrow:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.7);
        }
        .back-arrow:active {
            transform: scale(0.95);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #666;
            user-select: none;
        }
        .toggle-password:hover {
            color: #333;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .register-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="back-arrow" onclick="goBack()" title="رجوع">←</div>
    <div class="container">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>الإيميل أو التليفون</label>
                <input type="text" id="identifier" required>
            </div>
            
            <div class="form-group">
                <label>الباسورد</label>
                <div class="password-container">
                    <input type="password" id="password" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
                </div>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            
            <button type="submit">دخول</button>
        </form>
        
        <div class="register-link">
            ليس لديك حساب؟ <a href="#" onclick="window.location.replace('register-warehouse.html')">سجل الآن</a>
        </div>
    </div>

    <script>
        // استخدام Supabase Singleton فقط - لا إنشاء إضافي
        console.log('🔍 استخدام Supabase Singleton في login.html');
        
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.toggle-password');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🔓';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }
        
        // دالة handleLogin - تعتمد على localStorage فقط
        async function handleLogin(event) {
            event.preventDefault();
            
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            // التحقق من وجود عنصر الخطأ
            if (!errorDiv) {
                console.error('❌ عنصر errorMessage غير موجود في DOM');
                return;
            }
            
            // إخفاء رسائل الخطأ السابقة
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            
            // التحقق إذا كان الإيميل (لـ Supabase)
            if (identifier.includes('@')) {
                console.log('📧 استخدام Supabase Auth للإيميل...');
                const result = await signInWithSupabase(identifier, password);
                
                if (!result.success) {
                    errorDiv.textContent = result.error;
                    errorDiv.style.display = 'block';
                }
                // handlePostLogin سيقوم بالتحويل تلقائياً
                
                return;
            }
            
            // استخدام localStorage مباشرة (بدون IndexedDB)
            console.log('📱 استخدام localStorage...');
            loginFromLocalStorage(identifier, password, errorDiv);
        }
        
        // دالة تسجيل الدخول من localStorage (بدون IndexedDB)
        function loginFromLocalStorage(identifier, password, errorDiv) {
            const users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
            
            const user = users.find(u => u.email === identifier || u.phone === identifier);
            
            if (!user) {
                errorDiv.textContent = 'الإيميل أو التليفون غير مسجل';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (user.password !== password) {
                errorDiv.textContent = 'الباسورد غير صحيح';
                errorDiv.style.display = 'block';
                return;
            }
            
            // نجاح تسجيل الدخول - حفظ في localStorage
            console.log('✅ تسجيل الدخول ناجح (localStorage):', user.email);
            
            // حفظ في المفاتيح الصحيحة لاستخدامها في جميع الصفحات
            const userId = user.id || 'local_' + Date.now();
            localStorage.setItem('slamtak-user-email', user.email);
            localStorage.setItem('slamtak-user-id', userId);
            localStorage.setItem('slamtak-auth-status', 'authenticated');
            // حفظ current_warehouse_id للاستخدام في وضع offline
            localStorage.setItem('current_warehouse_id', userId);
            localStorage.setItem('slamtak-warehouse-id', userId);

            console.log('✅ تم حفظ بيانات المستخدم في localStorage (loginFromLocalStorage)');
            console.log('🏭 current_warehouse_id set:', userId.substring(0, 8) + '...');

            // التحقق من الحفظ
            const savedEmail = localStorage.getItem('slamtak-user-email');
            const savedId = localStorage.getItem('slamtak-user-id');
            const savedAuthStatus = localStorage.getItem('slamtak-auth-status');
            const savedWarehouseId = localStorage.getItem('current_warehouse_id');

            console.log('✅ التحقق من الحفظ (loginFromLocalStorage):');
            console.log('  📧 Email:', savedEmail);
            console.log('  🆔 ID:', savedId);
            console.log('  🔐 Auth Status:', savedAuthStatus);
            console.log('  🏭 Warehouse ID:', savedWarehouseId ? savedWarehouseId.substring(0, 8) + '...' : 'null');

            // Debug alert
            alert('✅ تم التسجيل بنجاح!\nEmail: ' + savedEmail + '\nID: ' + savedId + '\nWarehouse: ' + (savedWarehouseId ? savedWarehouseId.substring(0, 8) + '...' : 'null'));

            // توجيه مباشر لصفحة إضافة المنتج
            window.location.replace('add-product.html');
        }
        
        function goBack() {
            window.location.replace('warehouse.html');
        }
    </script>
    
    <!-- Supabase SDK -->
    <script src="libs/supabase.min.js"></script>
    <!-- Supabase Singleton Module -->
    <script src="supabase-singleton.js"></script>
    <script>
        // التحقق من الجلسة الحالية عند تحميل الصفحة (مع منع Infinite Loop)
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('🔍 التحقق من الجلسة الحالية في login.html...');
                
                // استخدام Supabase Singleton للتحقق
                const session = await SupabaseSingleton.SessionManager.checkSession();
                
                if (session && session.user) {
                    console.log('✅ المستخدم مسجل الدخول بالفعل:', session.user.email);
                    
                    // التحقق من وجود مخازن
                    const client = SupabaseSingleton.getClient();
                    if (client) {
                        const { data: warehouses, error: warehouseError } = await client
                            .from('warehouses')
                            .select('*')
                            .eq('user_id', session.user.id)
                            .order('created_at', { ascending: false });
                        
                        if (!warehouseError && warehouses && warehouses.length > 0) {
                            // تعيين المخزن النشط
                            const activeWarehouse = warehouses[0];
                            SupabaseSingleton.WarehouseManager.setActiveWarehouse(activeWarehouse.id);
                            console.log('🏭 تم تعيين المخزن النشط:', activeWarehouse.name);
                            
                            // توجيه مباشر لصفحة المنتجات (Dashboard)
                            console.log('🔄 توجيه تلقائي لـ add-product.html...');
                            window.location.replace('add-product.html');
                            return;
                        }
                    }
                }
                
                console.log('ℹ️ لا توجد جلسة نشطة، عرض صفحة تسجيل الدخول...');
                
            } catch (error) {
                console.error('❌ خطأ في التحقق من الجلسة:', error);
                // عرض رسالة خطأ واضحة بدلاً من الصفحة البيضاء
                document.body.innerHTML = `
                    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
                        <h2 style="color: #dc3545;">❌ خطأ في تحميل الصفحة</h2>
                        <p style="color: #6c757d;">حدث خطأ أثناء التحقق من الجلسة. يرجى المحاولة مرة أخرى.</p>
                        <button onclick="window.location.reload()" style="background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                            إعادة المحاولة
                        </button>
                        <br><br>
                        <a href="login.html" style="color: #007bff;">العودة لصفحة تسجيل الدخول</a>
                    </div>
                `;
            }
        });
        
        // دالة تسجيل الدخول باستخدام Supabase و localStorage
        async function signInWithSupabase(email, password) {
            try {
                // التحقق من وجود Supabase Client
                const client = SupabaseSingleton.getClient();
                if (!client) {
                    return { success: false, error: '❌ خطأ في الإعدادات: Supabase Client غير موجود' };
                }
                
                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    console.error('❌ خطأ في تسجيل الدخول:', error);
                    
                    // رسائل خطأ واضحة حسب نوع الخطأ
                    if (error.message.includes('Invalid credentials') || error.message.includes('invalid')) {
                        return { success: false, error: '❌ خطأ: الإيميل أو الباسورد غير صحيح' };
                    } else if (error.message.includes('Email not confirmed') || error.message.includes('confirm')) {
                        return { success: false, error: '❌ خطأ: يجب تفعيل الإيميل أولاً' };
                    } else if (error.message.includes('rate limit')) {
                        return { success: false, error: '❌ خطأ: عدد محاولات كبير جداً، انتظر قليلاً' };
                    } else if (error.message.includes('fetch') || error.message.includes('network') || error.message.includes('Failed to fetch')) {
                        return { success: false, error: '❌ خطأ في الاتصال: تحقق من الإنترنت أو Supabase Key' };
                    } else {
                        return { success: false, error: '❌ خطأ: ' + error.message };
                    }
                }
                
                if (data.user && data.session) {
                    console.log('✅ تم تسجيل الدخول بنجاح:', data.user.email);
                    
                    // حفظ بيانات المستخدم في localStorage كمرجع نهائي
                    localStorage.setItem('slamtak-user-email', data.user.email);
                    localStorage.setItem('slamtak-user-id', data.user.id);
                    localStorage.setItem('slamtak-auth-status', 'authenticated');
                    // حفظ current_warehouse_id للاستخدام في وضع offline
                    localStorage.setItem('current_warehouse_id', data.user.id);
                    localStorage.setItem('slamtak-warehouse-id', data.user.id);

                    console.log('✅ تم حفظ بيانات المستخدم في localStorage');
                    console.log('🏭 current_warehouse_id set:', data.user.id.substring(0, 8) + '...');
                    
                    // انتظار للتأكد من حفظ البيانات
                    await new Promise(r => setTimeout(r, 200));
                    
                    // التحقق من الحفظ
                    const savedEmail = localStorage.getItem('slamtak-user-email');
                    const savedId = localStorage.getItem('slamtak-user-id');
                    const savedAuthStatus = localStorage.getItem('slamtak-auth-status');
                    
                    console.log('✅ التحقق من الحفظ:');
                    console.log('  📧 Email:', savedEmail);
                    console.log('  🆔 ID:', savedId);
                    console.log('  🔐 Auth Status:', savedAuthStatus);
                    
                    // Debug alert
                    alert('✅ تم الحفظ:\nEmail: ' + savedEmail + '\nID: ' + savedId);
                    
                    if (!savedEmail || !savedId) {
                        console.error('❌ البيانات لم تُحفظ بشكل صحيح!');
                        alert('❌ خطأ: البيانات لم تُحفظ في localStorage');
                        return { success: false, error: '❌ خطأ: البيانات لم تُحفظ' };
                    }
                    
                    // جلب المخازن والتحقق منها
                    await handlePostLogin(data.user.id);
                    
                    return { success: true, user: data.user };
                }
                
                return { success: false, error: '❌ خطأ: فشل تسجيل الدخول' };
                
            } catch (error) {
                console.error('❌ خطأ غير متوقع:', error);
                
                if (error.message.includes('Failed to fetch') || error.message.includes('fetch')) {
                    return { success: false, error: '❌ Network Error: لا يمكن الاتصال بـ Supabase' };
                } else if (error.message.includes('TypeError') || error.message.includes('null')) {
                    return { success: false, error: '❌ خطأ في الإعدادات: بيانات Supabase غير صحيحة' };
                } else {
                    return { success: false, error: '❌ خطأ: ' + (error.message || 'حدث خطأ غير معروف') };
                }
            }
        }
        
        // دالة ما بعد تسجيل الدخول - التحقق من المخازن
        async function handlePostLogin(userId) {
            try {
                // جلب مخازن المستخدم
                const client = SupabaseSingleton.getClient();
                if (!client) {
                    console.error('❌ خطأ: Supabase Client غير موجود');
                    window.location.replace('add-product.html');
                    return;
                }
                
                const { data: warehouses, error } = await client
                    .from('warehouses')
                    .select('*')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false });
                
                if (error) {
                    console.error('❌ خطأ في جلب المخازن:', error);
                    // في حالة الخطأ، توجيه مباشر
                    window.location.replace('add-product.html');
                    return;
                }
                
                if (!warehouses || warehouses.length === 0) {
                    console.warn('⚠️ لا توجد مخازن للمستخدم');
                    // توجيه لتسجيل مخزن جديد
                    alert('يرجى إنشاء مخزن جديد');
                    window.location.replace('register-warehouse.html');
                    return;
                }
                
                // حفظ المخازن في localStorage
                localStorage.setItem('userWarehouses', JSON.stringify(warehouses));
                
                if (warehouses.length === 1) {
                    // مخزن واحد فقط - تعيينه كنشط
                    const warehouse = warehouses[0];
                    localStorage.setItem('activeWarehouseId', warehouse.id);
                    console.log('🏭 تم تعيين المخزن النشط:', warehouse.name);
                    window.location.replace('add-product.html');
                } else {
                    // مخازن متعددة - تعيين الأول كنشط مباشرة
                    const firstWarehouse = warehouses[0];
                    localStorage.setItem('activeWarehouseId', firstWarehouse.id);
                    console.log('🏭 تم تعيين أول مخزن كنشط:', firstWarehouse.name);
                    window.location.replace('add-product.html');
                }
                
            } catch (error) {
                console.error('❌ خطأ في handlePostLogin:', error);
                window.location.replace('add-product.html');
            }
        }
        
        // إظهار واجهة اختيار المخزن - معطلة
        function showWarehouseSelector(warehouses) {
            // تم حذف هذه الميزة
        }
        
        // اختيار مخزن - معطل
        function selectWarehouse(warehouseId) {
            // تم حذف هذه الميزة
        }
        
        // إغلاق واجهة الاختيار - معطل
        function closeWarehouseSelector() {
            // تم حذف هذه الميزة
        }
        
        
        // دالة تسجيل الدخول من localStorage (بدون IndexedDB)
        function loginFromLocalStorage(identifier, password, errorDiv) {
            const users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
            
            const user = users.find(u => u.email === identifier || u.phone === identifier);
            
            if (!user) {
                errorDiv.textContent = 'الإيميل أو التليفون غير مسجل';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (user.password !== password) {
                errorDiv.textContent = 'الباسورد غير صحيح';
                errorDiv.style.display = 'block';
                return;
            }
            
            // نجاح تسجيل الدخول - حفظ في localStorage
            console.log('✅ تسجيل الدخول ناجح (localStorage):', user.email);
            
            // حفظ في المفاتيح الصحيحة لاستخدامها في جميع الصفحات
            const userId = user.id || 'local_' + Date.now();
            localStorage.setItem('slamtak-user-email', user.email);
            localStorage.setItem('slamtak-user-id', userId);
            localStorage.setItem('slamtak-auth-status', 'authenticated');
            // حفظ current_warehouse_id للاستخدام في وضع offline
            localStorage.setItem('current_warehouse_id', userId);
            localStorage.setItem('slamtak-warehouse-id', userId);

            console.log('✅ تم حفظ بيانات المستخدم في localStorage (loginFromLocalStorage)');
            console.log('🏭 current_warehouse_id set:', userId.substring(0, 8) + '...');

            // التحقق من الحفظ
            const savedEmail = localStorage.getItem('slamtak-user-email');
            const savedId = localStorage.getItem('slamtak-user-id');
            const savedAuthStatus = localStorage.getItem('slamtak-auth-status');
            const savedWarehouseId = localStorage.getItem('current_warehouse_id');

            console.log('✅ التحقق من الحفظ (loginFromLocalStorage):');
            console.log('  📧 Email:', savedEmail);
            console.log('  🆔 ID:', savedId);
            console.log('  🔐 Auth Status:', savedAuthStatus);
            console.log('  🏭 Warehouse ID:', savedWarehouseId ? savedWarehouseId.substring(0, 8) + '...' : 'null');

            // حفظ أيضاً في currentUser للتوافق مع الكود القديم
            localStorage.setItem('currentUser', JSON.stringify({
                id: userId,
                email: user.email,
                phone: user.phone,
                warehouseId: user.warehouseId || userId
            }));

            localStorage.setItem('localAuth', 'true');
            
            window.location.replace('add-product.html');
        }
        
        // تعديل مستحدث النموذج لاستخدام الدالة الجديدة
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.removeEventListener('submit', handleLogin); // إزالة المستمع القديم
                loginForm.addEventListener('submit', handleLogin); // إضافة المستمع الجديد
            }
        });
        
        // دالة تسجيل الخروج
        async function signOut() {
            try {
                // مسح الجلسة من localStorage
                localStorage.removeItem('currentUser');
                console.log('🗑️ تم مسح بيانات التطبيق');
                
                const client = SupabaseSingleton.getClient();
                if (client) {
                    const { error } = await client.auth.signOut();
                    if (error) {
                        console.error('❌ خطأ في تسجيل الخروج:', error);
                    } else {
                        console.log('✅ تم تسجيل الخروج بنجاح');
                    }
                }
                
                // مسح بيانات localStorage
                localStorage.removeItem('slamtak-user-email');
                localStorage.removeItem('slamtak-user-id');
                localStorage.removeItem('slamtak-auth-status');
                
                window.location.replace('login.html');
            } catch (error) {
                console.error('❌ خطأ في تسجيل الخروج:', error);
                
                // مسح بيانات localStorage حتى في حالة الخطأ
                localStorage.removeItem('slamtak-user-email');
                localStorage.removeItem('slamtak-user-id');
                localStorage.removeItem('slamtak-auth-status');
                
                window.location.replace('login.html');
            }
        }
        
        // جعل دالة signOut متاحة عالمياً
        window.signOut = signOut;
    </script>
