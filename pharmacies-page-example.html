<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الصيدليات - سلامتك</title>
    
    <!-- Supabase SDK -->
    <script src="libs/supabase.min.js"></script>
    
    <!-- Your Supabase Config -->
    <script src="supabase-singleton.js"></script>
    
    <!-- Pharmacies Integration -->
    <script src="pharmacies-integration.js"></script>
    
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --card-bg: #ffffff;
            --glass-border: rgba(255,255,255,0.2);
            --text-muted: #6b7280;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: auto;
            margin-left: auto;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .pharmacies-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            min-height: 400px;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        
        /* Styles are imported from pharmacies-integration.js */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 إدارة الصيدليات</h1>
            <p>إضافة وإدارة صيدليات العملاء</p>
        </div>
        
        <button class="btn-add" onclick="pharmaciesManager.showPharmacyForm()">
            <span>➕</span>
            <span>إضافة صيدلية جديدة</span>
        </button>
        
        <div class="pharmacies-container">
            <div class="search-box">
                <input type="text" 
                       id="searchInput" 
                       placeholder="🔍 البحث باسم الصيدلية أو رقم التليفون..."
                       oninput="handleSearch(this.value)">
            </div>
            
            <div id="pharmaciesList">
                <!-- Pharmacies will be loaded here -->
                <div class="empty-state">
                    <div class="empty-icon">🏥</div>
                    <div class="empty-text">جاري تحميل الصيدليات...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Pharmacies Manager
        let pharmaciesManager;
        
        document.addEventListener('DOMContentLoaded', async () => {
            // Get Supabase client
            const supabaseClient = window.SupabaseSingleton?.getClient() || 
                                   window.supabase?.createClient(
                                       'https://iksjhjxwphmvthryfeae.supabase.co',
                                       'sb_publishable_0DUy2mtXS6m5S8PwTDAANQ_XWlzbu0G'
                                   );
            
            if (!supabaseClient) {
                console.error('❌ Supabase client not available');
                document.getElementById('pharmaciesList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <div class="empty-text">فشل الاتصال بقاعدة البيانات</div>
                        <p>يرجى التحقق من اتصال الإنترنت</p>
                    </div>
                `;
                return;
            }
            
            // Create manager instance
            pharmaciesManager = new PharmaciesManager(supabaseClient);
            
            // Load pharmacies
            await pharmaciesManager.loadPharmacies();
            
            // Subscribe to real-time updates
            pharmaciesManager.subscribeToRealtime();
            
            console.log('✅ Pharmacies manager initialized');
        });
        
        // Search handler
        let searchTimeout;
        async function handleSearch(query) {
            clearTimeout(searchTimeout);
            
            if (!query.trim()) {
                pharmaciesManager.renderPharmaciesList();
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                const result = await pharmaciesManager.searchPharmacies(query);
                if (result.success) {
                    pharmaciesManager.pharmacies = result.data;
                    pharmaciesManager.renderPharmaciesList();
                }
            }, 300);
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (pharmaciesManager) {
                pharmaciesManager.unsubscribe();
            }
        });
    </script>
</body>
</html>
