<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الصيدليات</title>
    <script src="libs/supabase.min.js"></script>
    <script src="libs/xlsx.full.min.js"></script>
    <script src="navigation.js"></script>
    <script src="supabase-singleton.js"></script>
    <script src="sidebar.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .back-arrow {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #ff6b6b, #dc3545);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.5);
            transition: all 0.3s;
            border: 3px solid white;
            z-index: 1000;
            outline: none;
            user-select: none;
        }
        .back-arrow:hover {
            background: linear-gradient(135deg, #dc3545, #c82333);
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.7);
        }
        .back-arrow:active {
            transform: scale(0.95);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 150px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 14px;
        }
        .add-section {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 2px solid #667eea;
        }
        .add-title {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .keyboard-hint {
            font-size: 12px;
            color: #999;
            font-weight: normal;
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .table-hint {
            text-align: center;
            padding: 10px;
            background: #f8f9ff;
            border-radius: 5px;
            margin-bottom: 10px;
            color: #666;
            font-size: 13px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
            font-size: 14px;
        }
        .required {
            color: #dc3545;
        }
        input, textarea {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .gps-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-add:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .add-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .bulk-upload {
            margin-top: 20px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }
        .upload-area:hover {
            background: #f0f4ff;
            border-color: #5a67d8;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .upload-text {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        .upload-subtext {
            color: #999;
            font-size: 14px;
        }
        .mapping-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .mapping-item label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .mapping-item select {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .preview-section {
            margin: 20px 0;
        }
        .preview-section h4 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .preview-table {
            overflow-x: auto;
            max-height: 300px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .preview-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .preview-table th {
            background: #f8f9fa;
            padding: 8px;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }
        .preview-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
        }
        .bulk-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-cancel {
            background: #6c757d;
            color: white;
        }
        .btn-cancel:hover {
            background: #5a6268;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%; padding: 14px 20px; border: 3px solid #4facfe; border-radius: 8px;
            font-size: 16px; box-sizing: border-box; font-family: Arial, sans-serif;
            transition: all 0.3s; background: white;
        }
        .search-box input:focus {
            outline: none;
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(79,172,254,0.5);
            transform: translateY(-2px);
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 12px;
            text-align: right;
            font-weight: bold;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: right;
        }
        .phone-link {
            color: #28a745;
            font-weight: bold;
            text-decoration: none;
            transition: color 0.3s;
        }
        .phone-link:hover {
            color: #218838;
            text-decoration: underline;
        }
        tr:hover {
            background: #f0f9ff;
            cursor: pointer;
        }
        tr:focus {
            background: #e0f2ff;
            outline: 2px solid #4facfe;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }
        .btn-delete:hover {
            background: #c82333;
        }
        .btn-order {
            background: #28a745;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
            margin-left: 5px;
        }
        .btn-order:hover {
            background: #218838;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .empty-text {
            font-size: 18px;
        }
        /* Gemini Voice UI Integration */
        .search-box { position: relative; }
        .search-box input { padding-right: 60px !important; }
        
        .gemini-mic-container {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .gemini-mic-btn {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(79, 172, 254, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-right: 5px;
        }

        .gemini-mic-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(79, 172, 254, 0.6);
        }

        .gemini-mic-btn.listening {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: gemini-breath 1.5s infinite;
        }

        .gemini-waves-container {
            position: absolute;
            right: 55px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            align-items: center;
            gap: 3px;
            height: 20px;
        }

        .gemini-mic-btn.listening + .gemini-waves-container {
            display: flex;
        }

        .gemini-wave {
            width: 3px;
            height: 8px;
            background: #00f2fe;
            border-radius: 3px;
            animation: gemini-wave-anim 1s ease-in-out infinite;
        }

        .gemini-wave:nth-child(2) { animation-delay: 0.1s; }
        .gemini-wave:nth-child(3) { animation-delay: 0.2s; }
        .gemini-wave:nth-child(4) { animation-delay: 0.3s; }
        .gemini-wave:nth-child(5) { animation-delay: 0.4s; }

        @keyframes gemini-breath {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); box-shadow: 0 0 20px rgba(240, 147, 251, 0.8); }
        }

        @keyframes gemini-wave-anim {
            0%, 100% { height: 6px; opacity: 0.5; }
            50% { height: 18px; opacity: 1; }
        }

        #speechBubble {
            position: absolute;
            bottom: 65px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            white-space: nowrap;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }

        #speechBubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 20px;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(0, 0, 0, 0.85);
        }
        .main-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .main-tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: #f0f2f5;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            color: #666;
            transition: all 0.3s;
        }
        .main-tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .main-tab-content {
            display: none;
        }
        .main-tab-content.active {
            display: block;
        }
        .btn-add-global {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 5px;
            transition: background 0.3s;
        }
        .btn-add-global:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="back-arrow" onclick="goBack()" title="رجوع">←</div>
    
    <div class="container">
        <h2>🏥 إدارة الصيدليات</h2>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="pharmacyCount">0</div>
                <div class="stat-label">صيدليات المخزن الحالية</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <div class="stat-number" id="globalPharmacyCount">80k+</div>
                <div class="stat-label">متاحة في الدليل العام</div>
            </div>
        </div>
        
        <div class="add-section">
            <div class="add-title">
                <span>➕ إضافة صيدلية جديدة</span>
                <span class="keyboard-hint">💡 Ctrl+F للبحث السريع</span>
            </div>
            <div class="add-tabs">
                <button type="button" class="tab-btn active" onclick="switchTab('single')">إضافة واحدة</button>
                <button type="button" class="tab-btn" onclick="switchTab('bulk')">إدخال جماعي</button>
            </div>
            
            <div id="singleTab" class="tab-content active">
                <form onsubmit="handleSubmit(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>اسم الصيدلية <span class="required">*</span></label>
                            <input type="text" id="pharmacyName" oninput="checkFormValidity()" required>
                        </div>
                        <div class="form-group">
                            <label>رقم التليفون <span class="required">*</span></label>
                            <input type="tel" id="pharmacyPhone" placeholder="11 رقم" maxlength="11" oninput="validatePhone()" required>
                            <div class="error-message" id="phoneError">يجب إدخال 11 رقم</div>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>العنوان <span class="required">*</span></label>
                            <textarea id="pharmacyAddress" oninput="checkFormValidity()" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>موقع GPS (اختياري)</label>
                            <div class="gps-group">
                                <input type="text" id="gpsLat" placeholder="خط العرض">
                                <input type="text" id="gpsLng" placeholder="خط الطول">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-add" id="submitBtn" disabled>إضافة الصيدلية</button>
                </form>
            </div>
            
            <div id="bulkTab" class="tab-content">
                <div class="bulk-upload">
                    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon">📁</div>
                        <div class="upload-text">اضغط لاختيار ملف Excel أو CSV</div>
                        <div class="upload-subtext">يدعم ملفات .xlsx, .xls, .csv</div>
                    </div>
                    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display: none;" onchange="handleFileUpload(event)">
                    
                    <div id="mappingSection" style="display: none;">
                        <h4>تحديد الأعمدة</h4>
                        <div class="mapping-grid">
                            <div class="mapping-item">
                                <label>عمود اسم الصيدلية <span class="required">*</span></label>
                                <select id="nameColumn"></select>
                            </div>
                            <div class="mapping-item">
                                <label>عمود رقم التليفون <span class="required">*</span></label>
                                <select id="phoneColumn"></select>
                            </div>
                            <div class="mapping-item">
                                <label>عمود العنوان <span class="required">*</span></label>
                                <select id="addressColumn"></select>
                            </div>
                            <div class="mapping-item">
                                <label>عمود خط العرض (اختياري)</label>
                                <select id="latColumn"><option value="">-- اختياري --</option></select>
                            </div>
                            <div class="mapping-item">
                                <label>عمود خط الطول (اختياري)</label>
                                <select id="lngColumn"><option value="">-- اختياري --</option></select>
                            </div>
                        </div>
                        
                        <div class="preview-section">
                            <h4>معاينة البيانات (أول 5 صفوف)</h4>
                            <div id="previewTable"></div>
                        </div>
                        
                </div>
            </div>
            
        </div>
        
        <div id="myPharmaciesContent">
            <h3 style="margin-top: 20px; color: #764ba2;">📋 الصيدليات المدخلة (خاصة بالمخزن)</h3>
            <div class="search-box">
    </div>

    <script>
        let currentUser = null;
        let currentWarehouseId = null;
        let allPharmacies = [];
        let bulkData = [];
        let fileHeaders = [];

        async function initAuth() {
            // ✅ تصفير الـ LocalStorage من أي بيانات قديمة فوراً
            localStorage.removeItem('pharmacies');
            localStorage.removeItem('products');
            localStorage.removeItem('offline_pharmacies');
            localStorage.removeItem('SalamtakDB_products');
            
            if (window.SupabaseSingleton) {
                const session = await window.SupabaseSingleton.SessionManager.checkSession();
                if (session) {
                    currentUser = session.user;
                    currentWarehouseId = session.user.user_metadata?.warehouse_id || sessionStorage.getItem('current_warehouse_id');
                } else {
                    window.location.replace('login.html');
                }
            }
        }
        
        async function getSupabase() {
            if (window.supabaseClient) return window.supabaseClient;
            if (window.SupabaseSingleton) {
                const client = await window.SupabaseSingleton.getClient();
                if (client) return client;
            }
            if (window.supabase) return window.supabase;
            return null;
        }

        async function initPage() {
            console.log('🚀 تهيئة الصفحة والربط بـ Supabase...');
            await initAuth();
            await loadPharmacies();
            await fetchGlobalCount();
            await initGlobalSearch(); // تهيئة الدليل العام فوراً لأنه أصبح مرئياً
            
            // تحديث العداد كل 30 ثانية ليعكس تقدم عملية السحب
            setInterval(fetchGlobalCount, 30000);
        }

        async function fetchGlobalCount() {
            try {
                const supabase = await getSupabase();
                if (!supabase) return;
                
                // جلب العدد الإجمالي من الدليل العام
                const { count, error } = await supabase
                    .from('egypt_pharmacies_static')
                    .select('*', { count: 'exact', head: true });
                
                if (error) throw error;
                if (count) {
                    document.getElementById('globalPharmacyCount').textContent = count.toLocaleString('ar-EG');
                }
            } catch (err) {
                console.warn('Could not fetch global count:', err);
            }
        }
        
        function validatePhone() {
            const phone = document.getElementById('pharmacyPhone').value;
            const phoneError = document.getElementById('phoneError');
            
            if (phone && phone.length !== 11) {
                phoneError.style.display = 'block';
            } else {
                phoneError.style.display = 'none';
            }
            
            checkFormValidity();
        }
        
        function checkFormValidity() {
            const name = document.getElementById('pharmacyName').value.trim();
            const phone = document.getElementById('pharmacyPhone').value;
            const address = document.getElementById('pharmacyAddress').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            
            if (name && phone.length === 11 && address) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }
        
        async function handleSubmit(event) {
            event.preventDefault();
            
            const name = document.getElementById('pharmacyName').value.trim();
            const phone = document.getElementById('pharmacyPhone').value.trim();
            const address = document.getElementById('pharmacyAddress').value.trim();
            const gpsLat = document.getElementById('gpsLat').value.trim();
            const gpsLng = document.getElementById('gpsLng').value.trim();
            
            if (!name || phone.length !== 11 || !address) {
                alert('يرجى إدخال جميع البيانات بشكل صحيح');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ جاري الحفظ...';
            
            try {
                const supabase = await getSupabase();
                if (!supabase) throw new Error('الاتصال بالسيرفر غير متوفر');

                const { data, error } = await supabase.from('warehouse_pharmacies').insert([{
                    name: name,
                    phone: phone,
                    address: address,
                    warehouse_id: currentWarehouseId,
                    user_id: currentUser.email,
                    gps_location: (gpsLat && gpsLng) ? { lat: parseFloat(gpsLat), lng: parseFloat(gpsLng) } : null
                }]).select();

                if (error) throw error;

                alert('✅ تم إضافة الصيدلية بنجاح');
                resetForm();
                await loadPharmacies();
            } catch (error) {
                console.error('Submit error:', error);
                alert('❌ خطأ في الحفظ: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        }
        
        function resetForm() {
            document.getElementById('pharmacyName').value = '';
            document.getElementById('pharmacyPhone').value = '';
            document.getElementById('pharmacyAddress').value = '';
            document.getElementById('gpsLat').value = '';
            document.getElementById('gpsLng').value = '';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('phoneError').style.display = 'none';
        }
        
        async function loadPharmacies() {
            console.log('📦 جلب الصيدليات من السيرفر...');
            const table = document.getElementById('pharmaciesTable');
            const emptyState = document.getElementById('emptyState');
            
            try {
                const supabase = await getSupabase();
                if (!supabase) return;

                const { data, error } = await supabase
                    .from('warehouse_pharmacies')
                    .select('*')
                    .eq('warehouse_id', currentWarehouseId)
                    .order('id', { ascending: false });

                if (error) throw error;

                allPharmacies = data || [];
                displayPharmacies(allPharmacies);
            } catch (error) {
                console.error('Load error:', error);
                displayPharmacies([]);
            }
        }
        
        function displayPharmacies(pharmacies) {
            document.getElementById('pharmacyCount').textContent = pharmacies.length;
            const table = document.getElementById('pharmaciesTable');
            const emptyState = document.getElementById('emptyState');
            
            if (pharmacies.length === 0) {
                table.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            table.style.display = 'table';
            emptyState.style.display = 'none';
            
            const tbody = document.getElementById('pharmaciesBody');
            tbody.innerHTML = '';
            
            pharmacies.forEach((p, index) => {
                const date = new Date(p.created_at || p.createdAt).toLocaleDateString('ar-EG');
                
                let gpsLink = '-';
                const gps = p.gps_location || p.pharmacyGPS;
                if (gps && gps.lat && gps.lng) {
                    const gpsUrl = `https://www.google.com/maps?q=${gps.lat},${gps.lng}`;
                    gpsLink = `<a href="${gpsUrl}" target="_blank" style="color: #667eea; font-weight: bold;">📍 عرض</a>`;
                }
                
                const pName = p.name || p.pharmacyName;
                const pPhone = p.phone || p.pharmacyPhone;
                const pAddress = p.address || p.pharmacyAddress;

                const row = `
                    <tr data-pharmacy-id="${p.id}" class="pharmacy-row" tabindex="0">
                        <td>${index + 1}</td>
                        <td><strong><a href="#" onclick="viewPharmacyProfile('${p.id}')" style="color: #667eea; text-decoration: none; font-weight: bold;">${pName}</a></strong></td>
                        <td><a href="tel:${pPhone}" style="color: #28a745; font-weight: bold; text-decoration: none;">📞 ${pPhone}</a></td>
                        <td>${pAddress}</td>
                        <td>${gpsLink}</td>
                        <td>${date}</td>
                        <td>
                            <button class="btn-order" onclick="createOrderForPharmacy('${p.id}')">📋 أوردر</button>
                            <button class="btn-delete" onclick="deletePharmacy('${p.id}')">حذف</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
            
            document.querySelectorAll('.pharmacy-row').forEach(function(row) {
                row.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        var pharmacyId = this.getAttribute('data-pharmacy-id');
                        createOrderForPharmacy(pharmacyId);
                    }
                });
            });
        }
        
        async function filterPharmacies() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) {
                await loadPharmacies();
                return;
            }

            console.log('🔍 بحث مباشر في صيدلياتك على السيرفر...');
            try {
                const supabase = await getSupabase();
                if (!supabase) return;

                const { data, error } = await supabase
                    .from('warehouse_pharmacies')
                    .select('*')
                    .eq('warehouse_id', currentWarehouseId)
                    .or(`name.ilike.%${searchTerm}%,phone.ilike.%${searchTerm}%,address.ilike.%${searchTerm}%`)
                    .order('name', { ascending: true });

                if (error) throw error;
                displayPharmacies(data || []);
            } catch (error) {
                console.error('Search error:', error);
            }
        }
        
        window.addEventListener('load', function() {
            var searchInput = document.getElementById('searchInput');
            searchInput.focus();

            var urlParams = new URLSearchParams(window.location.search);
            var searchQuery = urlParams.get('search');
            
            if (searchQuery) {
                searchInput.value = searchQuery;
                var event = new Event('input', { bubbles: true });
                searchInput.dispatchEvent(event);
            }
            
            initPage();
        });
        
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
                document.getElementById('searchInput').select();
            }
            
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                var rows = document.querySelectorAll('.pharmacy-row');
                if (rows.length === 0) return;
                
                var focused = document.activeElement;
                var currentIndex = Array.from(rows).indexOf(focused);
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (currentIndex < rows.length - 1) {
                        rows[currentIndex + 1].focus();
                    } else if (currentIndex === -1) {
                        rows[0].focus();
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (currentIndex > 0) {
                        rows[currentIndex - 1].focus();
                    }
                }
            }
        });
        
        function createOrderForPharmacy(pharmacyId) {
            const pharmacy = allPharmacies.find(p => p.id == pharmacyId);
            if (!pharmacy) {
                alert('لم يتم العثور على الصيدلية');
                return;
            }
            
            const pData = {
                id: pharmacy.id,
                pharmacyName: pharmacy.name || pharmacy.pharmacyName,
                pharmacyPhone: pharmacy.phone || pharmacy.pharmacyPhone,
                pharmacyAddress: pharmacy.address || pharmacy.pharmacyAddress,
                pharmacyGPS: pharmacy.gps_location || pharmacy.pharmacyGPS
            };

            sessionStorage.setItem('selectedPharmacy', JSON.stringify(pData));
            window.location.href = 'create-order.html';
        }
        
        async function deletePharmacy(pharmacyId) {
            if (!confirm('هل أنت متأكد من حذف هذه الصيدلية من السيرفر؟')) return;
            
            try {
                const supabase = await getSupabase();
                if (!supabase) throw new Error('الاتصال بالسيرفر غير متوفر');

                const { error } = await supabase
                    .from('warehouse_pharmacies')
                    .delete()
                    .eq('id', pharmacyId)
                    .eq('warehouse_id', currentWarehouseId);

                if (error) throw error;
                
                alert('✅ تم الحذف بنجاح');
                await loadPharmacies();
            } catch (error) {
                console.error('Delete error:', error);
                alert('❌ فشل الحذف: ' + error.message);
            }
        }
        
        function viewPharmacyProfile(pharmacyId) {
            const pharmacy = allPharmacies.find(p => p.id == pharmacyId);
            if (!pharmacy) return;
            
            sessionStorage.setItem('selectedPharmacyProfile', JSON.stringify(pharmacy));
            window.location.replace('pharmacy-profile.html');
        }
        
        function goBack() {
            window.location.replace('products.html');
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.getAttribute('onclick').includes(`'${tabName}'`));
            if (activeBtn) activeBtn.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }
        
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data;
                    if (file.name.endsWith('.csv')) {
                        data = parseCSV(e.target.result);
                    } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                        const workbook = XLSX.read(e.target.result, { type: 'binary' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                        data = jsonData.filter(row => row.some(cell => cell !== undefined && cell !== ''));
                    } else {
                        alert('نوع الملف غير مدعوم');
                        return;
                    }
                    
                    if (data.length < 2) {
                        alert('الملف يجب أن يحتوي على بيانات');
                        return;
                    }
                    
                    fileHeaders = data[0].map(header => String(header || '').trim());
                    bulkData = data.slice(1).filter(row => row.some(cell => cell !== undefined && cell !== ''));
                    
                    setupColumnMapping();
                    showPreview();
                    document.getElementById('mappingSection').style.display = 'block';
                    
                } catch (error) {
                    alert('خطأ في قراءة الملف: ' + error.message);
                }
            };
            
            if (file.name.endsWith('.csv')) {
                reader.readAsText(file);
            } else {
                reader.readAsBinaryString(file);
            }
        }
        
        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim());
            return lines.map(line => {
                const result = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current.trim());
                return result;
            });
        }
        
        function setupColumnMapping() {
            const selects = ['nameColumn', 'phoneColumn', 'addressColumn', 'latColumn', 'lngColumn'];
            
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                select.innerHTML = selectId.includes('lat') || selectId.includes('lng') ? 
                    '<option value="">-- اختياري --</option>' : '<option value="">اختر عمود...</option>';
                
                fileHeaders.forEach((header, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = header || `عمود ${index + 1}`;
                    select.appendChild(option);
                });
            });
            
            autoDetectColumns();
        }
        
        function autoDetectColumns() {
            const nameKeywords = ['اسم', 'name', 'صيدلية', 'pharmacy'];
            const phoneKeywords = ['تليفون', 'phone', 'هاتف', 'mobile', 'جوال'];
            const addressKeywords = ['عنوان', 'address', 'موقع', 'location'];
            const latKeywords = ['عرض', 'lat', 'latitude'];
            const lngKeywords = ['طول', 'lng', 'longitude', 'long'];
            
            fileHeaders.forEach((header, index) => {
                const lowerHeader = header.toLowerCase();
                
                if (nameKeywords.some(keyword => lowerHeader.includes(keyword))) {
                    document.getElementById('nameColumn').value = index;
                } else if (phoneKeywords.some(keyword => lowerHeader.includes(keyword))) {
                    document.getElementById('phoneColumn').value = index;
                } else if (addressKeywords.some(keyword => lowerHeader.includes(keyword))) {
                    document.getElementById('addressColumn').value = index;
                } else if (latKeywords.some(keyword => lowerHeader.includes(keyword))) {
                    document.getElementById('latColumn').value = index;
                } else if (lngKeywords.some(keyword => lowerHeader.includes(keyword))) {
                    document.getElementById('lngColumn').value = index;
                }
            });
            
            checkMappingValidity();
        }
        
        function checkMappingValidity() {
            const nameCol = document.getElementById('nameColumn').value;
            const phoneCol = document.getElementById('phoneColumn').value;
            const addressCol = document.getElementById('addressColumn').value;
            
            document.getElementById('importBtn').disabled = !(nameCol && phoneCol && addressCol);
        }
        
        function showPreview() {
            const previewDiv = document.getElementById('previewTable');
            const previewData = bulkData.slice(0, 5);
            
            let html = '<div class="preview-table"><table><thead><tr>';
            fileHeaders.forEach(header => {
                html += `<th>${header || 'عمود'}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            previewData.forEach(row => {
                html += '<tr>';
                row.forEach(cell => {
                    html += `<td>${cell || ''}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            previewDiv.innerHTML = html;
        }
        
        async function processBulkImport() {
            const nameCol = parseInt(document.getElementById('nameColumn').value);
            const phoneCol = parseInt(document.getElementById('phoneColumn').value);
            const addressCol = parseInt(document.getElementById('addressColumn').value);
            const latCol = document.getElementById('latColumn').value ? parseInt(document.getElementById('latColumn').value) : null;
            const lngCol = document.getElementById('lngColumn').value ? parseInt(document.getElementById('lngColumn').value) : null;
            
            const importBtn = document.getElementById('importBtn');
            const originalText = importBtn.textContent;
            importBtn.disabled = true;
            importBtn.textContent = '⏳ جاري الرفع للسيرفر...';

            const toInsert = bulkData.map(row => {
                const name = row[nameCol]?.trim();
                const phone = row[phoneCol]?.trim();
                const address = row[addressCol]?.trim();
                const lat = latCol !== null ? row[latCol]?.trim() : '';
                const lng = lngCol !== null ? row[lngCol]?.trim() : '';

                if (!name || !phone || !address || phone.length !== 11) return null;

                return {
                    name: name,
                    phone: phone,
                    address: address,
                    warehouse_id: currentWarehouseId,
                    user_id: currentUser.email,
                    gps_location: (lat && lng) ? { lat: parseFloat(lat), lng: parseFloat(lng) } : null
                };
            }).filter(p => p !== null);

            try {
                const supabase = await getSupabase();
                if (!supabase) throw new Error('الاتصال بالسيرفر غير متوفر');

                const batchSize = 100;
                for (let i = 0; i < toInsert.length; i += batchSize) {
                    const batch = toInsert.slice(i, i + batchSize);
                    const { error } = await supabase.from('pharmacies').insert(batch);
                    if (error) throw error;
                }

                alert(`✅ تم استيراد ${toInsert.length} صيدلية بنجاح إلى السيرفر`);
                cancelBulkImport();
                await loadPharmacies();
            } catch (error) {
                console.error('Bulk import error:', error);
                alert('❌ خطأ أثناء الاستيراد: ' + error.message);
            } finally {
                importBtn.disabled = false;
                importBtn.textContent = originalText;
            }
        }
        
        function cancelBulkImport() {
            document.getElementById('mappingSection').style.display = 'none';
            document.getElementById('fileInput').value = '';
            bulkData = [];
            fileHeaders = [];
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            ['nameColumn', 'phoneColumn', 'addressColumn'].forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.addEventListener('change', checkMappingValidity);
                }
            });
        });
        
        class PharmacyVoiceSearch {
            constructor() {
                this.micBtn = document.getElementById('pharmacyMic');
                this.searchInput = document.getElementById('searchInput');
                this.isListening = false;
                this.recognition = null;
                
                if (this.micBtn) this.init();
            }

            async init() {
                this.setupSpeech();
                if (window.GeminiVoiceProcessor) {
                    this.geminiProcessor = new window.GeminiVoiceProcessor();
                }
                this.micBtn.addEventListener('click', () => this.toggle());
            }

            setupSpeech() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return;

                this.recognition = new SR();
                this.recognition.lang = 'en-US';
                this.recognition.continuous = false;
                this.recognition.interimResults = false;
                this.recognition.maxAlternatives = 5;

                this.recognition.onstart = () => {
                    this.isListening = true;
                    this.micBtn.classList.add('listening');
                    this.showSpeechBubble('...استمع الآن');
                };

                this.recognition.onresult = async (event) => {
                    const transcripts = Array.from(event.results[0]).map(res => res.transcript);
                    this.showSpeechBubble(transcripts[0]);
                    await this.processResults(transcripts);
                };

                this.recognition.onerror = () => { this.stop(); };
                this.recognition.onend = () => {
                    this.isListening = false;
                    this.micBtn.classList.remove('listening');
                    setTimeout(() => this.hideSpeechBubble(), 2000);
                };
            }

            toggle() { this.isListening ? this.stop() : this.start(); }
            start() { try { if (this.recognition) this.recognition.start(); } catch (e) {} }
            stop() { if (this.recognition) this.recognition.stop(); }

            showSpeechBubble(text) {
                const bubble = document.getElementById('speechBubble');
                if (bubble) { bubble.textContent = text; bubble.style.display = 'block'; }
            }

            hideSpeechBubble() {
                const bubble = document.getElementById('speechBubble');
                if (bubble) bubble.style.display = 'none';
            }

            async asyncProcessVoice(transcripts, pharmacyList) {
                if (!this.geminiProcessor) return transcripts[0];
                const contextList = pharmacyList.map(p => ({
                    pharmacyName: p.name || p.pharmacyName,
                    id: p.id
                }));
                
                try {
                    const result = await this.geminiProcessor.processVoiceInput(transcripts, contextList, 'pharmacy');
                    if (result && result.correctedDrug && result.confidence > 0.4) {
                        return result.correctedDrug;
                    }
                    return transcripts[0];
                } catch (e) {
                    console.error('Gemini Pharmacy Recon error:', e);
                    return transcripts[0];
                }
            }

            async processResults(transcripts) {
                let bestMatch = transcripts[0];
                if (allPharmacies.length > 0) {
                    bestMatch = await this.asyncProcessVoice(transcripts, allPharmacies);
                }
                this.searchInput.value = bestMatch;
                this.searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                this.showSpeechBubble('بحث عن: ' + bestMatch);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.pharmacyVoiceSearch = new PharmacyVoiceSearch();
        });
