<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف الصيدلية</title>
    <script src="navigation.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .back-arrow {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #ff6b6b, #dc3545);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.5);
            transition: all 0.3s;
            border: 3px solid white;
            z-index: 1000;
            outline: none;
            user-select: none;
        }
        .back-arrow:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.7);
        }
        .back-arrow:active {
            transform: scale(0.95);
        }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .pharmacy-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; padding: 25px; border-radius: 10px; margin-bottom: 30px; text-align: center;
        }
        .pharmacy-name { font-size: 28px; font-weight: bold; margin-bottom: 15px; }
        .pharmacy-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; font-size: 16px; }
        .info-item { display: flex; align-items: center; gap: 10px; }
        .phone-link, .gps-link { color: white; text-decoration: none; font-weight: bold; }
        .phone-link:hover, .gps-link:hover { text-decoration: underline; }
        .stats { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { flex: 1; min-width: 150px; padding: 20px; border-radius: 8px; text-align: center; color: white; }
        .stat-card.total { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .stat-card.cash { background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%); }
        .stat-number { font-size: 36px; font-weight: bold; margin-bottom: 5px; }
        .stat-label { font-size: 14px; }
        .search-section { background: #f8f9ff; padding: 25px; border-radius: 10px; margin-bottom: 30px; border: 2px solid #667eea; }
        .search-title { font-size: 18px; font-weight: bold; color: #667eea; margin-bottom: 20px; }
        .search-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        input, select { padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 14px; box-sizing: border-box; font-family: Arial, sans-serif; }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .btn { padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.3s; }
        .btn-search { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-clear { background: #6c757d; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; padding: 12px; text-align: right; }
        td { padding: 12px; border-bottom: 1px solid #ddd; text-align: right; }
        tr:hover { background: #f0f9ff; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; }
        .status-accepted { background: #28a745; }
        .status-pending { background: #ffc107; color: #333; }
        .status-rejected { background: #dc3545; }
        .btn-details { background: #17a2b8; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .btn-delete-order { background: #dc3545; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; margin-right: 5px; }
        .btn-delete-order:hover { background: #c82333; }
        .btn-print-order { background: #667eea; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; margin-right: 5px; }
        .btn-print-order:hover { background: #5a67d8; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-icon { font-size: 80px; margin-bottom: 20px; }
        .order-details { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px; padding: 15px; display: none; }
        .product-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
        .product-item:last-child { border-bottom: none; }
        .result-info { background: #e3f2fd; padding: 12px 20px; border-radius: 5px; margin-bottom: 15px; color: #1565c0; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="back-arrow" onclick="goBack()">←</div>
    <div class="container">
        <div class="pharmacy-header">
            <div class="pharmacy-name" id="pharmacyName"></div>
            <div class="pharmacy-info">
                <div class="info-item">📞 <a class="phone-link" id="pharmacyPhone" href="#"></a></div>
                <div class="info-item">📍 <span id="pharmacyAddress"></span></div>
                <div class="info-item" id="gpsInfo" style="display:none">🗺️ <a class="gps-link" id="pharmacyGPS" target="_blank">عرض الموقع</a></div>
                <div class="info-item">📅 <span id="pharmacyDate"></span></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card total"><div class="stat-number" id="totalOrders">0</div><div class="stat-label">إجمالي الأوردرات</div></div>
            <div class="stat-card cash"><div class="stat-number" id="totalCash">0</div><div class="stat-label">💰 إجمالي النقدية (جنيه)</div></div>
        </div>

        <div class="search-section">
            <div class="search-title">🔍 البحث في الأوردرات</div>
            <div class="search-grid">
                <div class="form-group"><label>من تاريخ</label><input type="date" id="fromDate"></div>
                <div class="form-group"><label>إلى تاريخ</label><input type="date" id="toDate"></div>
                <div class="form-group">
                    <label>حالة الأوردر</label>
                    <select id="statusFilter">
                        <option value="">جميع الحالات</option>
                        <option value="pending">في الانتظار</option>
                        <option value="accepted">مقبولة</option>
                        <option value="rejected">مرفوضة</option>
                    </select>
                </div>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-search" onclick="searchOrders()">بحث</button>
                <button class="btn btn-clear" onclick="clearSearch()">مسح</button>
            </div>
        </div>

        <div class="result-info" id="resultInfo"></div>

        <div style="overflow-x:auto">
            <table id="ordersTable" style="display:none">
                <thead>
                    <tr>
                        <th>#</th><th>رقم الأوردر</th><th>التاريخ</th>
                        <th>عدد المنتجات</th><th>الإجمالي</th><th>الحالة</th><th>تفاصيل</th><th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="ordersBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">📋</div>
                <div>لا توجد أوردرات لهذه الصيدلية</div>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser) if(typeof window.showOfflineToast === 'function') window.showOfflineToast();

        const currentPharmacy = JSON.parse(sessionStorage.getItem('selectedPharmacyProfile'));
        if (!currentPharmacy) { alert('لم يتم العثور على بيانات الصيدلية'); window.location.replace('pharmacies.html'); }

        let allOrders = [];

        // عرض بيانات الصيدلية
        document.getElementById('pharmacyName').textContent = currentPharmacy.pharmacyName;
        document.getElementById('pharmacyPhone').textContent = currentPharmacy.pharmacyPhone;
        document.getElementById('pharmacyPhone').href = 'tel:' + currentPharmacy.pharmacyPhone;
        document.getElementById('pharmacyAddress').textContent = currentPharmacy.pharmacyAddress;
        document.getElementById('pharmacyDate').textContent = new Date(currentPharmacy.createdAt).toLocaleDateString('ar-EG');
        if (currentPharmacy.pharmacyGPS && currentPharmacy.pharmacyGPS.lat) {
            document.getElementById('pharmacyGPS').href = `https://www.google.com/maps?q=${currentPharmacy.pharmacyGPS.lat},${currentPharmacy.pharmacyGPS.lng}`;
            document.getElementById('gpsInfo').style.display = 'flex';
        }

        function getOrderDate(order) {
            return order.createdAt || order.orderDate || '';
        }

        function getOrderStatus(order) {
            const s = order.status || 'pending';
            if (s === 'completed') return 'accepted';
            if (s === 'cancelled') return 'rejected';
            return s;
        }

        function loadOrders() {
            // جمع الأوردرات من localStorage
            const lsOrders = JSON.parse(localStorage.getItem('orders')) || [];
            const lsFiltered = lsOrders.filter(o =>
                o.userId === currentUser.email &&
                o.pharmacyName === currentPharmacy.pharmacyName &&
                o.pharmacyPhone === currentPharmacy.pharmacyPhone
            );

            // جمع الأوردرات من IndexedDB
            const req = indexedDB.open('WarehouseDB', 5);
            req.onsuccess = function() {
                const db = req.result;
                if (!db.objectStoreNames.contains('orders')) {
                    allOrders = lsFiltered;
                    renderOrders(allOrders);
                    updateStats();
                    return;
                }
                const tx = db.transaction(['orders'], 'readonly');
                const store = tx.objectStore('orders');
                const index = store.index('userId');
                const dbReq = index.getAll(currentUser.email);

                dbReq.onsuccess = function() {
                    const dbFiltered = (dbReq.result || []).filter(o =>
                        o.pharmacyName === currentPharmacy.pharmacyName &&
                        o.pharmacyPhone === currentPharmacy.pharmacyPhone
                    );

                    // دمج بدون تكرار
                    const merged = [...lsFiltered];
                    dbFiltered.forEach(dbOrder => {
                        const exists = merged.find(o =>
                            String(o.orderNumber) === String(dbOrder.orderNumber) ||
                            String(o.id) === String(dbOrder.id)
                        );
                        if (!exists) merged.push(dbOrder);
                    });

                    allOrders = merged;
                    renderOrders(allOrders);
                    updateStats();
                };

                dbReq.onerror = function() {
                    allOrders = lsFiltered;
                    renderOrders(allOrders);
                    updateStats();
                };
            };

            req.onerror = function() {
                allOrders = lsFiltered;
                renderOrders(allOrders);
                updateStats();
            };
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('ordersBody');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                document.getElementById('ordersTable').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }

            document.getElementById('ordersTable').style.display = 'table';
            document.getElementById('emptyState').style.display = 'none';

            orders.forEach((order, i) => {
                const dateStr = getOrderDate(order);
                const date = dateStr ? new Date(dateStr).toLocaleDateString('ar-EG') : '-';
                const time = dateStr ? new Date(dateStr).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';
                const status = getOrderStatus(order);
                const statusClass = status === 'accepted' ? 'status-accepted' : status === 'rejected' ? 'status-rejected' : 'status-pending';
                const statusText = status === 'accepted' ? 'مقبولة' : status === 'rejected' ? 'مرفوضة' : 'في الانتظار';
                const productsCount = order.products ? order.products.length : 0;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${i + 1}</td>
                    <td><strong>#${order.orderNumber || order.id || '-'}</strong></td>
                    <td>${date}<br><small>${time}</small></td>
                    <td>${productsCount}</td>
                    <td><strong>${(order.totalAmount || 0).toFixed(2)} ج</strong></td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td><button class="btn-details" onclick="toggleDetails(${i})">عرض التفاصيل</button></td>
                    <td>
                        <button class="btn-print-order" onclick="printOrder(${i})">🖨️</button>
                        <button class="btn-delete-order" onclick="deleteOrder(${i})">🗑️</button>
                    </td>
                `;
                tbody.appendChild(row);

                const detailsRow = document.createElement('tr');
                const productsHtml = order.products && order.products.length > 0
                    ? order.products.map(p => `
                        <div class="product-item">
                            <span><strong>${p.productName || p.name || '-'}</strong></span>
                            <span>الكمية: <strong>${p.quantity || 0}</strong></span>
                        </div>`).join('')
                    : '<p>لا توجد منتجات</p>';

                detailsRow.innerHTML = `
                    <td colspan="8">
                        <div class="order-details" id="details-${i}">
                            <strong>المنتجات:</strong>
                            <div style="margin-top:10px">${productsHtml}</div>
                            ${order.notes ? `<p><strong>ملاحظات:</strong> ${order.notes}</p>` : ''}
                        </div>
                    </td>`;
                tbody.appendChild(detailsRow);
            });
        }

        function updateStats() {
            document.getElementById('totalOrders').textContent = allOrders.length;
            const cash = allOrders
                .filter(o => getOrderStatus(o) === 'accepted')
                .reduce((sum, o) => sum + (o.totalAmount || 0), 0);
            document.getElementById('totalCash').textContent = cash.toFixed(2);
        }

        function searchOrders() {
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            const statusFilter = document.getElementById('statusFilter').value;

            let filtered = [...allOrders];

            if (fromDate) {
                const from = new Date(fromDate);
                from.setHours(0, 0, 0, 0);
                filtered = filtered.filter(o => new Date(getOrderDate(o)) >= from);
            }

            if (toDate) {
                const to = new Date(toDate);
                to.setHours(23, 59, 59, 999);
                filtered = filtered.filter(o => new Date(getOrderDate(o)) <= to);
            }

            if (statusFilter) {
                filtered = filtered.filter(o => getOrderStatus(o) === statusFilter);
            }

            renderOrders(filtered);

            const info = document.getElementById('resultInfo');
            info.style.display = 'block';
            info.textContent = `نتائج البحث: ${filtered.length} أوردر`;
        }

        function clearSearch() {
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('resultInfo').style.display = 'none';
            renderOrders(allOrders);
        }

        function toggleDetails(i) {
            const div = document.getElementById('details-' + i);
            document.querySelectorAll('.order-details').forEach(d => { if (d !== div) d.style.display = 'none'; });
            div.style.display = div.style.display === 'block' ? 'none' : 'block';
        }

        function deleteOrder(i) {
            const order = allOrders[i];
            if (!order) return;
            if (!confirm(`هل أنت متأكد من حذف الأوردر #${order.orderNumber || order.id}؟`)) return;

            const lsOrders = JSON.parse(localStorage.getItem('orders')) || [];
            const updated = lsOrders.filter(o =>
                !(o.userId === currentUser.email &&
                  (String(o.orderNumber) === String(order.orderNumber) || String(o.id) === String(order.id)))
            );
            localStorage.setItem('orders', JSON.stringify(updated));

            const req = indexedDB.open('WarehouseDB', 5);
            req.onsuccess = function() {
                const db = req.result;
                if (db.objectStoreNames.contains('orders') && order.id) {
                    const tx = db.transaction(['orders'], 'readwrite');
                    tx.objectStore('orders').delete(order.id);
                    tx.oncomplete = function() { loadOrders(); };
                    tx.onerror = function() { loadOrders(); };
                } else {
                    loadOrders();
                }
            };
            req.onerror = function() { loadOrders(); };
        }

        function printOrder(i) {
            const order = allOrders[i];
            if (!order) {
                alert('لم يتم العثور على الأوردر');
                return;
            }
            
            // إنشاء محتوى الطباعة
            let printContent = '<div style="padding: 20px; font-family: Arial, sans-serif;">';
            printContent += '<div style="text-align: center; margin-bottom: 30px;">';
            printContent += '<h1 style="color: #333; margin-bottom: 10px;">📋 تفاصيل الأوردر</h1>';
            printContent += '<h2 style="color: #667eea; margin-bottom: 5px;">#' + (order.orderNumber || order.id || '-') + '</h2>';
            printContent += '<p style="color: #666; font-size: 16px; margin: 5px 0;"><strong>الصيدلية:</strong> ' + currentPharmacy.pharmacyName + '</p>';
            printContent += '<p style="color: #666; font-size: 14px; margin: 5px 0;">📞 ' + currentPharmacy.pharmacyPhone + '</p>';
            printContent += '<p style="color: #666; font-size: 14px; margin: 5px 0;">📍 ' + currentPharmacy.pharmacyAddress + '</p>';
            
            const dateStr = getOrderDate(order);
            const date = dateStr ? new Date(dateStr).toLocaleDateString('ar-EG') : '-';
            const time = dateStr ? new Date(dateStr).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';
            printContent += '<p style="color: #999; font-size: 14px; margin: 5px 0;">📅 ' + date + ' - ' + time + '</p>';
            
            const status = getOrderStatus(order);
            const statusText = status === 'accepted' ? 'مقبولة ✅' : status === 'rejected' ? 'مرفوضة ❌' : 'في الانتظار ⏳';
            printContent += '<p style="color: #999; font-size: 14px; margin: 5px 0;"><strong>الحالة:</strong> ' + statusText + '</p>';
            printContent += '</div>';
            
            if (order.products && order.products.length > 0) {
                printContent += '<table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">';
                printContent += '<thead><tr style="background: #667eea; color: white;">';
                printContent += '<th style="padding: 10px; border: 1px solid #ddd;">#</th>';
                printContent += '<th style="padding: 10px; border: 1px solid #ddd;">المنتج</th>';
                printContent += '<th style="padding: 10px; border: 1px solid #ddd;">السعر</th>';
                printContent += '<th style="padding: 10px; border: 1px solid #ddd;">الخصم</th>';
                printContent += '<th style="padding: 10px; border: 1px solid #ddd;">بعد الخصم</th>';
                printContent += '<th style="padding: 10px; border: 1px solid #ddd;">الكمية</th>';
                printContent += '<th style="padding: 10px; border: 1px solid #ddd;">الإجمالي</th>';
                printContent += '</tr></thead><tbody>';
                
                let orderTotal = 0;
                order.products.forEach((product, pIndex) => {
                    const price = product.price || 0;
                    const discount = product.discount || 0;
                    const quantity = product.quantity || 0;
                    const afterDiscount = price - (price * discount / 100);
                    const itemTotal = afterDiscount * quantity;
                    orderTotal += itemTotal;
                    
                    printContent += '<tr>';
                    printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;">' + (pIndex + 1) + '</td>';
                    printContent += '<td style="padding: 8px; border: 1px solid #ddd;">' + (product.productName || product.name || '-') + '</td>';
                    printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;">' + price.toFixed(2) + ' ج</td>';
                    printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;">' + discount + '%</td>';
                    printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;">' + afterDiscount.toFixed(2) + ' ج</td>';
                    printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;">' + quantity + '</td>';
                    printContent += '<td style="padding: 8px; border: 1px solid #ddd; text-align: center;"><strong>' + itemTotal.toFixed(2) + ' ج</strong></td>';
                    printContent += '</tr>';
                });
                
                printContent += '<tr style="background: #f8f9ff;">';
                printContent += '<td colspan="6" style="padding: 12px; border: 1px solid #ddd; text-align: left; font-weight: bold;">الإجمالي الكلي:</td>';
                printContent += '<td style="padding: 12px; border: 1px solid #ddd; text-align: center; font-weight: bold; color: #667eea; font-size: 18px;">' + orderTotal.toFixed(2) + ' ج</td>';
                printContent += '</tr>';
                
                printContent += '</tbody></table>';
            } else {
                printContent += '<p style="text-align: center; color: #999; padding: 20px;">لا توجد منتجات في هذا الأوردر</p>';
            }
            
            if (order.notes) {
                printContent += '<div style="background: #f8f9ff; padding: 15px; border-radius: 5px; border: 2px solid #667eea;">';
                printContent += '<p style="margin: 0;"><strong>📝 ملاحظات:</strong></p>';
                printContent += '<p style="margin: 10px 0 0 0;">' + order.notes + '</p>';
                printContent += '</div>';
            }
            
            printContent += '</div>';
            
            // إنشاء منطقة الطباعة إذا لم تكن موجودة
            let printArea = document.getElementById('printArea');
            if (!printArea) {
                printArea = document.createElement('div');
                printArea.id = 'printArea';
                printArea.style.display = 'none';
                document.body.appendChild(printArea);
            }
            
            printArea.innerHTML = printContent;
            window.print();
        }
        
        function goBack() {
            sessionStorage.removeItem('selectedPharmacyProfile');
            window.location.replace('pharmacies.html');
        }

        loadOrders();
    </script>
    <script src="ai-core.js"></script>
    <script src="ai-validation.js"></script>
    <script src="ai-speech.js"></script>
    <script src="ai-database.js"></script>
    <script src="ai-ui.js"></script>
    <script src="ai-assistant.js"></script>
</body>
</html>
