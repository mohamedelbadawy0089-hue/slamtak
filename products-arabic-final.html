    <script>
        // Load statistics on demand with loading spinner
        async function loadStats() {
            try {
                // Show loading spinners
                showLoadingSpinners();
                
                // Get current warehouse ID
                const warehouseId = localStorage.getItem('current_warehouse_id') || localStorage.getItem('slamtak-user-id');
                
                if (!warehouseId) {
                    console.error('No warehouse ID found');
                    hideLoadingSpinners();
                    return;
                }
                
                // Get Supabase client
                const supabaseClient = window.SupabaseSingleton.getClient();
                
                // Get total products count
                const { count: totalCount, error: totalError } = await supabaseClient
                    .from('products')
                    .select('*', { count: 'exact', head: true })
                    .eq('warehouse_id', warehouseId);
                
                // Get unlimited products count
                const { count: unlimitedCount, error: unlimitedError } = await supabaseClient
                    .from('products')
                    .select('*', { count: 'exact', head: true })
                    .eq('warehouse_id', warehouseId)
                    .eq('quantity', -1);
                
                // Get limited products count
                const { count: limitedCount, error: limitedError } = await supabaseClient
                    .from('products')
                    .select('*', { count: 'exact', head: true })
                    .eq('warehouse_id', warehouseId)
                    .gt('quantity', 0)
                    .lt('quantity', 10);
                
                // Get expiring products count (products expiring in next 30 days)
                const thirtyDaysFromNow = new Date();
                thirtyDaysFromNow.setDate(thirtyDaysFromNow.getDate() + 30);
                
                const { count: expiringCount, error: expiringError } = await supabaseClient
                    .from('products')
                    .select('*', { count: 'exact', head: true })
                    .eq('warehouse_id', warehouseId)
                    .lte('expiry_date', thirtyDaysFromNow.toISOString())
                    .gt('expiry_date', new Date().toISOString());
                
                // Update UI with results
                if (!totalError) document.getElementById('totalCount').innerHTML = totalCount || 0;
                if (!unlimitedError) document.getElementById('unlimitedCount').innerHTML = unlimitedCount || 0;
                if (!limitedError) document.getElementById('limitedCount').innerHTML = limitedCount || 0;
                if (!expiringError) document.getElementById('expiringCount').innerHTML = expiringCount || 0;
                
                // Hide loading spinners
                hideLoadingSpinners();
                
            } catch (error) {
                console.error('Error loading stats:', error);
                hideLoadingSpinners();
                
                // Fallback to 0 values on error
                document.getElementById('totalCount').innerHTML = '0';
                document.getElementById('unlimitedCount').innerHTML = '0';
                document.getElementById('limitedCount').innerHTML = '0';
                document.getElementById('expiringCount').innerHTML = '0';
            }
        }
        
        function showLoadingSpinners() {
            document.querySelectorAll('.loading-spinner').forEach(spinner => {
                spinner.style.display = 'inline-block';
            });
            document.querySelectorAll('.click-to-load').forEach(text => {
                text.style.display = 'none';
            });
        }
        
        function hideLoadingSpinners() {
            document.querySelectorAll('.loading-spinner').forEach(spinner => {
                spinner.style.display = 'none';
            });
            document.querySelectorAll('.click-to-load').forEach(text => {
                text.style.display = 'inline';
            });
        }
