<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>تسجيل الدخول - Slamtak ERP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="auth-card">
      <div class="brand">
        <h1>🔐 تسجيل الدخول</h1>
        <p class="subtitle">ادخل بريدك الإلكتروني وكلمة المرور للوصول للنظام</p>
      </div>
      <form id="login-form">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@mail.com" required autocomplete="email" />
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="كلمة المرور" required autocomplete="current-password" minlength="6" />
        <div class="field-error" id="error-msg"></div>
        <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;background:#1e3a8a;">دخول</button>
      </form>
      <p class="muted">ليس لديك حساب؟ <a href="/register">سجل مخزنك الآن</a></p>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
  (function() {
    const appEl = document.getElementById('app');
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-msg');

    function getSb() {
      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        errorEl.textContent = 'خطأ في التحميل - Supabase غير متاح';
        return null;
      }
      return window.supabase.createClient(
        (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url) || 'https://iksjhjxwphmvthryfeae.supabase.co',
        (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.anonKey) || ''
      );
    }

    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          errorEl.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور';
          return;
        }

        const sb = getSb();
        if (!sb) return;

        try {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) {
            errorEl.textContent = error.message || 'حدث خطأ في تسجيل الدخول';
            return;
          }
          if (data.user) {
            window.location.href = '/';
          }
        } catch (err) {
          errorEl.textContent = err.message || 'حدث خطأ غير متوقع';
        }
      });
    }

    // إذا كان المستخدم مسجلاً بالفعل، وصل له هنا
    const sb = getSb();
    if (sb) {
      sb.auth.getUser().then(({ data: { user } }) => {
        if (user) window.location.href = '/';
      });
    }
  })();
  </script>
</body>
</html>
