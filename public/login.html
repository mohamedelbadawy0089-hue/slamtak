<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>جارٍ التحويل إلى صفحة الدخول…</title>
  <!-- صفحة الدخول الحقيقية هي /login داخل التطبيق (خطوتان + تسجيل مخزن).
       هذا الملف يبقى فقط لمن يصل إلى login.html من رابط قديم أو قالب بريد،
       فيحوّله إلى جذر النشر بدل تكرار نموذج الدخول هنا. -->
  <script>
    (function () {
      // "./" نسبةً إلى مكان هذا الملف = جذر النشر (/slamtak/ على GitHub Pages).
      var target = "./";
      try {
        window.location.replace(target);
      } catch (e) {
        window.location.href = target;
      }
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=./" /></noscript>
  <style>
    body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; background: #f8fafc; color: #0f172a; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem 2rem; text-align: center; max-width: 24rem; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="font-size:1.1rem;margin:0 0 0.5rem;">جارٍ التحويل…</h1>
    <p style="margin:0 0 0.75rem;color:#475569;">صفحة الدخول صارت داخل التطبيق.</p>
    <p style="margin:0;"><a href="./">الدخول إلى النظام</a></p>
  </div>
</body>
</html>
