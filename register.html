<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل مخزن</title>
    <script src="navigation.js"></script>
    <script src="libs/dexie.js"></script>
    <script src="libs/supabase.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #ff6b6b, #dc3545);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.5);
            transition: all 0.3s;
            border: 3px solid white;
            z-index: 1000;
            outline: none;
            user-select: none;
        }
        .back-arrow:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.7);
        }
        .back-arrow:active {
            transform: scale(0.95);
        }
        .lang-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 999;
        }
        .lang-toggle:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.4);
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .gov-container {
            position: relative;
        }
        .gov-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .gov-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .gov-option {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .gov-option:hover {
            background-color: #28a745;
            color: white;
        }
        .gov-option:last-child {
            border-bottom: none;
        }
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #666;
            user-select: none;
        }
        .toggle-password:hover {
            color: #333;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #28a745;
            box-shadow: 0 0 5px rgba(40, 167, 69, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #28a745;
            color: white;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="back-arrow" onclick="goBack()" title="رجوع">←</div>
    <button class="lang-toggle" onclick="toggleLanguage()" id="langBtn">English</button>
    <div class="container">
        <h2 id="title">تسجيل مخزن جديد</h2>
        <form onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label id="labelName">اسم المخزن</label>
                <input type="text" id="warehouseName" oninput="checkFormValidity()" required>
            </div>
            
            <div class="form-group">
                <label id="labelPhone">التليفون</label>
                <input type="tel" id="phone" pattern="[0-9]{11}" maxlength="11" oninput="checkFormValidity()" required>
            </div>
            
            <div class="form-group">
                <label id="labelGov">المحافظة</label>
                <div class="gov-container">
                    <input type="text" id="govInput" class="gov-input" placeholder="ابحث واختر المحافظة..." 
                           onclick="toggleDropdown()" onkeyup="filterOptions()" autocomplete="off" required>
                    <div id="govDropdown" class="gov-dropdown"></div>
                    <input type="hidden" id="selectedGov" name="governorate">
                </div>
            </div>
            
            <div class="form-group">
                <label id="labelEmail">الإيميل</label>
                <input type="email" id="email" oninput="validateEmail()" required>
                <div id="emailError" class="error-message">الإيميل يجب أن يحتوي على @ وينتهي بـ .com</div>
            </div>
            
            <div class="form-group">
                <label id="labelPassword">الباسورد</label>
                <div class="password-container">
                    <input type="password" id="password" oninput="checkPasswordMatch()" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</span>
                </div>
            </div>
            
            <div class="form-group">
                <label id="labelConfirm">تأكيد الباسورد</label>
                <div class="password-container">
                    <input type="password" id="confirmPassword" oninput="checkPasswordMatch()" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">👁️</span>
                </div>
                <div id="passwordError" class="error-message">الباسورد غير متطابق</div>
            </div>
            
            <button type="submit" id="submitBtn" disabled>تسجيل</button>
        </form>
    </div>

    <script>
        // إعداد Supabase
        const supabaseUrl = 'https://iksjhjxwphmvthryfeae.supabase.co';
        const supabaseKey = 'sb_publishable_0DUy2mtXS6m5S8PwTDAANQ_XWlzbu0G';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // إنشاء قاعدة بيانات IndexedDB باستخدام Dexie.js
        const db = new Dexie('WarehouseDB');
        db.version(1).stores({
            users: '++id, email, phone',
            settings: 'key'
        });

        // قاعدة بيانات محلية للمستخدمين المسجلين
        let registeredUsers = [];
        let indexedDB;
        
        // إنشاء قاعدة بيانات IndexedDB (للإصدار القديم)
        function initDB() {
            const request = indexedDB.open('WarehouseDB', 1);
            
            request.onerror = function() {
                console.error('Database failed to open');
                // استخدام localStorage كبديل
                registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];
            };
            
            request.onsuccess = function() {
                indexedDB = request.result;
                loadUsers();
            };
            
            request.onupgradeneeded = function(e) {
                indexedDB = e.target.result;
                
                if (!indexedDB.objectStoreNames.contains('users')) {
                    const objectStore = indexedDB.createObjectStore('users', { keyPath: 'id', autoIncrement: true });
                    objectStore.createIndex('email', 'email', { unique: true });
                    objectStore.createIndex('phone', 'phone', { unique: true });
                }
                
                if (!indexedDB.objectStoreNames.contains('settings')) {
                    indexedDB.createObjectStore('settings', { keyPath: 'key' });
                }
            };
        }
        
        function loadUsers() {
            const transaction = db.transaction(['users'], 'readonly');
            const objectStore = transaction.objectStore('users');
            const request = objectStore.getAll();
            
            request.onsuccess = function() {
                registeredUsers = request.result;
            };
        }
        
        function checkDuplicate(email, phone, callback) {
            if (!db) {
                // استخدام localStorage كبديل
                const emailExists = registeredUsers.some(user => user.email === email);
                const phoneExists = registeredUsers.some(user => user.phone === phone);
                callback(emailExists, phoneExists);
                return;
            }
            
            const transaction = db.transaction(['users'], 'readonly');
            const objectStore = transaction.objectStore('users');
            
            const emailIndex = objectStore.index('email');
            const phoneIndex = objectStore.index('phone');
            
            const emailRequest = emailIndex.get(email);
            const phoneRequest = phoneIndex.get(phone);
            
            let emailExists = false;
            let phoneExists = false;
            
            emailRequest.onsuccess = function() {
                emailExists = !!emailRequest.result;
            };
            
            phoneRequest.onsuccess = function() {
                phoneExists = !!phoneRequest.result;
            };
            
            transaction.oncomplete = function() {
                callback(emailExists, phoneExists);
            };
        }
        
        function saveUser(userData, callback) {
            // حفظ المستخدم في Supabase مع الأعمدة الصحيحة
            supabaseClient
                .from('warehouses')
                .insert([{
                    warehouse_name: userData.warehouseName || userData.name || 'مخزن جديد',
                    email: userData.email,
                    phone_number: userData.phone,
                    governorate: userData.governorate,
                    admin_key: userData.password || 'admin123',
                    // الأعمدة القديمة للتوافق
                    name: userData.warehouseName || userData.name,
                    phone: userData.phone,
                    password: userData.password,
                    created_at: new Date().toISOString()
                }])
                .select()
                .then(({ data, error }) => {
                    if (error) {
                        console.error('خطأ في حفظ المستخدم في Supabase:', error);
                        // استخدام Dexie.js كبديل
                        db.users.add(userData)
                            .then(() => {
                                loadUsers();
                                callback(true, null);
                            })
                            .catch(error => {
                                console.error('خطأ في حفظ المستخدم:', error);
                                // استخدام localStorage كبديل
                                const users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
                                users.push(userData);
                                localStorage.setItem('registeredUsers', JSON.stringify(users));
                                registeredUsers = users;
                                callback(true, null);
                            });
                    } else {
                        // حفظ المستخدم محلياً مع UUID من Supabase
                        userData.id = data[0].id;
                        db.users.add(userData)
                            .then(() => {
                                loadUsers();
                                callback(true, data[0].id);
                            })
                            .catch(error => {
                                console.error('خطأ في حفظ المستخدم محلياً:', error);
                                callback(true, data[0].id);
                            });
                    }
                });
        }

        
        // تهيئة قاعدة البيانات عند تحميل الصفحة
        initDB();
        
        const governoratesAr = [
            'القاهرة', 'الجيزة', 'الإسكندرية', 'الدقهلية', 'البحر الأحمر',
            'البحيرة', 'الفيوم', 'الغربية', 'الإسماعيلية', 'المنوفية',
            'المنيا', 'القليوبية', 'الوادي الجديد', 'الشرقية', 'سوهاج',
            'جنوب سيناء', 'شمال سيناء', 'بني سويف', 'بورسعيد', 'دمياط',
            'أسوان', 'أسيوط', 'الأقصر', 'قنا', 'كفر الشيخ', 'مطروح', 'السويس'
        ];
        
        const governoratesEn = [
            'Cairo', 'Giza', 'Alexandria', 'Dakahlia', 'Red Sea',
            'Beheira', 'Fayoum', 'Gharbia', 'Ismailia', 'Monufia',
            'Minya', 'Qalyubia', 'New Valley', 'Sharqia', 'Sohag',
            'South Sinai', 'North Sinai', 'Beni Suef', 'Port Said', 'Damietta',
            'Aswan', 'Asyut', 'Luxor', 'Qena', 'Kafr El Sheikh', 'Matrouh', 'Suez'
        ];
        
        let currentLang = 'ar';
        
        const translations = {
            ar: {
                title: 'تسجيل مخزن جديد',
                labelName: 'اسم المخزن',
                labelPhone: 'التليفون',
                labelGov: 'المحافظة',
                labelEmail: 'الإيميل',
                labelPassword: 'الباسورد',
                labelConfirm: 'تأكيد الباسورد',
                submitBtn: 'تسجيل',
                langBtn: 'English',
                selectGov: 'اختر المحافظة...',
                passwordMismatch: 'الباسورد غير متطابق',
                successMsg: 'تم التسجيل بنجاح'
            },
            en: {
                title: 'Warehouse Registration',
                labelName: 'Warehouse Name',
                labelPhone: 'Phone',
                labelGov: 'Governorate',
                labelEmail: 'Email',
                labelPassword: 'Password',
                labelConfirm: 'Confirm Password',
                submitBtn: 'Register',
                langBtn: 'العربية',
                selectGov: 'Select Governorate...',
                passwordMismatch: 'Passwords do not match',
                successMsg: 'Registration successful'
            }
        };
        
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const html = document.documentElement;
            
            if (currentLang === 'en') {
                html.setAttribute('lang', 'en');
                html.setAttribute('dir', 'ltr');
            } else {
                html.setAttribute('lang', 'ar');
                html.setAttribute('dir', 'rtl');
            }
            
            updateTexts();
            updateGovernorates();
        }
        
        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('labelName').textContent = t.labelName;
            document.getElementById('labelPhone').textContent = t.labelPhone;
            document.getElementById('labelGov').textContent = t.labelGov;
            document.getElementById('labelEmail').textContent = t.labelEmail;
            document.getElementById('labelPassword').textContent = t.labelPassword;
            document.getElementById('labelConfirm').textContent = t.labelConfirm;
            document.getElementById('submitBtn').textContent = t.submitBtn;
            document.getElementById('langBtn').textContent = t.langBtn;
            validateEmail();
            checkPasswordMatch();
        }
        
        function validateEmail() {
            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('emailError');
            
            if (email && (!email.includes('@') || !email.endsWith('.com'))) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = currentLang === 'ar' ? 'الإيميل يجب أن يحتوي على @ وينتهي بـ .com' : 'Email must contain @ and end with .com';
            } else {
                errorDiv.style.display = 'none';
            }
            checkFormValidity();
        }
        
        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🔒';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }
        
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('passwordError');
            
            if (confirmPassword && password !== confirmPassword) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = currentLang === 'ar' ? 'الباسورد غير متطابق' : 'Passwords do not match';
            } else {
                errorDiv.style.display = 'none';
            }
            checkFormValidity();
        }
        
        function checkFormValidity() {
            const warehouseName = document.getElementById('warehouseName').value;
            const phone = document.getElementById('phone').value;
            const governorate = document.getElementById('selectedGov').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            
            const isPhoneValid = phone.length === 11 && /^[0-9]{11}$/.test(phone);
            const isEmailValid = email.includes('@') && email.endsWith('.com');
            const isPasswordMatch = password && confirmPassword && password === confirmPassword;
            
            if (warehouseName && isPhoneValid && governorate && isEmailValid && isPasswordMatch) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }
        
        function toggleDropdown() {
            const dropdown = document.getElementById('govDropdown');
            if (dropdown.style.display === 'block') {
                dropdown.style.display = 'none';
            } else {
                showAllOptions();
                dropdown.style.display = 'block';
            }
        }
        
        function showAllOptions() {
            const dropdown = document.getElementById('govDropdown');
            const govList = currentLang === 'ar' ? governoratesAr : governoratesEn;
            
            dropdown.innerHTML = '';
            govList.forEach(gov => {
                const option = document.createElement('div');
                option.className = 'gov-option';
                option.textContent = gov;
                option.onclick = () => selectOption(gov);
                dropdown.appendChild(option);
            });
        }
        
        function filterOptions() {
            const input = document.getElementById('govInput');
            const searchValue = input.value.toLowerCase();
            const dropdown = document.getElementById('govDropdown');
            const govList = currentLang === 'ar' ? governoratesAr : governoratesEn;
            
            dropdown.innerHTML = '';
            dropdown.style.display = 'block';
            
            const filtered = govList.filter(gov => gov.toLowerCase().includes(searchValue));
            filtered.forEach(gov => {
                const option = document.createElement('div');
                option.className = 'gov-option';
                option.textContent = gov;
                option.onclick = () => selectOption(gov);
                dropdown.appendChild(option);
            });
        }
        
        function selectOption(gov) {
            document.getElementById('govInput').value = gov;
            document.getElementById('selectedGov').value = gov;
            document.getElementById('govDropdown').style.display = 'none';
            checkFormValidity();
        }
        
        function updateGovernorates() {
            const input = document.getElementById('govInput');
            input.placeholder = currentLang === 'ar' ? 'ابحث واختر المحافظة...' : 'Search and select governorate...';
            input.value = '';
            document.getElementById('selectedGov').value = '';
            document.getElementById('govDropdown').style.display = 'none';
        }
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const container = document.querySelector('.gov-container');
            if (!container.contains(event.target)) {
                document.getElementById('govDropdown').style.display = 'none';
            }
        });
        
        function goBack() {
            window.location.replace('warehouse.html');
        }
        
        function handleSubmit(event) {
            event.preventDefault();
            
            const governorate = document.getElementById('selectedGov').value;
            if (!governorate) {
                alert(currentLang === 'ar' ? 'يرجى اختيار المحافظة' : 'Please select a governorate');
                return;
            }
            
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            
            if (!email.includes('@') || !email.endsWith('.com')) {
                alert(currentLang === 'ar' ? 'الإيميل يجب أن يحتوي على @ وينتهي بـ .com' : 'Email must contain @ and end with .com');
                return;
            }
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert(translations[currentLang].passwordMismatch);
                return;
            }
            
            // التحقق من عدم التكرار
            checkDuplicate(email, phone, function(emailExists, phoneExists) {
                if (emailExists) {
                    alert(currentLang === 'ar' ? 'هذا الإيميل مسجل مسبقاً' : 'This email is already registered');
                    return;
                }
                
                if (phoneExists) {
                    alert(currentLang === 'ar' ? 'هذا التليفون مسجل مسبقاً' : 'This phone number is already registered');
                    return;
                }
                
                // حفظ المستخدم الجديد
                const newUser = {
                    warehouseName: document.getElementById('warehouseName').value,
                    phone: phone,
                    governorate: governorate,
                    email: email,
                    password: password,
                    employees: [], // قائمة الموظفين
                    registeredAt: new Date().toISOString(),
                    lastLogin: null,
                    status: 'active'
                };
                
                saveUser(newUser, function(success, warehouseId) {
                    if (success) {
                        if (!warehouseId) {
                            alert(currentLang === 'ar' ? 'حدث خطأ: لم يتم الحصول على معرف المخزن من Supabase. يرجى التحقق من الاتصال بالإنترنت.' : 'Error: Failed to get warehouse ID from Supabase. Please check your internet connection.');
                            return;
                        }
                        
                        alert(translations[currentLang].successMsg);
                        // حفظ المستخدم في الجلسة والانتقال للقائمة
                        sessionStorage.setItem('currentUser', JSON.stringify(newUser));
                        
                        // حفظ معرف المخزن في localStorage (UUID من Supabase فقط)
                        console.log('🔍 Debug: Saving warehouse ID to localStorage:', warehouseId);
                        
                        // استخدام localStorage لحفظ معرف المخزن
                        localStorage.setItem('currentWarehouseId', warehouseId);
                        console.log('🔍 Debug: Warehouse ID saved to localStorage:', warehouseId);
                        
                        // محاولة حفظ في IndexedDB أيضاً
                        db.settings.put({ key: 'currentWarehouseId', value: warehouseId })
                            .then(() => {
                                console.log('🔍 Debug: Warehouse ID also saved to IndexedDB:', warehouseId);
                            })
                            .catch(error => {
                                console.error('خطأ في حفظ معرف المخزن في IndexedDB:', error);
                            });
                        
                        window.location.replace('stock.html');
                    } else {
                        alert(currentLang === 'ar' ? 'حدث خطأ أثناء التسجيل' : 'An error occurred during registration');
                    }
                });
            });
        }
    </script>
    
    <script src="ai-core.js"></script>
    <script src="ai-validation.js"></script>
    <script src="ai-speech.js"></script>
    <script src="ai-database.js"></script>
    <script src="ai-ui.js"></script>
    <script src="ai-assistant.js"></script>
</body>
</html>
