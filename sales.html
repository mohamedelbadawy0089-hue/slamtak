<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="سلامتك - طلباتي - تتبع طلبات الصيدلية">
    <title>سلامتك - طلباتي</title>
    <link href="libs/cairo.css" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6C63FF;
            --accent: #00D4AA;
            --accent-dark: #00B894;
            --danger: #FF4757;
            --warning: #FFA502;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: #0a0a1a;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Background */
        .bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0, 212, 170, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(108, 99, 255, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a1a 0%, #0d0d2b 50%, #0a0a1a 100%);
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0;
            animation: orb-drift 20s ease-in-out infinite;
        }
        .orb-1 { width: 350px; height: 350px; background: rgba(0, 212, 170, 0.1); top: -80px; left: -80px; }
        .orb-2 { width: 250px; height: 250px; background: rgba(108, 99, 255, 0.08); bottom: -40px; right: -40px; animation-delay: -10s; }

        @keyframes orb-drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(25px, -35px) scale(1.1); }
            66% { transform: translate(-15px, 15px) scale(0.95); }
        }

        /* Navbar */
        .navbar {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 28px;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text-primary);
        }

        .nav-brand-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }

        .nav-brand-name {
            font-size: 18px; font-weight: 800;
            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.8));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .nav-actions { display: flex; align-items: center; gap: 10px; }

        .nav-btn {
            padding: 8px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            background: var(--glass-bg);
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        .nav-btn-accent {
            border-color: rgba(0, 212, 170, 0.4);
            background: rgba(0, 212, 170, 0.1);
            color: var(--accent);
        }
        .nav-btn-accent:hover { background: rgba(0, 212, 170, 0.2); color: var(--accent); }

        /* Main Layout */
        .main-layout {
            position: relative; z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        /* Page Header */
        .page-header {
            margin-bottom: 32px;
            animation: fade-up 0.7s ease-out;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header h1 {
            font-size: 26px; font-weight: 800;
            margin-bottom: 6px;
        }

        .page-header p {
            font-size: 14px; color: var(--text-muted);
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
            animation: fade-up 0.7s ease-out 0.1s both;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            display: flex; align-items: center; gap: 14px;
            backdrop-filter: blur(10px);
        }

        .stat-icon { font-size: 28px; }

        .stat-label {
            font-size: 12px; color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 20px; font-weight: 800;
            color: var(--accent);
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex; gap: 8px; flex-wrap: wrap;
            margin-bottom: 22px;
            animation: fade-up 0.7s ease-out 0.15s both;
        }

        .filter-tab {
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-secondary);
            font-family: 'Cairo', sans-serif;
            font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.3s;
        }

        .filter-tab.active {
            background: rgba(0, 212, 170, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-tab:hover:not(.active) {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        /* Orders List */
        .orders-list {
            display: flex; flex-direction: column; gap: 16px;
            animation: fade-up 0.7s ease-out 0.2s both;
        }

        /* Order Card */
        .order-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            backdrop-filter: blur(15px);
            transition: all 0.3s;
        }

        .order-card:hover {
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .order-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 22px;
            cursor: pointer;
            user-select: none;
        }

        .order-header-right {
            display: flex; align-items: center; gap: 14px;
        }

        .order-num {
            font-size: 13px; font-weight: 700;
            color: var(--text-muted);
        }

        .order-date {
            font-size: 14px; color: var(--text-secondary);
        }

        .order-total {
            font-size: 18px; font-weight: 800;
            color: var(--accent);
        }

        .order-header-left {
            display: flex; align-items: center; gap: 12px;
        }

        /* Status Badge */
        .status-badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px; font-weight: 700;
            white-space: nowrap;
        }

        .status-pending {
            background: rgba(255, 165, 2, 0.15);
            border: 1px solid rgba(255, 165, 2, 0.35);
            color: var(--warning);
        }

        .status-approved {
            background: rgba(0, 212, 170, 0.15);
            border: 1px solid rgba(0, 212, 170, 0.35);
            color: var(--accent);
        }

        .status-rejected {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.35);
            color: var(--danger);
        }

        .status-delivered {
            background: rgba(108, 99, 255, 0.15);
            border: 1px solid rgba(108, 99, 255, 0.35);
            color: var(--primary);
        }

        /* Chevron */
        .chevron {
            font-size: 14px; color: var(--text-muted);
            transition: transform 0.3s;
            display: inline-block;
        }

        .order-card.open .chevron { transform: rotate(180deg); }

        /* Order Body (collapsible) */
        .order-body {
            display: none;
            padding: 0 22px 20px;
            border-top: 1px solid var(--glass-border);
        }

        .order-card.open .order-body { display: block; }

        .order-items-title {
            font-size: 13px; font-weight: 700;
            color: var(--text-muted);
            margin: 16px 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .order-items-list {
            display: flex; flex-direction: column; gap: 8px;
        }

        .order-item-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
        }

        .order-item-info {
            display: flex; align-items: center; gap: 10px;
        }

        .order-item-emoji { font-size: 22px; }

        .order-item-name {
            font-size: 14px; font-weight: 600;
        }

        .order-item-qty {
            font-size: 13px; color: var(--text-muted);
        }

        .order-item-price {
            font-size: 14px; font-weight: 700;
            color: var(--accent);
        }

        /* Order Footer Actions */
        .order-footer {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--glass-border);
        }

        .order-footer-total {
            font-size: 15px; font-weight: 700;
        }

        .order-footer-total span {
            color: var(--accent);
            font-size: 18px;
        }

        .order-action-btns {
            display: flex; gap: 8px;
        }

        .action-btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
        }

        .btn-reorder {
            background: rgba(0, 212, 170, 0.15);
            border: 1px solid rgba(0, 212, 170, 0.4);
            color: var(--accent);
        }

        .btn-reorder:hover {
            background: rgba(0, 212, 170, 0.25);
            transform: translateY(-1px);
        }

        .btn-cancel {
            background: rgba(255, 71, 87, 0.12);
            border: 1px solid rgba(255, 71, 87, 0.35);
            color: var(--danger);
        }

        .btn-cancel:hover {
            background: rgba(255, 71, 87, 0.2);
            transform: translateY(-1px);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 20px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }

        .empty-cta {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 28px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #0a0a1a;
            font-family: 'Cairo', sans-serif;
            font-size: 14px; font-weight: 700;
            text-decoration: none;
            transition: all 0.3s;
        }

        .empty-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 170, 0.4);
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(10, 10, 26, 0.95);
            border: 1px solid var(--accent);
            color: white; padding: 12px 24px;
            border-radius: 30px; font-size: 14px; font-weight: 600;
            z-index: 999; transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 30px rgba(0, 212, 170, 0.2);
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Responsive */
        @media (max-width: 600px) {
            .navbar { padding: 14px 16px; }
            .main-layout { padding: 20px 14px; }
            .order-header { padding: 14px 16px; }
            .order-body { padding: 0 16px 16px; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .order-total { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="bg-canvas"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="toast" id="toast"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="store.html" class="nav-brand">
            <div class="nav-brand-icon">💊</div>
            <span class="nav-brand-name">سلامتك</span>
        </a>
        <div class="nav-actions">
            <a href="A.html" class="nav-btn">← الرئيسية</a>
            <a href="products.html" class="nav-btn">📦 منتجاتي</a>
            <a href="purchase-invoice-enhanced.html" class="nav-btn nav-btn-accent">🧾 فواتير المشتريات</a>
            <a href="add-new-product.html" class="nav-btn">➕ إضافة منتج جديد</a>
            <a href="store.html" class="nav-btn">🏪 تصفح المنتجات</a>
        </div>
    </nav>

    <!-- Main -->
    <div class="main-layout">

        <!-- Page Header -->
        <div class="page-header">
            <h1>📋 طلباتي</h1>
            <p>تتبع جميع طلباتك المقدمة ومعرفة حالتها</p>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div>
                    <div class="stat-label">إجمالي الطلبات</div>
                    <div class="stat-value" id="statTotal">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div>
                    <div class="stat-label">قيد المعالجة</div>
                    <div class="stat-value" id="statPending" style="color: var(--warning)">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div>
                    <div class="stat-label">مقبولة</div>
                    <div class="stat-value" id="statApproved" style="color: var(--accent)">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div>
                    <div class="stat-label">إجمالي المشتريات</div>
                    <div class="stat-value" id="statSpent">0</div>
                </div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all" onclick="setFilter(this)">الكل</button>
            <button class="filter-tab" data-filter="قيد المعالجة" onclick="setFilter(this)">⏳ قيد المعالجة</button>
            <button class="filter-tab" data-filter="مقبول" onclick="setFilter(this)">✅ مقبولة</button>
            <button class="filter-tab" data-filter="مرفوض" onclick="setFilter(this)">❌ مرفوضة</button>
            <button class="filter-tab" data-filter="تم التوصيل" onclick="setFilter(this)">🚚 تم التوصيل</button>
        </div>

        <!-- Orders List -->
        <div class="orders-list" id="ordersList"></div>

    </div>

    <script>
        let allOrders = [];
        let currentFilter = 'all';

        function loadOrders() {
            allOrders = JSON.parse(localStorage.getItem('pharmacyOrders') || '[]');
            // Sort newest first
            allOrders.sort((a, b) => b.id - a.id);
            renderStats();
            renderOrders();
        }

        function renderStats() {
            const pending = allOrders.filter(o => o.status === 'قيد المعالجة').length;
            const approved = allOrders.filter(o => o.status === 'مقبول' || o.status === 'تم التوصيل').length;
            const totalSpent = allOrders
                .filter(o => o.status !== 'مرفوض')
                .reduce((s, o) => s + (o.total || 0), 0);

            document.getElementById('statTotal').textContent = allOrders.length;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statApproved').textContent = approved;
            document.getElementById('statSpent').textContent = totalSpent.toFixed(0) + ' ج.م';
        }

        function setFilter(btn) {
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderOrders();
        }

        function renderOrders() {
            const container = document.getElementById('ordersList');
            let filtered = allOrders;

            if (currentFilter !== 'all') {
                filtered = allOrders.filter(o => o.status === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🛍️</div>
                        <h3>${currentFilter === 'all' ? 'لا توجد طلبات بعد' : 'لا توجد طلبات في هذه الحالة'}</h3>
                        <p>${currentFilter === 'all' ? 'ابدأ بتصفح المنتجات وتقديم طلبك الأول' : 'جرب تغيير الفلتر لعرض طلبات أخرى'}</p>
                        ${currentFilter === 'all' ? '<a href="store.html" class="empty-cta">🏪 تصفح المنتجات</a>' : ''}
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((order, idx) => {
                const statusClass = getStatusClass(order.status);
                const itemsHtml = (order.items || []).map(item => `
                    <div class="order-item-row">
                        <div class="order-item-info">
                            <span class="order-item-emoji">${item.emoji || '💊'}</span>
                            <div>
                                <div class="order-item-name">${item.name}</div>
                                <div class="order-item-qty">× ${item.qty}</div>
                            </div>
                        </div>
                        <div class="order-item-price">${(item.price * item.qty).toFixed(2)} ج.م</div>
                    </div>
                `).join('');

                const canCancel = order.status === 'قيد المعالجة';

                return `
                    <div class="order-card" id="order-${order.id}">
                        <div class="order-header" onclick="toggleOrder('${order.id}')">
                            <div class="order-header-right">
                                <div>
                                    <div class="order-num">طلب #${String(order.id).slice(-6)}</div>
                                    <div class="order-date">📅 ${order.date || '—'}</div>
                                </div>
                            </div>
                            <div class="order-header-left">
                                <div class="order-total">${(order.total || 0).toFixed(2)} ج.م</div>
                                <span class="status-badge ${statusClass}">${order.status}</span>
                                <span class="chevron">▼</span>
                            </div>
                        </div>
                        <div class="order-body">
                            <div class="order-items-title">المنتجات (${(order.items || []).length} عنصر)</div>
                            <div class="order-items-list">${itemsHtml}</div>
                            <div class="order-footer">
                                <div class="order-footer-total">
                                    الإجمالي: <span>${(order.total || 0).toFixed(2)} ج.م</span>
                                </div>
                                <div class="order-action-btns">
                                    <button class="action-btn btn-reorder" onclick="reorder('${order.id}')">🔁 إعادة الطلب</button>
                                    ${canCancel ? `<button class="action-btn btn-cancel" onclick="cancelOrder('${order.id}')">❌ إلغاء</button>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getStatusClass(status) {
            switch (status) {
                case 'قيد المعالجة': return 'status-pending';
                case 'مقبول': return 'status-approved';
                case 'مرفوض': return 'status-rejected';
                case 'تم التوصيل': return 'status-delivered';
                default: return 'status-pending';
            }
        }

        function toggleOrder(id) {
            const card = document.getElementById('order-' + id);
            if (card) card.classList.toggle('open');
        }

        function cancelOrder(id) {
            if (!confirm('هل أنت متأكد من إلغاء هذا الطلب؟')) return;
            const idx = allOrders.findIndex(o => String(o.id) === String(id));
            if (idx === -1) return;
            allOrders[idx].status = 'مرفوض';
            localStorage.setItem('pharmacyOrders', JSON.stringify(allOrders));
            renderStats();
            renderOrders();
            showToast('تم إلغاء الطلب');
        }

        function reorder(id) {
            const order = allOrders.find(o => String(o.id) === String(id));
            if (!order) return;
            // Save items to reorder in localStorage so store.html can pick them up
            localStorage.setItem('reorderItems', JSON.stringify(order.items || []));
            showToast('🔁 جاري التوجيه لإعادة الطلب...');
            setTimeout(() => window.location.href = 'store.html', 1200);
        }

        let toastTimer;
        function showToast(msg, duration = 2500) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), duration);
        }

        // Init
        loadOrders();

        // Auto-refresh every 30s to pick up status changes from warehouse
        setInterval(() => {
            loadOrders();
        }, 30000);
    </script>
</body>
</html>
