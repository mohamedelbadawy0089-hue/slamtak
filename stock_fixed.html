<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المخزن - إدارة الأدوية</title>
    <script src="libs/xlsx.full.min.js"></script>
    <script src="libs/inputmask.min.js"></script>
    <script src="libs/supabase.min.js"></script>
    <!-- Pako library for compression -->
    <script src="libs/pako.min.js"></script>
    <!-- Dexie.js for IndexedDB -->
    <script src="libs/dexie.js"></script>
    <!-- AG-Grid Community CDN -->
    <script src="libs/ag-grid-community.min.js"></script>
    <link rel="stylesheet" href="libs/ag-grid.css" />
    <link rel="stylesheet" href="libs/ag-theme-alpine.css" />
    <style>
    /* التنسيقات الأساسية: خلفية بيضاء، نصوص سوداء، لمسات خضراء للمخزن */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #ffffff;
        color: #000000;
        padding: 20px;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        border-bottom: 2px solid #e0e0e0;
        margin-bottom: 30px;
    }

    h1 {
        font-size: 24px;
        color: #000000;
    }

    /* النموذج (Form) الخاص بإضافة دواء جديد */
    .form-section {
        background-color: #ffffff;
        border: 1px solid #cccccc;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
    }

    .form-section h2 {
        font-size: 18px;
        margin-bottom: 15px;
        color: #2e7d32; /* لمسة خضراء هادئة للعناوين */
    }

    .form-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 15px;
        align-items: flex-start;
    }

    .form-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 80px;
        margin: 0;
        padding: 0;
    }

    /* تحديد min-width مناسبة لكل نوع من أنواع الحقول */
    .form-group:has(input#tradeName) {
        min-width: 200px;
    }

    .form-group:has(input#batchNumber) {
        min-width: 120px;
    }

    .form-group:has(input#quantity) {
        min-width: 80px;
    }

    .form-group:has(input#price) {
        min-width: 100px;
    }

    .form-group:has(input#discount) {
        min-width: 100px;
    }

    .form-group:has(input#inp-p-sell-discount) {
        min-width: 100px;
    }

    .form-group:has(input#inp-p-net-price) {
        min-width: 100px;
    }

    .form-group:has(input#productionDate) {
        min-width: 120px;
    }

    .form-group:has(input#expiryDate) {
        min-width: 120px;
    }

    .form-group:has(input#category) {
        min-width: 150px;
    }

    .form-group input {
        margin: 0;
        padding: 10px;
        border-radius: 0;
    }

    .form-group input:first-child {
        border-radius: 4px 0 0 4px;
    }

    .form-group input:last-child {
        border-radius: 0 4px 4px 0;
    }

    .form-group label {
        font-size: 14px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    .form-group input {
        padding: 15px;
        border: 1px solid #cccccc;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
        min-height: 50px;
        transition: all 0.3s ease;
        background-color: #ffffff;
    }

    .form-group input:focus {
        border-color: #2e7d32;
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
    }

    .form-group input:hover {
        border-color: #4caf50;
    }

    .form-group input[readonly] {
        background-color: #f5f5f5;
        cursor: not-allowed;
    }

    .form-group input[required] {
        border-left: 3px solid #2e7d32;
    }

    .form-group input#batchNumber {
        max-width: 120px;
        min-width: 120px;
    }

    .form-group input#quantity {
        max-width: 80px;
        min-width: 80px;
    }

    .form-group input#price {
        max-width: 100px;
        min-width: 100px;
    }

    .form-group input#discount {
        max-width: 70px;
        min-width: 70px;
    }

    .form-group input#inp-p-sell-discount {
        max-width: 70px;
        min-width: 70px;
    }

    .form-group input#inp-p-net-price {
        max-width: 100px;
        min-width: 100px;
    }

    .form-group input#productionDate,
    .form-group input#expiryDate {
        max-width: 120px;
        min-width: 120px;
        font-family: 'Courier New', monospace;
        letter-spacing: 1px;
    }

    .form-group input#productionDate::placeholder,
    .form-group input#expiryDate::placeholder {
        color: #999;
        font-family: 'Courier New', monospace;
        letter-spacing: 1px;
    }

    .form-group input#productionDate {
        max-width: 120px;
        min-width: 120px;
    }

    .form-group input#expiryDate {
        max-width: 120px;
        min-width: 120px;
    }

    .form-group input#tradeName {
        max-width: 450px;
        min-width: 450px;
    }

    /* الأزرار باللون الأخضر الخاص بالمخازن */
    .btn-green {
        background-color: #2e7d32;
        color: #ffffff;
        border: none;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
        width: auto;
        box-shadow: 0 2px 4px rgba(46, 125, 50, 0.2);
    }

    .btn-green:hover {
        background-color: #1b5e20;
        box-shadow: 0 4px 8px rgba(46, 125, 50, 0.3);
        transform: translateY(-2px);
    }

    .btn-green:active {
        transform: translateY(0);
        box-shadow: 0 2px 4px rgba(46, 125, 50, 0.2);
    }

    /* أدوات البحث والفلترة السريعة لضعف الإنترنت */
    .search-section {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
    }

    .search-input {
        flex: 0 1 400px;
        padding: 15px 20px;
        border: 2px solid #2e7d32;
        border-radius: 25px;
        font-size: 14px;
        outline: none;
        background-color: #f5f9f5;
        box-shadow: 0 2px 5px rgba(46, 125, 50, 0.1);
        transition: all 0.3s ease;
    }

    .search-input:focus {
        border-color: #1b5e20;
        background-color: #ffffff;
        box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2);
    }

    /* حاوية جدول AG-Grid */
    .table-container {
        width: 100%;
        border: 1px solid #cccccc;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        position: relative;
    }



    .btn-delete {
        background-color: transparent;
        color: #c62828;
        border: 1px solid #c62828;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
    }

    .btn-delete:hover {
        background-color: #ffebee;
    }

    .btn-edit {
        background-color: #2196f3;
        color: #ffffff;
        border: none;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-left: 5px;
    }

    .btn-edit:hover {
        background-color: #1976d2;
        box-shadow: 0 2px 4px rgba(33, 150, 243, 0.3);
    }

    .btn-save {
        background-color: #4caf50;
        color: #ffffff;
        border: none;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-left: 5px;
    }

    .btn-save:hover {
        background-color: #388e3c;
        box-shadow: 0 2px 4px rgba(76, 175, 80, 0.3);
    }

    .btn-cancel {
        background-color: #ff9800;
        color: #ffffff;
        border: none;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-left: 5px;
    }

    .btn-cancel:hover {
        background-color: #f57c00;
        box-shadow: 0 2px 4px rgba(255, 152, 0, 0.3);
    }

    /* تنسيقات قسم الرفع الجماعي */
    .bulk-upload-section {
        background: #f9f9f9;
        border: 2px dashed #2e7d32;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        margin-top: 0;
        text-align: center;
        max-width: 200px;
        margin-left: auto;
        margin-right: auto;
    }

    /* تنسيقات حاوية الأقسام الجماعية */
    .bulk-sections-container {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .bulk-sections-container .bulk-upload-section,
    .bulk-sections-container .bulk-paste-section {
        flex: 1;
        min-width: 300px;
        margin-left: 0;
        margin-right: 0;
    }

    .bulk-upload-section h2 {
        color: #2e7d32;
        font-size: 18px;
        margin-bottom: 5px;
    }

    .bulk-upload-section p {
        color: #666;
        font-size: 14px;
        margin-bottom: 15px;
    }

    .upload-btn {
        background: #2e7d32;
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .upload-btn:hover {
        background: #1b5e20;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
    }

    .file-input {
        display: none;
    }

    .progress-section {
        display: none;
        margin-top: 20px;
    }

    .progress-bar {
        width: 100%;
        height: 30px;
        background: #e0e0e0;
        border-radius: 15px;
        overflow: hidden;
        margin-bottom: 10px;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #2e7d32, #4caf50);
        width: 0%;
        transition: width 0.3s ease;
    }

    .progress-text {
        text-align: center;
        color: #666;
        font-size: 14px;
    }

    .preview-section {
        display: none;
        margin-top: 20px;
    }

    .preview-section h3 {
        color: #2e7d32;
        font-size: 18px;
        margin-bottom: 15px;
    }

    .btn-confirm {
        background: #4caf50;
        color: white;
        border: none;
        padding: 10px 25px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 15px;
        transition: all 0.3s ease;
    }

    .btn-confirm:hover {
        background: #388e3c;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
    }

    .btn-cancel {
        background: #f44336;
        color: white;
        border: none;
        padding: 10px 25px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 15px;
        margin-right: 10px;
        transition: all 0.3s ease;
    }

    .btn-cancel:hover {
        background: #d32f2f;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
    }

    .success-message {
        display: none;
        background: #e8f5e9;
        border: 2px solid #4caf50;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        margin-top: 20px;
    }

    .success-message h2 {
        color: #4caf50;
        font-size: 20px;
        margin-bottom: 10px;
    }

    .success-message p {
        color: #666;
        font-size: 16px;
    }

    .error-message {
        display: none;
        background: #ffebee;
        border: 2px solid #c62828;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        margin-top: 20px;
    }

    .error-message h2 {
        color: #c62828;
        font-size: 20px;
        margin-bottom: 10px;
    }

    .error-message p {
        color: #666;
        font-size: 16px;
    }

    /* تنسيقات مربعات اللصق الجماعي */
    .bulk-paste-box,
    .bulk-column-paste {
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        border: 1px solid #cccccc;
        border-radius: 6px;
        padding: 5px;
        font-size: 16px;
        color: #1b5e20;
        transition: all 0.3s ease;
        height: 35px;
        width: 100%;
        box-sizing: border-box;
    }

    /* تحديد min-width مناسبة لكل نوع من أنواع حقول اللصق الجماعي */
    .bulk-column-paste[data-field="batchNumber"] {
        min-width: 100px;
    }

    .bulk-paste-box[data-column="name"] {
        min-width: 200px;
    }

    .bulk-column-paste[data-field="quantity"] {
        min-width: 80px;
    }

    .bulk-paste-box[data-column="price"] {
        min-width: 100px;
    }

    .bulk-column-paste[data-field="purchase_discount"] {
        min-width: 100px;
    }

    .bulk-paste-box[data-column="discount"] {
        min-width: 100px;
    }

    .bulk-column-paste[data-field="production_date"] {
        min-width: 120px;
    }

    .bulk-column-paste[data-field="expiry_date"] {
        min-width: 120px;
    }

    .bulk-column-paste[data-field="category"] {
        min-width: 150px;
    }

    .bulk-paste-box:focus,
    .bulk-column-paste:focus {
        background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
        border-color: #2e7d32;
        box-shadow: 0 4px 8px rgba(46, 125, 50, 0.3);
        outline: none;
    }

    .bulk-paste-box::placeholder,
    .bulk-column-paste::placeholder {
        color: #66bb6a;
        font-style: italic;
    }
    </style>
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center;">
    <div>
        <h1>لوحة تحكم المخزن م-01</h1>
        <span style="font-weight: bold; color: #2e7d32; display: block; margin-bottom: 5px;">إدارة المخزون الحالي</span>
        <div style="display: flex; gap: 10px; margin-top: 8px;">
            <span style="padding: 6px 12px; background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%); color: white; border-radius: 6px; font-weight: bold; font-size: 14px; box-shadow: 0 2px 4px rgba(76, 175, 80, 0.3);">إجمالي السيرفر: <span id="total-products-count">0</span></span>
        </div>
    </div>
    <div style="display: flex; gap: 10px;">
        <a id="logoutLink" href="#" onclick="StockApp.handleLogout(event)" style="padding: 10px 20px; font-size: 14px; background: linear-gradient(135deg, #c62828 0%, #b71c1c 100%); color: white; border: 3px solid #8b0000; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 8px rgba(198, 40, 40, 0.3); transition: all 0.3s ease; text-decoration: none; display: inline-block;">🚪 خروج</a>
    </div>
    </header>

    <!-- منطقة اللصق السريع -->
    <section class="form-section" style="margin-bottom: 10px; padding: 0;">
    <h3 style="margin-bottom: 5px; color: #2e7d32; font-size: 16px;">📋 اللصق السريع</h3>
    <div id="pasteStatusAbove" style="margin-bottom: 5px; padding: 8px; background-color: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; display: none; font-size: 12px; color: #856404; font-weight: bold;">⏳ جاري اللصق...</div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
        <textarea id="quickPasteArea" placeholder="الصق البيانات من Excel هنا (Ctrl+V) — يُبنى الجدول تلقائياً..." style="flex: 1; max-width: 400px; height: 50px; padding: 6px; border: 2px solid #cccccc; border-radius: 6px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px; resize: vertical;"></textarea>
    </div>
    <div id="saveStatusMessage" style="margin-top: 5px; padding: 8px; background-color: #e8f5e9; border: 1px solid #4caf50; border-radius: 6px; display: none; font-size: 12px; color: #2e7d32;"></div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px;">
<button id="savePastedDataButton" style="padding: 10px 20px; font-size: 14px; background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%); color: white; border: 2px solid #2e7d32; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 8px rgba(76, 175, 80, 0.3); transition: all 0.3s ease; opacity: 0.95;">💾 حفظ البيانات</button>


        <button onclick="deleteAllWarehouseDrugs()" style="padding: 10px 20px; font-size: 14px; background: linear-gradient(135deg, #d32f2f 0%, #c62828 100%); color: white; border: 3px solid #b71c1c; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 8px rgba(211, 47, 47, 0.3); transition: all 0.3s ease;">🗑️ مسح كافة منتجات المخزن الحالى</button>
    </div>
    
    <!-- شريط التقدم للصق السريع -->
    <div id="pastePreviewNote" style="margin:5px 0;font-size:12px;color:#2e7d32;font-weight:bold;"></div>

    <div id="pasteProgressBar" style="margin-top: 5px; display: none; max-width: 400px;">
        <div style="background-color: #e0e0e0; border-radius: 6px; overflow: hidden; height: 10px;">
            <div id="pasteProgressFill" style="background: linear-gradient(90deg, #2196f3 0%, #1976d2 100%); height: 100%; width: 0%; transition: width 0.3s ease;"></div>
        </div>
        <div id="pasteProgressText" style="margin-top: 3px; font-size: 12px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">جاري معالجة البيانات... 0%</div>
    </div>
    <!-- شريط التقدم للرفع الجماعي -->
    <div id="bulkProgressSection" style="margin-top: 5px; display: none; max-width: 400px;">
        <div style="background-color: #e0e0e0; border-radius: 6px; overflow: hidden; height: 10px;">

    <div style="background-color: white; padding: 20px; border-radius: 10px; text-align: center;">

        0% { transform: rotate(0deg); }

    <script>
        // Supabase Client
        const supabaseUrl = 'https://zywoyqfkaeodlslsveah.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5d295cWZrYWVvZGxzcHN2ZWFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTk2MDM4ODcsImV4cCI6MjAzNTE3OTg4N30.SNyU5p2-Y2xJ2zAsY-9m322M4o0s3j1N1JqY-8t3_9o';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // Dexie (IndexedDB) Database
        const db = new Dexie('SlamtakStockDB');
        db.version(1).stores({
            drugs: '++id, tradeName, batchNumber, expiry_date, warehouse_id',
            warehouses: 'id, name',
            lastSync: 'id, timestamp'
        });

        // Global state
        let gridApi;
        let allDrugs = [];
        let currentOffset = 0;
        const BATCH_SIZE = 1000;
        let isLoadingMore = false;
        let hasMoreData = true;
        let isSearchMode = false;
        let searchDebounceTimer = null;
        const SEARCH_DEBOUNCE_DELAY = 300;
        let currentSearchTerm = null;
        let currentBatchNumber = null;
        let currentTradeName = null;
        let quickPastePreviewData = null;

        // Main application logic
        const StockApp = {
            async init() {
                this.showLoadingSpinner(true);
                try {
                    await this.checkAuth();
                    const warehouseId = localStorage.getItem('currentWarehouseId');
                    if (warehouseId) {
                        await this.syncData(warehouseId);
                        this.setupEventListeners();
                        this.initAGGrid();
                        await this.loadInitialData();
                    } else {
                        // window.location.href = 'login.html'; // Temporarily disabled for debugging
                        console.warn("Redirect to login.html disabled for debugging. currentWarehouseId not found.");
                    }
                } catch (error) {
                    console.error("Initialization failed:", error);
                    alert("فشل تهيئة التطبيق. يرجى المحاولة مرة أخرى.");
                } finally {
                    this.showLoadingSpinner(false);
                }
            },

            async checkAuth() {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error || !session) {
                    // window.location.href = 'login.html'; // Temporarily disabled for debugging
                    console.warn("Redirect to login.html disabled for debugging. User not authenticated.");
                    throw new Error("User not authenticated.");
                }
                const user = session.user;
                localStorage.setItem('currentWarehouseId', user.user_metadata.warehouse_id || 'm-01');
            },

            async handleLogout(event) {
                event.preventDefault();
                await supabaseClient.auth.signOut();
                localStorage.clear();
                window.location.href = 'login.html';
            },

            async syncData(warehouseId) {
                const lastSync = await db.lastSync.get(warehouseId) || { timestamp: 0 };
                const { data, error } = await supabaseClient
                    .from('drugs')
                    .select('*')
                    .eq('warehouse_id', warehouseId)
                    .gt('updated_at', new Date(lastSync.timestamp).toISOString());

                if (error) throw error;

                if (data.length > 0) {
                    await db.drugs.bulkPut(data);
                    await db.lastSync.put({ id: warehouseId, timestamp: Date.now() });
                }
            },

            setupEventListeners() {
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('input', () => filterDrugs());
                }

                const quickPasteArea = document.getElementById('quickPasteArea');
                if (quickPasteArea) {
                    quickPasteArea.addEventListener('paste', (event) => {
                        event.preventDefault();
                        const pasteData = (event.clipboardData || window.clipboardData).getData('text');
                        previewPastedTableForAnySheet(pasteData);
                    });
                }
            },

            initAGGrid() {
                const gridDiv = document.getElementById('agGridContainer');
                if (!gridDiv) return;

                const gridOptions = {
                    columnDefs: this.getColumnDefs(),
                    rowData: [],
                    defaultColDef: {
                        sortable: true,
                        filter: true,
                        resizable: true,
                        editable: true,
                    },
                    domLayout: 'autoHeight',
                    onGridReady: (params) => {
                        gridApi = params.api;
                    },
                    onCellValueChanged: this.handleCellEdit.bind(this),
                };
                new agGrid.Grid(gridDiv, gridOptions);
            },

            getColumnDefs() {
                return [
                    { headerName: "الاسم التجاري", field: "tradeName", flex: 2, minWidth: 200 },
                    { headerName: "رقم التشغيلة", field: "batchNumber", flex: 1, minWidth: 120 },
                    { headerName: "الكمية", field: "quantity", flex: 0.5, minWidth: 80, cellEditor: 'agNumberCellEditor' },
                    { headerName: "سعر الجمهور", field: "public_price", flex: 1, minWidth: 100, valueFormatter: p => p.value ? p.value.toFixed(2) : '0.00' },
                    { headerName: "خصم الشراء (%)", field: "purchase_discount", flex: 1, minWidth: 100 },
                    { headerName: "خصم البيع (%)", field: "sales_discount", flex: 1, minWidth: 100 },
                    { headerName: "السعر الصافي", field: "net_price", flex: 1, minWidth: 100, valueFormatter: p => p.value ? p.value.toFixed(2) : '0.00', editable: false },
                    { headerName: "تاريخ الإنتاج", field: "production_date", flex: 1, minWidth: 120 },
                    { headerName: "تاريخ الانتهاء", field: "expiry_date", flex: 1, minWidth: 120 },
                    { headerName: "الصنف", field: "category", flex: 1, minWidth: 150 },
                    {
                        headerName: 'إجراءات',
                        field: 'actions',
                        cellRenderer: params => {
                            const eDiv = document.createElement('div');
                            eDiv.innerHTML = `<button class="btn-delete">حذف</button>`;
                            const deleteButton = eDiv.querySelector('.btn-delete');
                            deleteButton.addEventListener('click', async () => {
                                if (confirm(`هل أنت متأكد من حذف ${params.data.tradeName}؟`)) {
                                    await this.deleteDrug(params.data.id);
                                }
                            });
                            return eDiv;
                        },
                        editable: false,
                        sortable: false,
                        filter: false,
                        flex: 1,
                        minWidth: 100
                    }
                ];
            },

            async loadInitialData() {
                const warehouseId = localStorage.getItem('currentWarehouseId');
                allDrugs = await db.drugs.where('warehouse_id').equals(warehouseId).toArray();
                this.renderTable(allDrugs);
                this.updateTotalProductsCount();
            },

            renderTable(data) {
                if (gridApi) {
                    gridApi.setRowData(data);
                }
            },

            updateTotalProductsCount() {
                const countElement = document.getElementById('total-products-count');
                if (countElement) {
                    countElement.textContent = allDrugs.length;
                }
            },

            async handleCellEdit(params) {
                const { id, ...updatedData } = params.data;
                try {
                    await db.drugs.update(id, updatedData);
                    const { error } = await supabaseClient.from('drugs').update(updatedData).eq('id', id);
                    if (error) throw error;
                } catch (error) {
                    console.error("Failed to save cell edit:", error);
                    alert("فشل حفظ التعديل.");
                    // Revert change in UI
                    params.node.setDataValue(params.colDef.field, params.oldValue);
                }
            },

            async deleteDrug(drugId) {
                try {
                    await db.drugs.delete(drugId);
                    const { error } = await supabaseClient.from('drugs').delete().eq('id', drugId);
                    if (error) throw error;
                    allDrugs = allDrugs.filter(d => d.id !== drugId);
                    this.renderTable(allDrugs);
                    this.updateTotalProductsCount();
                } catch (error) {
                    console.error("Failed to delete drug:", error);
                    alert("فشل حذف الدواء.");
                }
            },

            showLoadingSpinner(show) {
                const spinner = document.getElementById('loading-spinner');
                if (spinner) {
                    spinner.style.display = show ? 'flex' : 'none';
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => StockApp.init());

        // Utility functions
        async function fetchWarehouseDrugs(append = false, searchTerm = null, batchNumber = null, tradeName = null) {
            isLoadingMore = true;
            StockApp.showLoadingSpinner(true);
            let query = supabaseClient
                .from('drugs')
                .select('*', { count: 'exact' })
                .eq('warehouse_id', localStorage.getItem('currentWarehouseId'))
                .order('tradeName', { ascending: true })
                .range(currentOffset, currentOffset + BATCH_SIZE - 1);

            if (searchTerm) {
                query = query.ilike('tradeName', `%${searchTerm}%`);
            }
            if (batchNumber) {
                query = query.eq('batchNumber', batchNumber);
            }
            if (tradeName) {
                query = query.eq('tradeName', tradeName);
            }

            const { data, error, count } = await query;

            if (error) {
                console.error('Error fetching drugs:', error);
                isLoadingMore = false;
                StockApp.showLoadingSpinner(false);
                return [];
            }

            hasMoreData = data.length === BATCH_SIZE;
            currentOffset += data.length;

            if (append) {
                allDrugs = [...allDrugs, ...data];
            } else {
                allDrugs = data;
            }

            isLoadingMore = false;
            StockApp.showLoadingSpinner(false);
            return data;
        }

        function renderTable(data, columns = null, append = false) {
            if (!gridApi) return;
            if (columns) {
                gridApi.setColumnDefs(columns);
            }
            if (append) {
                gridApi.applyTransaction({ add: data });
            } else {
                gridApi.setRowData(data);
            }
            StockApp.updateTotalProductsCount();
        }

        async function deleteAllWarehouseDrugs() {
            if (!confirm('هل أنت متأكد من أنك تريد حذف جميع الأدوية في هذا المخزن؟ لا يمكن التراجع عن هذا الإجراء.')) {
                return;
            }
            StockApp.showLoadingSpinner(true);
            try {
                await db.drugs.where('warehouse_id').equals(localStorage.getItem('currentWarehouseId')).delete();
                const { error } = await supabaseClient.from('drugs').delete().eq('warehouse_id', localStorage.getItem('currentWarehouseId'));
                if (error) throw error;
                allDrugs = [];
                renderTable([]);
                alert('تم حذف جميع الأدوية بنجاح.');
            } catch (error) {
                console.error('Failed to delete all drugs:', error);
                alert('فشل حذف جميع الأدوية.');
            } finally {
                StockApp.showLoadingSpinner(false);
            }
        }

        function previewPastedTableForAnySheet(rawText) {
            const hasTabs = rawText.includes('\t');
            let headers, rows;
            if (hasTabs) {
                const parsed = parseExcelPasteRaw(rawText);
                headers = parsed.headers;
                rows = parsed.rows;
            } else {
                const parsed = parseQuickPasteText(rawText);
                headers = parsed.headers;
                rows = parsed.rows;
            }

            if (!headers || headers.length === 0) {
                alert('لم يتم التعرف على البيانات.');
                return;
            }

            const colDefs = headers.map((h, i) => ({
                headerName: h || `Column ${i + 1}`,
                field: `col_${i}`,
                resizable: true,
                flex: 1
            }));

            const rowData = rows.map(row => {
                const obj = {};
                headers.forEach((h, i) => {
                    obj[`col_${i}`] = row[i] || '';
                });
                return obj;
            });

            quickPastePreviewData = { headers, rows };
            renderTable(rowData, colDefs);
            document.getElementById('savePastedDataButton').style.display = 'inline-block';
        }

        function parseExcelPasteRaw(raw) {
            const lines = raw.trim().split('\n');
            const headers = lines[0].split('\t').map(h => h.trim());
            const rows = lines.slice(1).map(line => line.split('\t').map(cell => cell.trim()));
            return { headers, rows };
        }

        function parseQuickPasteText(text) {
            const lines = text.trim().split('\n');
            const delimiter = [',', ';', '|'].find(d => lines[0].includes(d)) || ',';
            const headers = lines[0].split(delimiter).map(h => h.trim());
            const rows = lines.slice(1).map(line => line.split(delimiter).map(cell => cell.trim()));
            return { headers, rows, delimiter, hasHeader: true };
        }

        async function savePastedDataToSupabase(rows, columnMapping) {
            const warehouseId = localStorage.getItem('currentWarehouseId');
            if (!warehouseId) {
                alert('لم يتم تحديد المخزن.');
                return;
            }

            const drugsToSave = rows.map(row => {
                const drug = { warehouse_id: warehouseId };
                for (const [field, index] of Object.entries(columnMapping)) {
                    drug[field] = row[index];
                }
                // Calculate net_price
                const price = parseFloat(drug.public_price) || 0;
                const discount = parseFloat(drug.sales_discount) || 0;
                drug.net_price = (price * (1 - discount / 100)).toFixed(2);
                return drug;
            });

            const { error } = await supabaseClient.from('drugs').insert(drugsToSave);
            if (error) {
                console.error('Error saving pasted data:', error);
                alert('فشل حفظ البيانات الملصقة.');
            } else {
                alert('تم حفظ البيانات الملصقة بنجاح.');
                await fetchWarehouseDrugs(); // Refresh data
                renderTable(allDrugs, StockApp.getColumnDefs());
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const saveButton = document.getElementById('savePastedDataButton');
            if (saveButton) {
                saveButton.addEventListener('click', async function() {
                    if (quickPastePreviewData) {
                        // This is a simplified mapping. A real implementation would need a UI to map columns.
                        const columnMapping = { 
                            tradeName: 0, 
                            batchNumber: 1, 
                            quantity: 2,
                            public_price: 3,
                            purchase_discount: 4,
                            sales_discount: 5,
                            production_date: 6,
                            expiry_date: 7,
                            category: 8
                        };
                        await savePastedDataToSupabase(quickPastePreviewData.rows, columnMapping);
                    }
                });
            }
        });

        async function filterDrugs() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput.value.trim();

            if (searchDebounceTimer) {
                clearTimeout(searchDebounceTimer);
            }

            searchDebounceTimer = setTimeout(async () => {
                isSearchMode = searchTerm.length > 0;
                currentOffset = 0;
                hasMoreData = true;
                currentSearchTerm = searchTerm;
                
                const newData = await fetchWarehouseDrugs(false, searchTerm);
                renderTable(newData);
            }, SEARCH_DEBOUNCE_DELAY);
        }
    </script>
