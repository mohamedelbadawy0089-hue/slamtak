<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="سلامتك - بوابة الصيدليات لتصفح المنتجات وطلب الأدوية">
    <title>سلامتك - بوابة الصيدلية</title>
    <link href="libs/cairo.css" rel="stylesheet">
    <script src="navigation.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6C63FF;
            --accent: #00D4AA;
            --accent-dark: #00B894;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: #0a0a1a;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        .bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0, 212, 170, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(108, 99, 255, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a1a 0%, #0d0d2b 50%, #0a0a1a 100%);
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0;
            animation: orb-drift 20s ease-in-out infinite;
        }
        .orb-1 { width: 350px; height: 350px; background: rgba(0, 212, 170, 0.12); top: -80px; left: -80px; }
        .orb-2 { width: 250px; height: 250px; background: rgba(108, 99, 255, 0.08); bottom: -40px; right: -40px; animation-delay: -10s; }

        @keyframes orb-drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(25px, -35px) scale(1.1); }
            66% { transform: translate(-15px, 15px) scale(0.95); }
        }

        /* ===== Pharmacy Catalog Layout ===== */
        .main-layout {
            position: relative; z-index: 1;
            min-height: 100vh;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 32px;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }

        .nav-brand {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none; color: var(--text-primary);
        }

        .nav-brand-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }

        .nav-brand-name {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.8));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .nav-actions {
            display: flex; align-items: center; gap: 12px;
        }

        .nav-back-btn {
            padding: 8px 18px;
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            background: var(--glass-bg);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px; font-weight: 600;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
        }
        .nav-back-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

        .cart-nav-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 18px;
            border: 1px solid rgba(0, 212, 170, 0.4);
            border-radius: 30px;
            background: rgba(0, 212, 170, 0.1);
            color: var(--accent);
            font-family: 'Cairo', sans-serif;
            font-size: 14px; font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .cart-nav-btn:hover { background: rgba(0, 212, 170, 0.2); }
        
        .logout-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 71, 87, 0.4);
            border-radius: 30px;
            background: rgba(255, 71, 87, 0.1);
            color: #FF4757;
            font-family: 'Cairo', sans-serif;
            font-size: 14px; font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .logout-btn:hover { background: rgba(255, 71, 87, 0.2); }

        .cart-badge {
            background: #FF4757; color: white;
            border-radius: 50%; width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
        }

        /* ===== Content Area ===== */
        .content-area {
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Page Header */
        .page-header {
            margin-bottom: 32px;
            animation: fade-up 0.8s ease-out;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header h1 {
            font-size: 28px; font-weight: 800;
            margin-bottom: 8px;
        }

        .page-header p {
            font-size: 15px; color: var(--text-muted);
        }

        /* Search & Filter */
        .search-filter-row {
            display: flex; gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            animation: fade-up 0.8s ease-out 0.1s both;
        }

        .search-input-wrap {
            flex: 1; min-width: 240px;
            position: relative;
        }

        .search-input-wrap input {
            width: 100%; padding: 13px 44px 13px 54px; /* Space for search icon (right) and mic (left) */
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 14px; outline: none;
            transition: border-color 0.3s;
        }

        .search-input-wrap input:focus { border-color: var(--accent); }
        .search-input-wrap input::placeholder { color: var(--text-muted); }

        .search-icon {
            position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 18px; color: var(--text-muted);
            pointer-events: none;
        }


        .categories {
            display: flex; gap: 8px; flex-wrap: wrap;
        }

        .cat-btn {
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-secondary);
            font-family: 'Cairo', sans-serif;
            font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.3s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: rgba(0, 212, 170, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ===== Products Grid ===== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            animation: fade-up 0.8s ease-out 0.2s both;
        }

        .product-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(15px);
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 212, 170, 0.4);
            box-shadow: 0 12px 40px rgba(0, 212, 170, 0.12);
        }

        .product-emoji {
            font-size: 48px; text-align: center;
            height: 80px; display: flex;
            align-items: center; justify-content: center;
        }

        .product-badge {
            display: inline-flex; align-items: center;
            padding: 3px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 700;
            background: rgba(0, 212, 170, 0.15);
            color: var(--accent);
            border: 1px solid rgba(0, 212, 170, 0.2);
            width: fit-content;
        }

        .product-name {
            font-size: 15px; font-weight: 700;
            color: var(--text-primary); margin: 0;
        }

        .product-desc {
            font-size: 12px; color: var(--text-muted);
            line-height: 1.5; margin: 0;
        }

        .product-footer {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .product-price {
            font-size: 18px; font-weight: 800;
            color: var(--accent);
        }

        .add-btn {
            width: 36px; height: 36px;
            border-radius: 50%; border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
        }

        .add-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 6px 20px rgba(0, 212, 170, 0.4);
        }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 60px 20px;
            color: var(--text-muted); font-size: 16px;
            grid-column: 1 / -1;
        }

        /* ===== Cart Drawer ===== */
        .cart-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            backdrop-filter: blur(4px);
        }

        .cart-overlay.open { display: block; }

        .cart-drawer {
            position: fixed; top: 0; left: 0;
            width: 380px; max-width: 100%;
            height: 100%; background: #0d0d2b;
            border-left: 1px solid var(--glass-border);
            z-index: 201;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex; flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }

        .cart-drawer.open { transform: translateX(0); }

        .cart-header {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .cart-title {
            font-size: 20px; font-weight: 700;
        }

        .cart-close-btn {
            width: 36px; height: 36px;
            border-radius: 50%; border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-secondary);
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }

        .cart-close-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        .cart-items-list {
            flex: 1; display: flex; flex-direction: column; gap: 12px;
        }

        .cart-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px; border-radius: var(--radius-sm);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
        }

        .cart-item-emoji { font-size: 28px; }

        .cart-item-info { flex: 1; }
        .cart-item-name { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .cart-item-price { font-size: 13px; color: var(--accent); font-weight: 600; }

        .cart-qty {
            display: flex; align-items: center; gap: 8px;
        }

        .qty-btn {
            width: 28px; height: 28px;
            border-radius: 50%; border: 1px solid var(--glass-border);
            background: var(--glass-bg); color: var(--text-primary);
            font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }

        .qty-btn:hover {
            background: var(--accent); border-color: var(--accent);
            color: #0a0a1a;
        }

        .qty-num {
            font-size: 15px; font-weight: 700;
            min-width: 24px; text-align: center;
        }

        .cart-empty-msg {
            text-align: center; padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .cart-footer {
            border-top: 1px solid var(--glass-border);
            padding-top: 20px; margin-top: 20px;
        }

        .cart-total-row {
            display: flex; justify-content: space-between;
            font-size: 16px; font-weight: 700;
            margin-bottom: 16px;
        }

        .cart-total-amount { color: var(--accent); font-size: 20px; }

        .checkout-btn {
            width: 100%; padding: 14px;
            border: none; border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #0a0a1a;
            font-family: 'Cairo', sans-serif;
            font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 170, 0.4);
        }

        /* ===== Toast Notification ===== */
        .toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(10, 10, 26, 0.95);
            border: 1px solid var(--accent);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px; font-weight: 600;
            z-index: 999;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 30px rgba(0, 212, 170, 0.2);
            pointer-events: none;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ===== Responsive ===== */
        /* ===== Gemini Voice UI (Dark Theme) ===== */
        .gemini-mic-container {
            position: absolute;
            left: 8px; /* Inside the input on the left */
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .gemini-mic-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #0a0a1a;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(108, 99, 255, 0.3);
        }


        .gemini-mic-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.5);
        }

        .gemini-mic-btn.listening {
            animation: pulse-gemini 1.5s infinite;
            background: #ff4757;
            color: white;
        }

        @keyframes pulse-gemini {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        .gemini-waves-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .gemini-mic-btn.listening + .gemini-waves-container {
            display: flex;
        }

        .gemini-wave {
            position: absolute;
            border: 2px solid var(--accent);
            border-radius: 50%;
            width: 100%;
            height: 100%;
            animation: gemini-ripple 2s infinite;
            opacity: 0;
        }

        @keyframes gemini-ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        #speechBubble {
            position: absolute;
            bottom: 60px;
            right: 0;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: white;
            white-space: nowrap;
            display: none;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 212, 170, 0.15);
            color: var(--accent);
            border: 1px solid rgba(0, 212, 170, 0.3);
        }

        .stock-low {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border-color: rgba(255, 71, 87, 0.3);
        }

        @media (max-width: 768px) {
            .navbar { padding: 14px 16px; }
            .content-area { padding: 20px 16px; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .cart-drawer { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="bg-canvas"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Cart Overlay -->
    <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

    <!-- Cart Drawer -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2 class="cart-title">🛒 سلة الطلبات</h2>
            <button class="cart-close-btn" onclick="closeCart()">✕</button>
        </div>
        <div class="cart-items-list" id="cartItemsList">
            <div class="cart-empty-msg">السلة فارغة 🛍️</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>الإجمالي</span>
                <span class="cart-total-amount" id="cartTotalAmount">0.00 ج.م</span>
            </div>
            <button class="checkout-btn" onclick="submitOrder()">تقديم الطلب →</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <div class="main-layout">
        <!-- Navbar -->
        <nav class="navbar">
            <a href="A.html" class="nav-brand">
                <div class="nav-brand-icon">💊</div>
                <span class="nav-brand-name">سلامتك</span>
            </a>
            <div class="nav-actions">
                <a href="A.html" class="nav-back-btn">← الرئيسية</a>
                <a href="sales.html" class="nav-back-btn" style="color: #FFD700; border-color: rgba(255,215,0,0.3);">📋 طلباتي</a>
                <button class="logout-btn" onclick="handleLogout()">🚪 خروج</button>
                <button class="cart-nav-btn" onclick="openCart()">
                    🛒 السلة
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </nav>

        <!-- Content -->
        <div class="content-area">
            <!-- Page Header -->
            <div class="page-header">
                <h1>🏪 تصفح المنتجات</h1>
                <p>اطلب احتياجاتك من أفضل مخازن التوزيع مباشرةً</p>
            </div>

            <!-- Search & Categories -->
            <div class="search-filter-row">
                <div class="search-input-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="ابحث عن دواء أو اطلب (مثلاً: 10 بانادول)..." oninput="filterProducts()">
                    
                    <!-- Gemini Voice Interface -->
                    <div class="gemini-mic-container">
                        <div id="speechBubble">...استمع الآن</div>
                        <button id="portalMic" class="gemini-mic-btn" title="الطلب الصوتي الذكي">🎤</button>
                        <div class="gemini-waves-container">
                            <div class="gemini-wave" style="animation-delay: 0s"></div>
                            <div class="gemini-wave" style="animation-delay: 0.5s"></div>
                            <div class="gemini-wave" style="animation-delay: 1s"></div>
                        </div>
                    </div>
                </div>
                <div class="categories">
                    <button class="cat-btn active" data-cat="all" onclick="filterByCategory(this)">الكل</button>
                    <button class="cat-btn" data-cat="medicines" onclick="filterByCategory(this)">أدوية 💊</button>
                    <button class="cat-btn" data-cat="supplies" onclick="filterByCategory(this)">مستلزمات 🩺</button>
                    <button class="cat-btn" data-cat="vitamins" onclick="filterByCategory(this)">فيتامينات 🌿</button>
                    <button class="cat-btn" data-cat="cosmetics" onclick="filterByCategory(this)">تجميل 💄</button>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="products-grid" id="productsGrid">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>

    <!-- Supabase Singleton لضمان مشاركة الجلسة بين الصفحات -->
    <script src="supabase-singleton.js"></script>
    <script src="libs/supabase.min.js"></script>
    <script>
        // ===== SUPABASE CONFIGURATION - ANON PUBLIC KEY =====
        const SUPABASE_URL = 'https://iksjhjxwphmvthryfeae.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0DUy2mtXS6m5S8PwTDAANQ_XWlzbu0G';
        
        // Initialize Supabase client - Use SupabaseSingleton for shared session
        let supabaseClient = null;
        try {
            // استخدام SupabaseSingleton لضمان مشاركة الجلسة بين الصفحات
            supabaseClient = SupabaseSingleton.getClient();
            
            if (!supabaseClient) {
                console.error('❌ SupabaseSingleton.getClient() returned null');
                alert('❌ خطأ في الاتصال بالسحابة: Supabase Client غير متاح');
            } else {
                console.log('✅ Supabase client initialized via SupabaseSingleton');
            }
            
            // متغير global للمستخدم الحالي
            window.currentUserEmail = null;
        } catch (e) {
            console.error('❌ Failed to initialize Supabase:', e);
        }
        
        // جلب بريد المستخدم الحالي من الجلسة
        async function getCurrentUserEmail() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            return user?.email || null;
        }
        
        // ===== Session Check - قراءة من localStorage كمرجع نهائي =====
        async function checkSession() {
            console.log('🔍 Checking session from localStorage...');
            
            const userEmail = localStorage.getItem('slamtak-user-email');
            const userId = localStorage.getItem('slamtak-user-id');
            const authStatus = localStorage.getItem('slamtak-auth-status');
            
            if (userEmail && userId && authStatus === 'authenticated') {
                console.log('✅ تم العثور على الجلسة في localStorage:', userEmail);
                window.currentUserEmail = userEmail;
                window.currentUser = { email: userEmail, id: userId };
                
                // Silent Refresh في الخلفية - إذا فشل لا يفعل شيئاً
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) {
                        console.log('✅ Silent Refresh ناجح');
                    } else {
                        console.warn('⚠️ Silent Refresh فشل - لكن المستخدم يبقى في حسابه');
                    }
                } catch (error) {
                    console.warn('⚠️ Silent Refresh فشل بسبب الإنترنت - لكن المستخدم يبقى في حسابه');
                }
                
                return { email: userEmail, id: userId };
            }
            
            // لا توجد جلسة في localStorage
            console.log('❌ لا توجد جلسة في localStorage');
            return null;
        }
        
        // ===== تسجيل الخروج =====
        async function handleLogout() {
            if (!confirm('هل أنت متأكد من تسجيل الخروج؟')) return;
            
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) {
                    console.error('❌ Logout error:', error);
                }
                console.log('✅ Logged out successfully');
            } catch (e) {
                console.error('❌ Exception during logout:', e);
            }
            
            // مسح بيانات localStorage
            localStorage.removeItem('slamtak-user-email');
            localStorage.removeItem('slamtak-user-id');
            localStorage.removeItem('slamtak-auth-status');
            
            // التحويل إلى صفحة تسجيل الدخول يدوياً فقط (عند الضغط على زر تسجيل الخروج)
            window.location.replace('sales.html');
        }
        
        // ===== Product Data =====
        let allProducts = [];
        let currentUser = null;
        
        // Load products from Supabase - Fetch from both warehouse_inventory and warehouse_custom_products
        async function loadProducts() {
            if (!supabaseClient) {
                console.error('❌ Supabase client not initialized');
                return;
            }
            
            try {
                console.log('🔄 Loading inventory from new multi-tenant architecture...');
                
                // 1. Fetch Master-linked Inventory
                const { data: invData, error: err1 } = await supabaseClient
                    .from('warehouse_inventory')
                    .select('*, master_products(*)')
                    .limit(1000);

                if (err1) throw err1;

                // 2. Fetch Custom Products
                const { data: customData, error: err2 } = await supabaseClient
                    .from('warehouse_custom_products')
                    .select('*')
                    .limit(1000);

                if (err2) throw err2;

                allProducts = [];

                // Process Master Items
                if (invData) {
                    invData.forEach(item => {
                        if (item.master_products) {
                            allProducts.push({
                                id: item.id,
                                warehouse_id: item.warehouse_id,
                                type: 'master',
                                name: item.master_products.name_en,
                                desc: item.master_products.active_ingredient || '',
                                price: item.price,
                                stock: item.quantity || 0,
                                emoji: '💊',
                                category: 'medicines'
                            });
                        }
                    });
                }

                // Process Custom Items
                if (customData) {
                    customData.forEach(item => {
                        allProducts.push({
                            id: item.id,
                            warehouse_id: item.warehouse_id,
                            type: 'custom',
                            name: item.name_en,
                            desc: item.active_ingredient || '',
                            price: item.price,
                            stock: item.quantity || 0,
                            emoji: '📦',
                            category: 'medicines'
                        });
                    });
                }

                console.log(`✅ Loaded ${allProducts.length} products total.`);
                
                // Update cache after successful load
                localStorage.setItem('products', JSON.stringify(allProducts));
                
                renderProducts(getFiltered());
            } catch (e) {
                console.error('❌ Exception loading products:', e);
                showCloudError('خطأ في تحميل البيانات: ' + e.message);
            }
        }

        
        // Helper to show cloud error
        function showCloudError(message) {
            const grid = document.getElementById('productsGrid');
            if (grid) {
                grid.innerHTML = '<div class="empty-state">❌ ' + message + '<br><button onclick="location.reload()" style="margin-top:20px; padding:10px 20px; background: var(--accent); border:none; border-radius:8px; color:#0a0a1a; font-weight:700; cursor:pointer;">إعادة تحميل</button></div>';
            }
            console.error(message);
        }

        loadProducts();

        let cart = [];
        let activeCategory = 'all';

        // ===== Render Products =====
        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = '<div class="empty-state">😕 لا توجد منتجات مطابقة<br><small style="color:var(--text-muted);font-size:13px;margin-top:8px;display:block;">تأكد من وجود منتجات في قاعدة البيانات</small></div>';
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="product-card" data-id="${p.id}" data-cat="${p.category}">
                    <span class="stock-badge ${p.stock < 10 ? 'stock-low' : ''}">📦 المتاح: ${p.stock}</span>
                    <div class="product-emoji">${p.emoji}</div>
                    <span class="product-badge">${getCategoryLabel(p.category)}</span>
                    <h3 class="product-name">${p.name}</h3>
                    <p class="product-desc">${p.desc}</p>
                    <div class="product-footer">
                        <span class="product-price">${p.price} ج.م</span>
                        <button class="add-btn" onclick="addToCart(${p.id})" title="أضف للسلة">+</button>
                    </div>
                </div>
            `).join('');
        }

        function getCategoryLabel(cat) {
            const labels = { medicines: 'أدوية', supplies: 'مستلزمات', vitamins: 'فيتامينات', cosmetics: 'تجميل' };
            return labels[cat] || cat;
        }

        function getFiltered() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            return allProducts.filter(p => {
                const matchCat = activeCategory === 'all' || p.category === activeCategory;
                const matchSearch = !q || p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q);
                return matchCat && matchSearch;
            });
        }

        function filterProducts() { renderProducts(getFiltered()); }

        function filterByCategory(btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeCategory = btn.dataset.cat;
            filterProducts();
        }

        // ===== Cart Logic with Stock Support =====
        function addToCart(id, qty = 1) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            // Check if product has fixed quantity (always available, doesn't decrease)
            const isFixedQuantity = product.quantity_type === 'fixed';
            
            if (!isFixedQuantity) {
                // For decreasing products: Check Stock Availability
                if (product.stock <= 0) {
                    showToast(`❌ عذراً، ${product.name} غير متوفر حالياً`);
                    return null;
                }

                if (qty > product.stock) {
                    showToast(`⚠️ الكمية المتاحة من ${product.name} هي ${product.stock} فقط`);
                    qty = product.stock; // Add all available
                }
            }

            const existing = cart.find(i => i.id === id);
            if (existing) {
                if (!isFixedQuantity) {
                    // For decreasing products: check stock limit
                    if (existing.qty + qty > product.stock) {
                        showToast(`⚠️ لا يمكن إضافة المزيد، المتاح ${product.stock} فقط`);
                        return null;
                    }
                }
                // For fixed products: unlimited addition
                existing.qty += qty;
            } else {
                cart.push({ ...product, qty: qty });
            }

            updateCartBadge();
            renderCartItems();
            showToast(`✅ تمت إضافة ${qty}x ${product.name} للسلة`);
            return product;
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            
            // For fixed quantity products: no stock limit check, just update quantity
            // For decreasing products: check if exceeding stock would happen
            const product = allProducts.find(p => p.id === id);
            const isFixedQuantity = product && product.quantity_type === 'fixed';
            
            const newQty = item.qty + delta;
            
            // For decreasing products, check stock limit when increasing
            if (delta > 0 && !isFixedQuantity && product && newQty > product.stock) {
                showToast(`⚠️ لا يمكن تجاوز الكمية المتاحة: ${product.stock}`);
                return;
            }
            
            item.qty = newQty;
            if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            updateCartBadge();
            renderCartItems();
        }

        function updateCartBadge() {
            const total = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cartBadge').textContent = total;
        }

        function renderCartItems() {
            const list = document.getElementById('cartItemsList');
            const totalEl = document.getElementById('cartTotalAmount');

            if (cart.length === 0) {
                list.innerHTML = '<div class="cart-empty-msg">السلة فارغة 🛍️</div>';
                totalEl.textContent = '0.00 ج.م';
                return;
            }

            let total = 0;
            list.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `
                    <div class="cart-item">
                        <span class="cart-item-emoji">${item.emoji}</span>
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${(item.price * item.qty).toFixed(2)} ج.م</div>
                        </div>
                        <div class="cart-qty">
                            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">−</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.textContent = total.toFixed(2) + ' ج.م';
        }

        function openCart() {
            document.getElementById('cartDrawer').classList.add('open');
            document.getElementById('cartOverlay').classList.add('open');
        }

        function closeCart() {
            document.getElementById('cartDrawer').classList.remove('open');
            document.getElementById('cartOverlay').classList.remove('open');
        }

        function submitOrder() {
            if (cart.length === 0) {
                showToast('⚠️ السلة فارغة، أضف منتجات أولاً');
                return;
            }
            // Save order with full details
            const orders = JSON.parse(localStorage.getItem('pharmacyOrders')) || [];
            const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
            const newOrder = {
                id: Date.now(),
                items: cart.map(i => ({
                    id: i.id,
                    name: i.name,
                    price: i.price,
                    qty: i.qty,
                    emoji: i.emoji
                })),
                total: total,
                date: new Date().toLocaleString('ar-EG'),
                status: 'قيد المعالجة',
                pharmacyEmail: window.currentUserEmail || localStorage.getItem('slamtak-user-email') || 'غير محدد'
            };
            orders.push(newOrder);
            localStorage.setItem('pharmacyOrders', JSON.stringify(orders));

            cart = [];
            updateCartBadge();
            renderCartItems();
            closeCart();
            showToast(`✅ تم إرسال طلبك بنجاح! إجمالي: ${total.toFixed(2)} ج.م`, 4000);
        }

        // ===== Toast =====
        let toastTimer;
        function showToast(msg, duration = 2500) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), duration);
        }

        // ============================================
        // Gemini Portal Voice Commerce Integration
        // ============================================
        class PortalVoiceSearch {
            constructor() {
                this.micBtn = document.getElementById('portalMic');
                this.searchInput = document.getElementById('searchInput');
                this.isListening = false;
                this.recognition = null;
                
                if (this.micBtn) this.init();
            }

            async init() {
                this.setupSpeech();
                
                // Load Gemini Processor
                if (window.GeminiVoiceProcessor) {
                    this.geminiProcessor = new window.GeminiVoiceProcessor();
                }

                this.micBtn.addEventListener('click', () => this.toggle());
            }

            setupSpeech() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return;

                this.recognition = new SR();
                this.recognition.lang = 'en-US'; 
                this.recognition.continuous = false;
                this.recognition.interimResults = false;

                this.recognition.onstart = () => {
                    this.isListening = true;
                    this.micBtn.classList.add('listening');
                    this.showSpeechBubble('...استمع الآن');
                };

                this.recognition.onresult = async (event) => {
                    const transcripts = Array.from(event.results[0]).map(res => res.transcript);
                    this.showSpeechBubble(transcripts[0]);
                    await this.processResults(transcripts);
                };

                this.recognition.onerror = () => { this.stop(); };
                this.recognition.onend = () => {
                    this.isListening = false;
                    this.micBtn.classList.remove('listening');
                    setTimeout(() => this.hideSpeechBubble(), 2000);
                };
            }

            toggle() { this.isListening ? this.stop() : this.start(); }
            start() { try { if (this.recognition) this.recognition.start(); } catch (e) {} }
            stop() { if (this.recognition) this.recognition.stop(); }

            showSpeechBubble(text) {
                const bubble = document.getElementById('speechBubble');
                if (bubble) { bubble.textContent = text; bubble.style.display = 'block'; }
            }

            hideSpeechBubble() {
                const bubble = document.getElementById('speechBubble');
                if (bubble) bubble.style.display = 'none';
            }

            async processResults(transcripts) {
                console.log('🗣️ Portal Voice Input:', transcripts);
                
                if (!this.geminiProcessor) return;

                // Format products for Gemini context
                const contextEntities = allProducts.map(p => ({
                    tradeName: p.name,
                    id: p.id
                }));

                const result = await this.geminiProcessor.processVoiceInput(transcripts, contextEntities, 'portal-order');
                
                if (result && result.confidence > 0.4) {
                    if (result.action === 'order' && result.quantity > 0) {
                        const matchedProduct = allProducts.find(p => p.name === result.correctedDrug);
                        if (matchedProduct) {
                            const added = addToCart(matchedProduct.id, result.quantity);
                            if (added) {
                                this.showSpeechBubble(`✅ تم إضافة ${result.quantity}x ${result.correctedDrug}`);
                                // Open cart automatically
                                setTimeout(() => openCart(), 500);
                            }
                        }
                    } else {
                        // Regular Search mode
                        this.searchInput.value = result.correctedDrug || transcripts[0];
                        this.searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                        this.showSpeechBubble('بحث عن: ' + this.searchInput.value);
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            window.portalVoiceSearch = new PortalVoiceSearch();
            await loadProducts();

            // Hard cleanup: Ensure no AI Assistant Panels exist
            const killPanel = () => {
                const panels = document.querySelectorAll('[id*="ai-assistant"], [class*="ai-assistant"], [id*="aiAssistant"], [class*="aiAssistant"], #ai-ui-root');
                panels.forEach(p => {
                    p.style.display = 'none';
                    p.remove();
                });
            };
            killPanel();
            setTimeout(killPanel, 500);
            setTimeout(killPanel, 2000); // Guard against very late injectors
        });
    </script>

    <script src="gemini-voice-processor.js"></script>
</body>
