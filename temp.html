            const directTestBtnata = {};
            console.log('🔍 Analyzing message:', message);
            
            // تنظيف الرسالة أولاً
            let cleanedirectTestBtnMessage = message.toLowerCase().trim();
            
            // استخراج اسم المنتج - أنماط محسنة ودقيقة
            const namePatterns = [
                // نمط: كلمات مفاتيح واضحة متبوعة باسم المنتج
                /(?:أدخل|ضيف|أضف|سجل|اكتب|مطلوب|عايز|أريد|ابغى|محتاج|بغى)\s+([^\directTestBtn\s]+?)(?:\s+(?:بسعر|ب|سعر|كمية|بتاريخ|من|في|$))/i,

                // نمط: أي كلمات غير رقمية طويلة
                /([^\directTestBtn\s]{4,}(?:\s+[^\directTestBtn\s]+)*?)(?:\s+(?:بسعر|ب|سعر|كمية|بتاريخ|من|في|$))/i,
                // نمط: كلمات منتجات شائعة
                /(?:بانادول|أموكسيلين|فيتامين|إيبوبروفين|باراسيتامول|أسبرين|أدوية|دواء|قرص|كبسولة|شراب|حقنة|مرهم|كريم|بخاخ|قطرة)(?:\s+([^\directTestBtn\s]+))?/i
