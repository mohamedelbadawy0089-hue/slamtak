<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج بالصوت - Supabase</title>
    <link href="libs/cairo.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input.filled {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .mic-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: transform 0.2s;
            font-family: 'Cairo', sans-serif;
        }

        .mic-button:hover {
            transform: translateY(-2px);
        }

        .mic-button.recording {
            background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .submit-button:hover {
            background: #45a049;
        }

        .submit-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .transcript {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 60px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 إضافة منتج بالصوت</h1>
        
        <div class="transcript" id="transcript">انقر على الميكروفون وقل: "اسم المنتج، الكمية، السعر"</div>

        <form id="productForm">
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="productName" placeholder="مثال: باراسيتامول" required>
            </div>

            <div class="form-group">
                <label>الكمية</label>
                <input type="number" id="quantity" placeholder="مثال: 100" required>
            </div>

            <div class="form-group">
                <label>السعر (جنيه)</label>
                <input type="number" step="0.01" id="price" placeholder="مثال: 25.50" required>
            </div>

            <div class="form-group">
                <label>الخصم (%)</label>
                <input type="number" step="0.01" id="discount" placeholder="مثال: 10" value="0">
            </div>

            <div class="form-group">
                <label>تاريخ الإنتاج</label>
                <input type="date" id="productionDate">
            </div>

            <div class="form-group">
                <label>تاريخ الانتهاء</label>
                <input type="date" id="expiryDate">
            </div>

            <button type="button" class="mic-button" id="micButton">
                🎤 ابدأ التسجيل الصوتي
            </button>

            <button type="submit" class="submit-button" id="submitButton">
                ✅ إضافة المنتج
            </button>
        </form>

        <div id="status"></div>
    </div>

    <script src="libs/supabase.min.js"></script>
    <script>
        // ===== Supabase Configuration =====
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // ضع رابط Supabase هنا
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'; // ضع المفتاح هنا
        
        // استيراد createClient من Supabase
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // ===== Elements =====
        const micButton = document.getElementById('micButton');
        const productForm = document.getElementById('productForm');
        const transcriptDiv = document.getElementById('transcript');
        const statusDiv = document.getElementById('status');
        const productNameInput = document.getElementById('productName');
        const quantityInput = document.getElementById('quantity');
        const priceInput = document.getElementById('price');
        const discountInput = document.getElementById('discount');
        const productionDateInput = document.getElementById('productionDate');
        const expiryDateInput = document.getElementById('expiryDate');
        const submitButton = document.getElementById('submitButton');

        // ===== Speech Recognition =====
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-EG';
            recognition.continuous = false;
            recognition.interimResults = false;
        }

        // ===== Voice Input Handler =====
        micButton.addEventListener('click', () => {
            if (!recognition) {
                showStatus('المتصفح لا يدعم التعرف الصوتي', 'error');
                return;
            }

            if (isRecording) {
                recognition.stop();
                return;
            }

            recognition.start();
            isRecording = true;
            micButton.classList.add('recording');
            micButton.textContent = '🔴 جاري التسجيل...';
            transcriptDiv.textContent = 'استمع...';
        });

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            transcriptDiv.textContent = `النص: ${transcript}`;
            parseVoiceInput(transcript);
        };

        recognition.onend = () => {
            isRecording = false;
            micButton.classList.remove('recording');
            micButton.textContent = '🎤 ابدأ التسجيل الصوتي';
        };

        recognition.onerror = (event) => {
            showStatus('خطأ في التعرف الصوتي: ' + event.error, 'error');
            isRecording = false;
            micButton.classList.remove('recording');
            micButton.textContent = '🎤 ابدأ التسجيل الصوتي';
        };

        // ===== Parse Voice Input =====
        function parseVoiceInput(text) {
            // تنظيف النص
            text = text.replace(/،/g, ',').replace(/\s+/g, ' ').trim();
            
            // استخراج البيانات
            const parts = text.split(',').map(p => p.trim());
            
            if (parts.length >= 3) {
                // الاسم
                productNameInput.value = parts[0];
                productNameInput.classList.add('filled');
                
                // الكمية
                const qty = extractNumber(parts[1]);
                if (qty) {
                    quantityInput.value = qty;
                    quantityInput.classList.add('filled');
                }
                
                // السعر (دعم الكسور - تجميع الرقم الصحيح والكسر)
                const priceValue = extractPrice(parts[2]);
                if (priceValue) {
                    priceInput.value = priceValue.toFixed(2);
                    priceInput.classList.add('filled');
                }

                // الخصم (اختياري)
                if (parts.length >= 4) {
                    const discountValue = extractNumber(parts[3]);
                    if (discountValue) {
                        discountInput.value = discountValue;
                        discountInput.classList.add('filled');
                    }
                }

                showStatus('تم ملء البيانات بنجاح! ✅', 'success');
                
                // إرسال تلقائي بعد 2 ثانية
                setTimeout(() => {
                    if (validateForm()) {
                        submitToSupabase();
                    }
                }, 2000);
            } else {
                showStatus('قل: اسم المنتج، الكمية، السعر، الخصم (اختياري)', 'info');
            }
        }

        // ===== Extract Number =====
        function extractNumber(text) {
            // تحويل الأرقام العربية للإنجليزية
            const arabicToEnglish = {
                '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4',
                '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9'
            };
            
            text = text.replace(/[٠-٩]/g, d => arabicToEnglish[d]);
            
            // استخراج الرقم
            const match = text.match(/\d+/);
            return match ? parseInt(match[0]) : null;
        }

        // ===== Extract Price (with decimals) =====
        function extractPrice(text) {
            // تحويل الأرقام العربية
            const arabicToEnglish = {
                '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4',
                '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9'
            };
            
            text = text.replace(/[٠-٩]/g, d => arabicToEnglish[d]);
            
            // دعم الكسور: "25 و 50" أو "25.50" أو "25,50"
            text = text.replace(/\s*و\s*/g, '.');
            text = text.replace(/,/g, '.');
            
            // استخراج الرقم مع الكسور وتجميعهم
            const match = text.match(/\d+\.?\d*/);
            if (match) {
                const price = parseFloat(match[0]);
                // تأكد من تجميع الرقم الصحيح والكسر في قيمة واحدة
                return Math.round(price * 100) / 100; // تقريب لرقمين عشريين
            }
            return null;
        }

        // ===== Validate Form =====
        function validateForm() {
            if (!productNameInput.value || !quantityInput.value || !priceInput.value) {
                showStatus('يرجى ملء جميع الحقول', 'error');
                return false;
            }
            return true;
        }

        // ===== Submit to Supabase =====
        async function submitToSupabase() {
            submitButton.disabled = true;
            showStatus('جاري الإضافة...', 'info');

            // تجميع السعر (الرقم الصحيح + الكسر) في متغير واحد
            const finalPrice = parseFloat(priceInput.value);
            const roundedPrice = Math.round(finalPrice * 100) / 100;

            // تجهيز البيانات للإرسال
            const productData = {
                name: productNameInput.value.trim(),
                quantity: parseInt(quantityInput.value),
                price: roundedPrice, // السعر المجمع
                discount: parseFloat(discountInput.value) || 0,
                production_date: productionDateInput.value || null,
                expiry_date: expiryDateInput.value || null,
                created_at: new Date().toISOString()
            };

            console.log('📦 البيانات المرسلة:', productData);

            try {
                // إرسال البيانات إلى Supabase
                const { data, error } = await supabase
                    .from('products')
                    .insert([productData])
                    .select();

                // معالجة الأخطاء
                if (error) {
                    console.error('❌ خطأ Supabase:', error);
                    throw error;
                }

                console.log('✅ تم الإضافة بنجاح:', data);
                showStatus('✅ تم الإضافة بنجاح!', 'success');
                
                // مسح النموذج
                productForm.reset();
                discountInput.value = '0';
                document.querySelectorAll('input').forEach(input => {
                    input.classList.remove('filled');
                });
                
                transcriptDiv.textContent = 'انقر على الميكروفون لإضافة منتج جديد';
                
            } catch (error) {
                console.error('❌ خطأ في الإضافة:', error);
                showStatus('❌ خطأ: ' + error.message, 'error');
            } finally {
                submitButton.disabled = false;
            }
        }

        // ===== Form Submit Handler =====
        productForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (validateForm()) {
                submitToSupabase();
            }
        });

        // ===== Show Status =====
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }

        // ===== Input Change Handlers =====
        [productNameInput, quantityInput, priceInput, discountInput, productionDateInput, expiryDateInput].forEach(input => {
            input.addEventListener('input', () => {
                if (input.value) {
                    input.classList.add('filled');
                } else {
                    input.classList.remove('filled');
                }
            });
        });

        // ===== تحقق من اتصال Supabase عند تحميل الصفحة =====
        window.addEventListener('DOMContentLoaded', async () => {
            console.log('🔗 جاري التحقق من اتصال Supabase...');
            try {
                const { data, error } = await supabase.from('products').select('count');
                if (error) throw error;
                console.log('✅ الاتصال بـ Supabase ناجح!');
            } catch (error) {
                console.error('❌ فشل الاتصال بـ Supabase:', error);
                showStatus('⚠️ تحقق من إعدادات Supabase', 'error');
            }
        });
    </script>
</body>
</html>
