<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device=device-width, initial-scale=1.0">
<title>سلامتك - دخول المخزن</title>
<style>
body{margin:0;padding:0;background:#f8f9fa;color:#000;font-family:Arial,sans-serif}
header{background:#28a745;color:#fff;padding:20px;text-align:center}
.container{max-width:500px;margin:50px auto;padding:30px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);text-align:center}
.btn{display:inline-block;padding:15px 30px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;margin:10px;width:100%;height:60px}
.btn-success{background:#28a745;color:#fff}
.btn-primary{background:#007bff;color:#fff}
.btn-secondary{background:#6c757d;color:#fff}
.field{margin-bottom:20px;text-align:right}
label{display:block;margin-bottom:10px;font-weight:bold}
input[type="tel"],select{width:100%;padding:12px;border:2px solid #28a745;border-radius:6px;box-sizing:border-box;font-size:16px}
</style>
</head>
<body>
<header>
<h1>🏭 لوحة المخزن</h1>
</header>
<div class="container">
<h2>اختر خيارك</h2>
<div class="field">
<button class="btn btn-success" onclick="registerNew()">
إنشاء مخزن جديد
</button>
</div>
<div class="field">
<button class="btn btn-primary" onclick="loginExisting()">
دخول مخزن موجود
</button>
</div>
</div>
<script>
function registerNew(){
localStorage.setItem('warehouseAction','register');
window.location.href='warehouse-register.html';
}
function loginExisting(){
localStorage.setItem('warehouseAction','login');
window.location.href='warehouse-login-form.html';
}
</script>
</body>
</html>
