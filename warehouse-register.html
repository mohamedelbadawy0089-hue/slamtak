<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلامتك - تسجيل مخزن جديد</title>
<style>
body{margin:0;padding:0;background:#f8f9fa;color:#000;font-family:Arial,sans-serif}
header{background:#28a745;color:#fff;padding:20px;text-align:center}
.container{max-width:500px;margin:50px auto;padding:30px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.btn{display:inline-block;padding:15px 30px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;margin:10px;width:100%}
.btn-success{background:#28a745;color:#fff}
.btn-secondary{background:#6c757d;color:#fff}
.field{margin-bottom:20px;text-align:right}
label{display:block;margin-bottom:10px;font-weight:bold}
input[type="text"],input[type="password"],select{width:100%;padding:12px;border:2px solid #28a745;border-radius:6px;box-sizing:border-box;font-size:16px}
.show-btn{padding:5px 10px;font-size:14px;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer;margin-top:5px}
.error{color:#dc3545;font-size:14px;margin-top:5px;display:none}
</style>
</head>
<body>
<header>
<h1>🏭 إنشاء مخزن جديد</h1>
</header>
<div class="container">
<form id="registerForm">
<div class="field">
<label for="name">اسم المخزن *</label>
<input type="text" id="name" required placeholder="اسم المخزن">
</div>
<div class="field">
<label for="password">كلمة مرور الموظف *</label>
<input type="password" id="password" required placeholder="كلمة المرور">
<button type="button" class="show-btn" onclick="togglePassword('password')">إظهار</button>
<div class="error" id="passwordError">خطأ في كلمة المرور</div>
</div>
<div class="field">
<label for="adminPassword">كلمة سر المدير *</label>
<input type="password" id="adminPassword" required placeholder="كلمة سر خاصة بالمدير">
<button type="button" class="show-btn" onclick="togglePassword('adminPassword')">إظهار</button>
</div>
<div class="field">
<label for="confirmAdminPassword">تأكيد كلمة سر المدير *</label>
<input type="password" id="confirmAdminPassword" required placeholder="أعد كتابة كلمة سر المدير">
<button type="button" class="show-btn" onclick="togglePassword('confirmAdminPassword')">إظهار</button>
<div class="error" id="adminPasswordError">⚠️ كلمتا سر المدير غير متطابقتين</div>
</div>
<div class="field">
<label for="province">المحافظة</label>
<select id="province">
<option value="">اختر المحافظة</option>
<option value="الرياض">الرياض</option>
<option value="جدة">جدة</option>
<option value="الدمام">الدمام</option>
</select>
</div>
<button class="btn btn-success" type="submit">حفظ وفتح لوحة المخزن</button>
<div class="error" id="generalError"></div>
</form>
<button class="btn btn-secondary" onclick="window.location.href='warehouse-login.html'">لدي حساب</button>
</div>
<script>
const DB_NAME='SalamatkDB'; 
const DB_VERSION=6; 
const STORE='warehouses';
function togglePassword(id){
const field = document.getElementById(id);
const btn = event.target;
if(field.type === 'password'){
field.type = 'text';
btn.textContent = 'إخفاء';
} else {
field.type = 'password';
btn.textContent = 'إظهار';
}
}
document.getElementById('registerForm').addEventListener('submit',async(e)=>{
e.preventDefault();
const name = document.getElementById('name').value.trim();
const password = document.getElementById('password').value;
const adminPassword = document.getElementById('adminPassword').value;
const confirmAdminPassword = document.getElementById('confirmAdminPassword').value;
const province = document.getElementById('province').value || 'غير محدد';

// ✅ التحقق من الاسم
if(!name || name.length < 3){
document.getElementById('generalError').textContent = 'اسم المخزن قصير جداً';
document.getElementById('generalError').style.display = 'block';
return;
}

// ✅ التحقق من باسورد الموظف
if(password.length < 6){
document.getElementById('passwordError').style.display = 'block';
return;
}

// ✅ التحقق من باسورد المدير
if(adminPassword.length < 6){
document.getElementById('adminPasswordError').textContent = '⚠️ كلمة سر المدير يجب أن تكون 6 أحرف على الأقل';
document.getElementById('adminPasswordError').style.display = 'block';
return;
}

// ✅ التحقق من تطابق باسورد المدير
if(adminPassword !== confirmAdminPassword){
document.getElementById('adminPasswordError').textContent = '⚠️ كلمتا سر المدير غير متطابقتين';
document.getElementById('adminPasswordError').style.display = 'block';
return;
}

// إخفاء رسالة الخطأ إذا كان كل شيء صحيحاً
document.getElementById('adminPasswordError').style.display = 'none';

const data={
name: name,
password: password,
admin_key: adminPassword, // ✅ حفظ باسورد المدير
province: province,
timestamp:new Date().toISOString()
};
try{
const request=indexedDB.open(DB_NAME,DB_VERSION);
request.onsuccess=()=>{
const db=request.result;
const tx=db.transaction([STORE],'readwrite');
const store=tx.objectStore(STORE);
const req=store.add(data);
req.onsuccess=()=>{
localStorage.setItem('warehouseData',JSON.stringify(data));
window.location.href='warehouse.html';
};
req.onerror=()=>{
document.getElementById('generalError').textContent = 'خطأ في تسجيل البيانات: البيانات موجودة مسبقاً';
document.getElementById('generalError').style.display = 'block';
};
};
request.onerror=()=>{
document.getElementById('generalError').textContent = 'خطأ في قاعدة البيانات';
document.getElementById('generalError').style.display = 'block';
};
}catch(e){
document.getElementById('generalError').textContent = 'خطأ غير متوقع: ' + e.message;
document.getElementById('generalError').style.display = 'block';
}
});
</script>
</body>
</html>
